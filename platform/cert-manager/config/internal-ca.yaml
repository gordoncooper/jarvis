# ClusterIssuer reads Secret cert-manager-ca in the controller namespace.
# platform-configs postBuild fills ${dns_suffix}.
# Prune stays off. Deleting the issuer leaves issued certificates with no issuer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  ca:
    secretName: cert-manager-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: platform-cert-manager
spec:
  secretName: wildcard-tls
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  dnsNames:
    - "*.${dns_suffix}"
---
# Hosted apps: one wildcard one level down, <name>.apps.${dns_suffix}, so no app has its
# own certificate. A separate Certificate, so adding it leaves core's wildcard and its key alone.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apps
  namespace: platform-cert-manager
spec:
  secretName: wildcard-apps-tls
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  dnsNames:
    - "*.apps.${dns_suffix}"
---
# Traefik serves the default certificate unless a store certificate matches the SNI name.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: platform-cert-manager
spec:
  defaultCertificate:
    secretName: wildcard-tls
  certificates:
    - secretName: wildcard-apps-tls
