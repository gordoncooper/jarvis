# Chart v1.21.3. CRDs are templates, off unless crds.enabled is set.
# An empty clusterResourceNamespace makes the chart pass
# --cluster-resource-namespace=$(POD_NAMESPACE), so ClusterIssuers read
# Secrets from targetNamespace. Secret cert-manager-ca is already there.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
  # Prune stays off so a path move cannot uninstall the controller.
  # crds.keep defaults to true, so the CRDs and Certificates stay either way.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  releaseName: cert-manager
  targetNamespace: platform-cert-manager
  chart:
    spec:
      chart: cert-manager
      # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    # Chart appVersion v1.21.3. tag and digest render as repository:tag@digest.
    image:
      # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-controller
      tag: "v1.21.3"
      digest: "sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc"
    # D30. CPU request, memory request and limit, no CPU limit.
    resources: &platformResources
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    webhook:
      image:
        # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-webhook
        tag: "v1.21.3"
        digest: "sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458"
      resources: *platformResources
    cainjector:
      image:
        # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-cainjector
        tag: "v1.21.3"
        digest: "sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f"
      resources: *platformResources
    # The controller passes this image to HTTP-01 solver pods.
    acmesolver:
      image:
        # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-acmesolver
        tag: "v1.21.3"
        digest: "sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7"
    startupapicheck:
      image:
        # renovate: datasource=docker depName=quay.io/jetstack/cert-manager-startupapicheck
        tag: "v1.21.3"
        digest: "sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1"
      resources: *platformResources
