# App hosting, optional and off by default. An env turns it on with one name in
# envs/<env>/values/switches.yaml:
#
#   optional:
#     - app-hosting
#
# and off by removing it (with its app list). It is a Component, not a directory under
# resources, because it adds to an object platform-configs already has: TLSStore default
# serves the apps wildcard. Without the name, the env renders none of this.
# The per-app wiring (app/) is applied by each app's own wiring Kustomization, not here.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - crd/app-crd.yaml
  - kyverno-rbac.yaml
  - policies/admission.yaml
  - policies/derive.yaml
  - priority.yaml
  - grant-revoke.yaml
  - certificate.yaml
patches:
  - target:
      group: traefik.io
      kind: TLSStore
      name: default
      namespace: platform-cert-manager
    patch: |-
      - op: add
        path: /spec/certificates
        value:
          - secretName: wildcard-apps-tls
