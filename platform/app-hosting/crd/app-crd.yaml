# The app file. Every hosted app folder holds one App, <name>/app.yaml, and the cluster reads
# it as this object in namespace app-<name>. The API server refuses an App that breaks this
# schema; tools/app-check also refuses unknown keys, which the API server prunes unread.
# Prune stays off: removing the CRD would delete every App, and with them every app's admission params.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.hosting.jarvis.io
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  group: hosting.jarvis.io
  names:
    kind: App
    listKind: AppList
    plural: apps
    singular: app
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [webPort, volumes]
              properties:
                webPort:
                  description: The container port Traefik reaches, or none for an app with no web UI.
                  x-kubernetes-int-or-string: true
                  x-kubernetes-validations:
                    - rule: "type(self) == int ? (self >= 1 && self <= 65535) : self == 'none'"
                      message: webPort is a port number (1-65535) or none
                volumes:
                  description: Every PVC the app keeps, each backed up or not.
                  type: array
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, backup]
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                      backup:
                        type: boolean
                resources: &resources
                  description: The namespace's total limits. Default 500m CPU and 512Mi memory.
                  type: object
                  properties:
                    cpu:
                      type: string
                      pattern: "^[0-9]+(\\.[0-9]+)?m?$"
                    memory:
                      type: string
                      pattern: "^[0-9]+(Ki|Mi|Gi)$"
                internet:
                  description: Egress to TCP 443 on the internet. Default false.
                  type: boolean
                talksTo: &app-names
                  description: Apps this app may call. The other app must list this one under acceptsFrom.
                  type: array
                  maxItems: 32
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    maxLength: 59
                    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                acceptsFrom: *app-names
                ports:
                  description: Extra container ports, cluster-internal unless lan is true.
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [port, protocol]
                    properties:
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                      protocol:
                        type: string
                        enum: [TCP, UDP]
                      lan:
                        description: Ask for this port on the home network. Needs the env's lan-port exception.
                        type: boolean
                risky:
                  description: Items the app asks for. Each needs the env's matching exception line.
                  type: object
                  properties:
                    privileged:
                      type: boolean
                    root:
                      type: boolean
                    hostNetwork:
                      type: boolean
                    hostPath:
                      type: boolean
                    hostnames:
                      type: array
                      maxItems: 8
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        maxLength: 253
                        pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?\\.)+[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                envs:
                  description: Per-env overrides of internet and resources, keyed by env name.
                  type: object
                  maxProperties: 16
                  additionalProperties:
                    type: object
                    properties:
                      internet:
                        type: boolean
                      resources: *resources
