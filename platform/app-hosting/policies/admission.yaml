# Native admission for hosted apps. The API server runs these with no webhook, and each
# policy fails closed: an expression that errors refuses the request.
#
# app-identity: a namespace is an app's namespace exactly when it is named app-<name> and
# labelled hosting.jarvis.io/app: <name>; an App lives only in its own namespace and is named
# after it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-identity
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
      - apiGroups: [hosting.jarvis.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [apps]
  variables:
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
    - expression: >-
        object.kind != 'Namespace' ||
        (object.metadata.name.startsWith('app-') ?
          variables.labels[?'hosting.jarvis.io/app'].orValue('') != '' &&
          'app-' + variables.labels[?'hosting.jarvis.io/app'].orValue('') == object.metadata.name :
          !('hosting.jarvis.io/app' in variables.labels))
      message: "a namespace is named app-<name> exactly when it carries label hosting.jarvis.io/app: <name>"
    - expression: "object.kind != 'App' || object.metadata.namespace == 'app-' + object.metadata.name"
      message: "an App lives in its own namespace app-<name> and is named <name>"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-identity
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: app-identity
  validationActions: [Deny]
---
# app-tenant: what an app's own Flux identity (flux-system/app-<name>, which
# kustomize-controller impersonates) may write: only in namespace app-<name>, and only the
# kinds an app ships. No Traefik CRD, NetworkPolicy, quota, RBAC, Flux, VolSync or
# cluster-scoped object, whatever its Role says.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-tenant
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: ["*", "*/*"]
        scope: "*"
  matchConditions:
    - name: app-tenant
      expression: "request.userInfo.username.startsWith('system:serviceaccount:flux-system:app-')"
  validations:
    # The account flux-system/app-<name> writes only in namespace app-<name>.
    - expression: "request.namespace == request.userInfo.username.substring(34)"
      message: "an app writes only in its own namespace app-<name>"
    - expression: >-
        (!has(request.subResource) || request.subResource == '') &&
        (request.resource.group + '/' + request.resource.resource) in [
          '/configmaps', '/secrets', '/services', '/persistentvolumeclaims',
          'apps/deployments', 'apps/statefulsets', 'batch/jobs', 'batch/cronjobs',
          'networking.k8s.io/ingresses', 'policy/poddisruptionbudgets',
          'autoscaling/horizontalpodautoscalers', 'hosting.jarvis.io/apps']
      message: >-
        an app ships only ConfigMaps, Secrets, Services, PVCs, Deployments, StatefulSets, Jobs,
        CronJobs, Ingresses, PodDisruptionBudgets, HorizontalPodAutoscalers and its App
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-tenant
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: app-tenant
  validationActions: [Deny]
---
# app-file and app-grants: the objects in an app's namespace against the pod baseline. Each
# app's wiring binds both to that namespace. app-file reads the app's own App: an object
# matches what the file declares, and a risky item is one the file asks for. app-grants reads
# ConfigMap flux-system/app-<name>-grants, which only the wiring writes from the env's
# exception lines: a risky item is one the env grants. A risky item passes only both. A
# missing App or grants ConfigMap refuses everything the policy matches.
# Carve-outs, keyed on identities a tenant cannot take: the VolSync controller's own Jobs
# and claims (its privileged movers), and the pods the job controller makes for a Job, whose
# template these policies already admitted unless VolSync made it.
# The two policies share their match, carve-outs and variables word for word; a test holds them equal.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-file
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: hosting.jarvis.io/v1alpha1
    kind: App
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, persistentvolumeclaims, services]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
  matchConditions:
    - name: not-the-volsync-controller
      expression: "request.userInfo.username != 'system:serviceaccount:volsync:volsync'"
    - name: not-a-job-pod
      expression: >-
        !(object.kind == 'Pod' &&
          request.userInfo.username in ['system:serviceaccount:kube-system:job-controller', 'system:kube-controller-manager'] &&
          has(object.metadata.ownerReferences) &&
          object.metadata.ownerReferences.exists(o, o.kind == 'Job' && has(o.controller) && o.controller))
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.kind in ['Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job'] ? object.spec.template.spec :
        {}
    - name: containers
      expression: >-
        !has(variables.podSpec.containers) ? [] :
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
    - name: podSecurity
      expression: "has(variables.podSpec.securityContext) ? variables.podSpec.securityContext : {}"
    - name: podAnnotations
      expression: >-
        object.kind == 'Pod' ? (has(object.metadata.annotations) ? object.metadata.annotations : {}) :
        object.kind == 'CronJob' ?
          (has(object.spec.jobTemplate.spec.template.metadata) && has(object.spec.jobTemplate.spec.template.metadata.annotations) ?
           object.spec.jobTemplate.spec.template.metadata.annotations : {}) :
        object.kind in ['Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job'] ?
          (has(object.spec.template.metadata) && has(object.spec.template.metadata.annotations) ?
           object.spec.template.metadata.annotations : {}) :
        {}
    # Pod Security restricted's seccomp: each container's own profile, or else the pod's, is
    # RuntimeDefault or Localhost.
    - name: podSeccompSet
      expression: >-
        has(variables.podSecurity.seccompProfile) && variables.podSecurity.seccompProfile.type in ['RuntimeDefault', 'Localhost']
    # Pod Security baseline's SELinux options: no user or role, and a container type only.
    - name: badSELinux
      expression: >-
        ((has(variables.podSecurity.seLinuxOptions) ? [variables.podSecurity.seLinuxOptions] : []) +
         variables.containers.filter(c, has(c.securityContext) && has(c.securityContext.seLinuxOptions))
           .map(c, c.securityContext.seLinuxOptions)
        ).exists(o,
          (has(o.type) && !(o.type in ['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t'])) ||
          (has(o.user) && o.user != '') || (has(o.role) && o.role != ''))
    # Beyond Pod Security restricted: privileged mode, host PID or IPC, sysctls, privilege
    # escalation, a capability other than NET_BIND_SERVICE or not dropping ALL, a seccomp
    # profile that is unset or Unconfined, an unmasked /proc, an unconfined AppArmor profile,
    # or SELinux options outside the container types.
    - name: usesPrivileged
      expression: >-
        (has(variables.podSpec.hostPID) && variables.podSpec.hostPID) ||
        (has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC) ||
        has(variables.podSecurity.sysctls) ||
        (has(variables.podSecurity.seccompProfile) && variables.podSecurity.seccompProfile.type == 'Unconfined') ||
        (has(variables.podSecurity.appArmorProfile) && variables.podSecurity.appArmorProfile.type == 'Unconfined') ||
        variables.podAnnotations.exists(k, k.startsWith('container.apparmor.security.beta.kubernetes.io/') &&
          !(variables.podAnnotations[k] == 'runtime/default' || variables.podAnnotations[k].startsWith('localhost/'))) ||
        variables.badSELinux ||
        variables.containers.exists(c, !has(c.securityContext) ||
          !has(c.securityContext.allowPrivilegeEscalation) || c.securityContext.allowPrivilegeEscalation ||
          (has(c.securityContext.privileged) && c.securityContext.privileged) ||
          (has(c.securityContext.seccompProfile) ?
            !(c.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost']) : !variables.podSeccompSet) ||
          !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.drop) ||
          !('ALL' in c.securityContext.capabilities.drop) ||
          (has(c.securityContext.capabilities.add) &&
           c.securityContext.capabilities.add.exists(cap, cap != 'NET_BIND_SERVICE')) ||
          (has(c.securityContext.procMount) && c.securityContext.procMount != 'Default') ||
          (has(c.securityContext.appArmorProfile) && c.securityContext.appArmorProfile.type == 'Unconfined'))
    # Volume types a pod may use. Others (nfs, iscsi, rbd, cephfs and the like) mount from the
    # node's network, where no NetworkPolicy applies. hostPath is its own risky item.
    - name: usesOtherVolume
      expression: >-
        has(variables.podSpec.volumes) && variables.podSpec.volumes.exists(v, !(
          has(v.configMap) || has(v.secret) || has(v.emptyDir) || has(v.persistentVolumeClaim) ||
          has(v.projected) || has(v.downwardAPI) || has(v.csi) || has(v.ephemeral) || has(v.hostPath)))
    - name: usesHostNetwork
      expression: >-
        (has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork) ||
        variables.containers.exists(c, has(c.ports) && c.ports.exists(p, has(p.hostPort) && p.hostPort != 0))
    - name: usesHostPath
      expression: "has(variables.podSpec.volumes) && variables.podSpec.volumes.exists(v, has(v.hostPath))"
    - name: usesRoot
      expression: >-
        (has(variables.podSecurity.runAsUser) && variables.podSecurity.runAsUser == 0) ||
        variables.containers.exists(c, has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0) ||
        !variables.containers.all(c,
          (has(c.securityContext) && has(c.securityContext.runAsNonRoot)) ? c.securityContext.runAsNonRoot :
          (has(variables.podSecurity.runAsNonRoot) && variables.podSecurity.runAsNonRoot))
    - name: hosts
      expression: "object.kind == 'Ingress' && has(object.spec.rules) ? object.spec.rules.map(r, has(r.host) ? r.host : '') : []"
    - name: lanPorts
      expression: >-
        object.kind == 'Service' && has(object.spec.type) && object.spec.type == 'LoadBalancer' ?
        object.spec.ports.map(p, string(p.port) + '/' + (has(p.protocol) ? p.protocol : 'TCP')) : []
  validations:
    - expression: "params.metadata.namespace == namespaceObject.metadata.name"
      message: "the binding's App is not this namespace's"
    - expression: "!variables.usesPrivileged || (has(params.spec.risky) && has(params.spec.risky.privileged) && params.spec.risky.privileged)"
      message: >-
        anything beyond Pod Security restricted (privileged mode, host PID or IPC, sysctls,
        allowPrivilegeEscalation not false, capabilities not dropping ALL or adding more than
        NET_BIND_SERVICE, a seccomp profile not RuntimeDefault or Localhost, procMount Unmasked,
        AppArmor unconfined, SELinux options beyond a container type) needs the app file's risky.privileged
    - expression: "!variables.usesOtherVolume"
      message: "a pod's volumes are configMap, secret, emptyDir, persistentVolumeClaim, projected, downwardAPI, csi or ephemeral"
    - expression: "!variables.usesRoot || (has(params.spec.risky) && has(params.spec.risky.root) && params.spec.risky.root)"
      message: "every container runs with runAsNonRoot: true and no runAsUser 0, unless the app file asks for risky.root"
    - expression: "!variables.usesHostNetwork || (has(params.spec.risky) && has(params.spec.risky.hostNetwork) && params.spec.risky.hostNetwork)"
      message: "host network and host ports need the app file's risky.hostNetwork"
    - expression: "!variables.usesHostPath || (has(params.spec.risky) && has(params.spec.risky.hostPath) && params.spec.risky.hostPath)"
      message: "hostPath volumes need the app file's risky.hostPath"
    - expression: >-
        (object.kind == 'PersistentVolumeClaim' ? [object] :
         object.kind == 'StatefulSet' && has(object.spec.volumeClaimTemplates) ? object.spec.volumeClaimTemplates : []
        ).all(claim, params.spec.volumes.exists(v,
          (v.name == claim.metadata.name ||
           (object.kind == 'PersistentVolumeClaim' && claim.metadata.name.startsWith(v.name + '-') &&
            request.userInfo.username == 'system:serviceaccount:kube-system:statefulset-controller')) &&
          v.backup == !(has(claim.metadata.annotations) && claim.metadata.annotations[?'backup'].orValue('') == 'none')))
      message: >-
        every PVC (and StatefulSet claim template, whose claims the StatefulSet controller names
        <volume>-<set>-<n>) is a volume the app file declares; one declared
        backup: false carries annotation backup: none, one declared backup: true does not
    - expression: >-
        variables.hosts.all(h, h.startsWith(params.metadata.name + '.apps.') ||
          (has(params.spec.risky) && has(params.spec.risky.hostnames) && h in params.spec.risky.hostnames))
      message: "an app's Ingress host is <name>.apps.<dns suffix>, or a custom hostname the app file asks for"
    # A LoadBalancer port is a network.ports entry: listen as its port, the same protocol, and
    # target as its targetPort (a number; the API server defaults an unset one to the port).
    - expression: >-
        object.kind != 'Service' || !has(object.spec.type) || object.spec.type != 'LoadBalancer' ||
        object.spec.ports.all(p, has(params.spec.network) && has(params.spec.network.ports) &&
          params.spec.network.ports.exists(q, q.listen == p.port &&
            q.protocol == (has(p.protocol) ? p.protocol : 'TCP') &&
            (has(p.targetPort) ? p.targetPort : p.port) == q.target))
      message: "a LoadBalancer port is one of the app file's network.ports: listen as port, its protocol, and target as a numeric targetPort"
    # ServiceLB publishes on the edge nodes with no node port; one would open the port on every node.
    - expression: >-
        object.kind != 'Service' || !has(object.spec.type) || object.spec.type != 'LoadBalancer' ||
        (has(object.spec.allocateLoadBalancerNodePorts) && !object.spec.allocateLoadBalancerNodePorts)
      message: "an app's LoadBalancer sets allocateLoadBalancerNodePorts: false"
    # Every app pod runs at the lowest priority, so the kubelet evicts it first and it never
    # preempts core. ClusterPolicy app-priority sets the class; this refuses any other.
    - expression: >-
        !has(variables.podSpec.containers) ||
        (has(variables.podSpec.priorityClassName) && variables.podSpec.priorityClassName == 'hosted-app')
      message: "an app's pods run at PriorityClass hosted-app, which core sets on its workloads; no other class"
    # Traefik reads its router settings from annotations; an app keeps only the two its web
    # address needs, on Traefik's class. The entrypoint is required: without it Traefik serves
    # the route on every entrypoint, plain HTTP included.
    - expression: >-
        object.kind != 'Ingress' ||
        (has(object.spec.ingressClassName) && object.spec.ingressClassName == 'traefik' &&
         has(object.metadata.annotations) &&
         object.metadata.annotations[?'traefik.ingress.kubernetes.io/router.entrypoints'].orValue('') == 'websecure' &&
         object.metadata.annotations.all(k,
           !(k.startsWith('traefik.') || k.contains('traefik.io/') || k.contains('ingress.kubernetes.io/') ||
             k == 'kubernetes.io/ingress.class') ||
           (k == 'traefik.ingress.kubernetes.io/router.entrypoints' && object.metadata.annotations[k] == 'websecure') ||
           (k == 'traefik.ingress.kubernetes.io/router.tls' && object.metadata.annotations[k] == 'true')))
      message: >-
        an app's Ingress sets ingressClassName: traefik and router.entrypoints: websecure, and of
        Traefik's and other ingress controllers' annotations carries only that and router.tls: "true"
    - expression: >-
        object.kind != 'Service' || !has(object.metadata.annotations) ||
        object.metadata.annotations.all(k, !(k.startsWith('traefik.') || k.contains('traefik.io/')))
      message: "an app's Service carries no Traefik annotation"
    # A claim binds only to the volume the cluster provisions for it: no pre-chosen volume and
    # no copy of another claim or snapshot. The volume binder sets volumeName when the claim
    # binds; it stays as it is after that.
    - expression: >-
        (object.kind == 'PersistentVolumeClaim' ? [object.spec] :
         object.kind == 'StatefulSet' && has(object.spec.volumeClaimTemplates) ?
           object.spec.volumeClaimTemplates.map(t, has(t.spec) ? t.spec : {}) : []
        ).all(s, !has(s.dataSource) && !has(s.dataSourceRef) &&
          (!has(s.volumeName) || s.volumeName == '' ||
           (object.kind == 'PersistentVolumeClaim' &&
            (request.userInfo.username in ['system:serviceaccount:kube-system:persistent-volume-binder', 'system:kube-controller-manager'] ||
             (oldObject != null && has(oldObject.spec.volumeName) && oldObject.spec.volumeName == s.volumeName)))))
      message: "an app's PVCs and claim templates set no volumeName, dataSource or dataSourceRef; the volume binder binds them"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-grants
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, persistentvolumeclaims, services]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
  matchConditions:
    - name: not-the-volsync-controller
      expression: "request.userInfo.username != 'system:serviceaccount:volsync:volsync'"
    - name: not-a-job-pod
      expression: >-
        !(object.kind == 'Pod' &&
          request.userInfo.username in ['system:serviceaccount:kube-system:job-controller', 'system:kube-controller-manager'] &&
          has(object.metadata.ownerReferences) &&
          object.metadata.ownerReferences.exists(o, o.kind == 'Job' && has(o.controller) && o.controller))
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.kind in ['Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job'] ? object.spec.template.spec :
        {}
    - name: containers
      expression: >-
        !has(variables.podSpec.containers) ? [] :
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
    - name: podSecurity
      expression: "has(variables.podSpec.securityContext) ? variables.podSpec.securityContext : {}"
    - name: podAnnotations
      expression: >-
        object.kind == 'Pod' ? (has(object.metadata.annotations) ? object.metadata.annotations : {}) :
        object.kind == 'CronJob' ?
          (has(object.spec.jobTemplate.spec.template.metadata) && has(object.spec.jobTemplate.spec.template.metadata.annotations) ?
           object.spec.jobTemplate.spec.template.metadata.annotations : {}) :
        object.kind in ['Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job'] ?
          (has(object.spec.template.metadata) && has(object.spec.template.metadata.annotations) ?
           object.spec.template.metadata.annotations : {}) :
        {}
    # Pod Security restricted's seccomp: each container's own profile, or else the pod's, is
    # RuntimeDefault or Localhost.
    - name: podSeccompSet
      expression: >-
        has(variables.podSecurity.seccompProfile) && variables.podSecurity.seccompProfile.type in ['RuntimeDefault', 'Localhost']
    # Pod Security baseline's SELinux options: no user or role, and a container type only.
    - name: badSELinux
      expression: >-
        ((has(variables.podSecurity.seLinuxOptions) ? [variables.podSecurity.seLinuxOptions] : []) +
         variables.containers.filter(c, has(c.securityContext) && has(c.securityContext.seLinuxOptions))
           .map(c, c.securityContext.seLinuxOptions)
        ).exists(o,
          (has(o.type) && !(o.type in ['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t'])) ||
          (has(o.user) && o.user != '') || (has(o.role) && o.role != ''))
    # Beyond Pod Security restricted: privileged mode, host PID or IPC, sysctls, privilege
    # escalation, a capability other than NET_BIND_SERVICE or not dropping ALL, a seccomp
    # profile that is unset or Unconfined, an unmasked /proc, an unconfined AppArmor profile,
    # or SELinux options outside the container types.
    - name: usesPrivileged
      expression: >-
        (has(variables.podSpec.hostPID) && variables.podSpec.hostPID) ||
        (has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC) ||
        has(variables.podSecurity.sysctls) ||
        (has(variables.podSecurity.seccompProfile) && variables.podSecurity.seccompProfile.type == 'Unconfined') ||
        (has(variables.podSecurity.appArmorProfile) && variables.podSecurity.appArmorProfile.type == 'Unconfined') ||
        variables.podAnnotations.exists(k, k.startsWith('container.apparmor.security.beta.kubernetes.io/') &&
          !(variables.podAnnotations[k] == 'runtime/default' || variables.podAnnotations[k].startsWith('localhost/'))) ||
        variables.badSELinux ||
        variables.containers.exists(c, !has(c.securityContext) ||
          !has(c.securityContext.allowPrivilegeEscalation) || c.securityContext.allowPrivilegeEscalation ||
          (has(c.securityContext.privileged) && c.securityContext.privileged) ||
          (has(c.securityContext.seccompProfile) ?
            !(c.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost']) : !variables.podSeccompSet) ||
          !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.drop) ||
          !('ALL' in c.securityContext.capabilities.drop) ||
          (has(c.securityContext.capabilities.add) &&
           c.securityContext.capabilities.add.exists(cap, cap != 'NET_BIND_SERVICE')) ||
          (has(c.securityContext.procMount) && c.securityContext.procMount != 'Default') ||
          (has(c.securityContext.appArmorProfile) && c.securityContext.appArmorProfile.type == 'Unconfined'))
    # Volume types a pod may use. Others (nfs, iscsi, rbd, cephfs and the like) mount from the
    # node's network, where no NetworkPolicy applies. hostPath is its own risky item.
    - name: usesOtherVolume
      expression: >-
        has(variables.podSpec.volumes) && variables.podSpec.volumes.exists(v, !(
          has(v.configMap) || has(v.secret) || has(v.emptyDir) || has(v.persistentVolumeClaim) ||
          has(v.projected) || has(v.downwardAPI) || has(v.csi) || has(v.ephemeral) || has(v.hostPath)))
    - name: usesHostNetwork
      expression: >-
        (has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork) ||
        variables.containers.exists(c, has(c.ports) && c.ports.exists(p, has(p.hostPort) && p.hostPort != 0))
    - name: usesHostPath
      expression: "has(variables.podSpec.volumes) && variables.podSpec.volumes.exists(v, has(v.hostPath))"
    - name: usesRoot
      expression: >-
        (has(variables.podSecurity.runAsUser) && variables.podSecurity.runAsUser == 0) ||
        variables.containers.exists(c, has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0) ||
        !variables.containers.all(c,
          (has(c.securityContext) && has(c.securityContext.runAsNonRoot)) ? c.securityContext.runAsNonRoot :
          (has(variables.podSecurity.runAsNonRoot) && variables.podSecurity.runAsNonRoot))
    - name: hosts
      expression: "object.kind == 'Ingress' && has(object.spec.rules) ? object.spec.rules.map(r, has(r.host) ? r.host : '') : []"
    - name: lanPorts
      expression: >-
        object.kind == 'Service' && has(object.spec.type) && object.spec.type == 'LoadBalancer' ?
        object.spec.ports.map(p, string(p.port) + '/' + (has(p.protocol) ? p.protocol : 'TCP')) : []
  validations:
    - expression: "!variables.usesPrivileged || params.data[?'privileged'].orValue('') == 'true'"
      message: "anything beyond Pod Security restricted (see app-file) needs the env's '<app>: privileged' exception"
    - expression: "!variables.usesRoot || params.data[?'root'].orValue('') == 'true'"
      message: "every container runs with runAsNonRoot: true and no runAsUser 0, unless the env has '<app>: root'"
    - expression: "!variables.usesHostNetwork || params.data[?'host-network'].orValue('') == 'true'"
      message: "host network and host ports need the env's '<app>: host-network' exception"
    - expression: "!variables.usesHostPath || params.data[?'host-path'].orValue('') == 'true'"
      message: "hostPath volumes need the env's '<app>: host-path' exception"
    - expression: >-
        object.kind != 'Ingress' ||
        (!has(object.spec.defaultBackend) && !has(object.spec.tls) && has(object.spec.rules) &&
         variables.hosts.all(h, h == params.data[?'host'].orValue('-') ||
           h in params.data[?'hostnames'].orValue('').split(',')))
      message: >-
        an app's Ingress host is <name>.apps.<dns suffix>, or a custom hostname the env grants as
        '<app>: hostname <name>'; no default backend and no spec.tls (the apps wildcard serves it)
    - expression: >-
        object.kind != 'Service' || !has(object.spec.type) || object.spec.type in ['ClusterIP', 'LoadBalancer']
      message: "an app's Services are ClusterIP, or LoadBalancer for its network.ports; no NodePort or ExternalName"
    - expression: "object.kind != 'Service' || !has(object.spec.externalIPs)"
      message: "an app's Service sets no externalIPs"
    - expression: "variables.lanPorts.all(p, p in params.data[?'lan-ports'].orValue('').split(','))"
      message: "a LoadBalancer exposes only ports the env grants as '<app>: lan-port <port>/<protocol>'"
