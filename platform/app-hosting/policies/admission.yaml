# Native admission for hosted apps. The API server runs these with no webhook, and each
# policy fails closed: an expression that errors refuses the request.
#
# app-identity: a namespace is an app's namespace exactly when it is named app-<name> and
# labelled hosting.jarvis.io/app: <name>; an App lives only in its own namespace and is named
# after it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-identity
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
      - apiGroups: [hosting.jarvis.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [apps]
  variables:
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
    - expression: >-
        object.kind != 'Namespace' ||
        (object.metadata.name.startsWith('app-') ?
          variables.labels[?'hosting.jarvis.io/app'].orValue('') != '' &&
          'app-' + variables.labels[?'hosting.jarvis.io/app'].orValue('') == object.metadata.name :
          !('hosting.jarvis.io/app' in variables.labels))
      message: "a namespace is named app-<name> exactly when it carries label hosting.jarvis.io/app: <name>"
    - expression: "object.kind != 'App' || object.metadata.namespace == 'app-' + object.metadata.name"
      message: "an App lives in its own namespace app-<name> and is named <name>"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-identity
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: app-identity
  validationActions: [Deny]
---
# app-tenant: what an app's own Flux identity (flux-system/app-<name>, which
# kustomize-controller impersonates) may write: only in namespace app-<name>, and only the
# kinds an app ships. No Traefik CRD, NetworkPolicy, quota, RBAC, Flux, VolSync or
# cluster-scoped object, whatever its Role says.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-tenant
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: ["*", "*/*"]
        scope: "*"
  matchConditions:
    - name: app-tenant
      expression: "request.userInfo.username.startsWith('system:serviceaccount:flux-system:app-')"
  validations:
    # The account flux-system/app-<name> writes only in namespace app-<name>.
    - expression: "request.namespace == request.userInfo.username.substring(34)"
      message: "an app writes only in its own namespace app-<name>"
    - expression: >-
        (!has(request.subResource) || request.subResource == '') &&
        (request.resource.group + '/' + request.resource.resource) in [
          '/configmaps', '/secrets', '/services', '/persistentvolumeclaims',
          'apps/deployments', 'apps/statefulsets', 'batch/jobs', 'batch/cronjobs',
          'networking.k8s.io/ingresses', 'policy/poddisruptionbudgets',
          'autoscaling/horizontalpodautoscalers', 'hosting.jarvis.io/apps']
      message: >-
        an app ships only ConfigMaps, Secrets, Services, PVCs, Deployments, StatefulSets, Jobs,
        CronJobs, Ingresses, PodDisruptionBudgets, HorizontalPodAutoscalers and its App
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-tenant
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: app-tenant
  validationActions: [Deny]
---
# app-file and app-grants: the objects in an app's namespace against the pod baseline. Each
# app's wiring binds both to that namespace. app-file reads the app's own App: an object
# matches what the file declares, and a risky item is one the file asks for. app-grants reads
# ConfigMap flux-system/app-<name>-grants, which only the wiring writes from the env's
# exception lines: a risky item is one the env grants. A risky item passes only both. A
# missing App or grants ConfigMap refuses everything the policy matches.
# Carve-outs, keyed on identities a tenant cannot take: the VolSync controller's own Jobs
# and claims (its privileged movers), and the pods the job controller makes for a Job, whose
# template these policies already admitted unless VolSync made it.
# The two policies share their match, carve-outs and variables word for word; a test holds them equal.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-file
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: hosting.jarvis.io/v1alpha1
    kind: App
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, persistentvolumeclaims, services]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
  matchConditions:
    - name: not-the-volsync-controller
      expression: "request.userInfo.username != 'system:serviceaccount:volsync:volsync'"
    - name: not-a-job-pod
      expression: >-
        !(object.kind == 'Pod' &&
          request.userInfo.username in ['system:serviceaccount:kube-system:job-controller', 'system:kube-controller-manager'] &&
          has(object.metadata.ownerReferences) &&
          object.metadata.ownerReferences.exists(o, o.kind == 'Job' && has(o.controller) && o.controller))
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.kind in ['Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job'] ? object.spec.template.spec :
        {}
    - name: containers
      expression: >-
        !has(variables.podSpec.containers) ? [] :
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
    - name: podSecurity
      expression: "has(variables.podSpec.securityContext) ? variables.podSpec.securityContext : {}"
    - name: usesPrivileged
      expression: >-
        (has(variables.podSpec.hostPID) && variables.podSpec.hostPID) ||
        (has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC) ||
        variables.containers.exists(c, has(c.securityContext) && (
          (has(c.securityContext.privileged) && c.securityContext.privileged) ||
          (has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation) ||
          (has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) &&
           c.securityContext.capabilities.add.exists(cap, cap != 'NET_BIND_SERVICE'))))
    - name: usesHostNetwork
      expression: >-
        (has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork) ||
        variables.containers.exists(c, has(c.ports) && c.ports.exists(p, has(p.hostPort) && p.hostPort != 0))
    - name: usesHostPath
      expression: "has(variables.podSpec.volumes) && variables.podSpec.volumes.exists(v, has(v.hostPath))"
    - name: usesRoot
      expression: >-
        (has(variables.podSecurity.runAsUser) && variables.podSecurity.runAsUser == 0) ||
        variables.containers.exists(c, has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0) ||
        !variables.containers.all(c,
          (has(c.securityContext) && has(c.securityContext.runAsNonRoot)) ? c.securityContext.runAsNonRoot :
          (has(variables.podSecurity.runAsNonRoot) && variables.podSecurity.runAsNonRoot))
    - name: hosts
      expression: "object.kind == 'Ingress' && has(object.spec.rules) ? object.spec.rules.map(r, has(r.host) ? r.host : '') : []"
    - name: lanPorts
      expression: >-
        object.kind == 'Service' && has(object.spec.type) && object.spec.type == 'LoadBalancer' ?
        object.spec.ports.map(p, string(p.port) + '/' + (has(p.protocol) ? p.protocol : 'TCP')) : []
  validations:
    - expression: "params.metadata.namespace == namespaceObject.metadata.name"
      message: "the binding's App is not this namespace's"
    - expression: "!variables.usesPrivileged || (has(params.spec.risky) && has(params.spec.risky.privileged) && params.spec.risky.privileged)"
      message: "privileged mode, host PID or IPC, privilege escalation and added capabilities need the app file's risky.privileged"
    - expression: "!variables.usesRoot || (has(params.spec.risky) && has(params.spec.risky.root) && params.spec.risky.root)"
      message: "every container runs with runAsNonRoot: true and no runAsUser 0, unless the app file asks for risky.root"
    - expression: "!variables.usesHostNetwork || (has(params.spec.risky) && has(params.spec.risky.hostNetwork) && params.spec.risky.hostNetwork)"
      message: "host network and host ports need the app file's risky.hostNetwork"
    - expression: "!variables.usesHostPath || (has(params.spec.risky) && has(params.spec.risky.hostPath) && params.spec.risky.hostPath)"
      message: "hostPath volumes need the app file's risky.hostPath"
    - expression: >-
        (object.kind == 'PersistentVolumeClaim' ? [object] :
         object.kind == 'StatefulSet' && has(object.spec.volumeClaimTemplates) ? object.spec.volumeClaimTemplates : []
        ).all(claim, params.spec.volumes.exists(v, v.name == claim.metadata.name &&
          v.backup == !(has(claim.metadata.annotations) && claim.metadata.annotations[?'backup'].orValue('') == 'none')))
      message: >-
        every PVC (and StatefulSet claim template) is a volume the app file declares; one declared
        backup: false carries annotation backup: none, one declared backup: true does not
    - expression: >-
        variables.hosts.all(h, h.startsWith(params.metadata.name + '.apps.') ||
          (has(params.spec.risky) && has(params.spec.risky.hostnames) && h in params.spec.risky.hostnames))
      message: "an app's Ingress host is <name>.apps.<dns suffix>, or a custom hostname the app file asks for"
    - expression: >-
        variables.lanPorts.all(p, has(params.spec.ports) &&
          params.spec.ports.exists(q, string(q.port) + '/' + q.protocol == p && has(q.lan) && q.lan))
      message: "a LoadBalancer exposes only ports the app file marks lan"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-grants
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, persistentvolumeclaims, services]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
  matchConditions:
    - name: not-the-volsync-controller
      expression: "request.userInfo.username != 'system:serviceaccount:volsync:volsync'"
    - name: not-a-job-pod
      expression: >-
        !(object.kind == 'Pod' &&
          request.userInfo.username in ['system:serviceaccount:kube-system:job-controller', 'system:kube-controller-manager'] &&
          has(object.metadata.ownerReferences) &&
          object.metadata.ownerReferences.exists(o, o.kind == 'Job' && has(o.controller) && o.controller))
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.kind in ['Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job'] ? object.spec.template.spec :
        {}
    - name: containers
      expression: >-
        !has(variables.podSpec.containers) ? [] :
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
    - name: podSecurity
      expression: "has(variables.podSpec.securityContext) ? variables.podSpec.securityContext : {}"
    - name: usesPrivileged
      expression: >-
        (has(variables.podSpec.hostPID) && variables.podSpec.hostPID) ||
        (has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC) ||
        variables.containers.exists(c, has(c.securityContext) && (
          (has(c.securityContext.privileged) && c.securityContext.privileged) ||
          (has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation) ||
          (has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) &&
           c.securityContext.capabilities.add.exists(cap, cap != 'NET_BIND_SERVICE'))))
    - name: usesHostNetwork
      expression: >-
        (has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork) ||
        variables.containers.exists(c, has(c.ports) && c.ports.exists(p, has(p.hostPort) && p.hostPort != 0))
    - name: usesHostPath
      expression: "has(variables.podSpec.volumes) && variables.podSpec.volumes.exists(v, has(v.hostPath))"
    - name: usesRoot
      expression: >-
        (has(variables.podSecurity.runAsUser) && variables.podSecurity.runAsUser == 0) ||
        variables.containers.exists(c, has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0) ||
        !variables.containers.all(c,
          (has(c.securityContext) && has(c.securityContext.runAsNonRoot)) ? c.securityContext.runAsNonRoot :
          (has(variables.podSecurity.runAsNonRoot) && variables.podSecurity.runAsNonRoot))
    - name: hosts
      expression: "object.kind == 'Ingress' && has(object.spec.rules) ? object.spec.rules.map(r, has(r.host) ? r.host : '') : []"
    - name: lanPorts
      expression: >-
        object.kind == 'Service' && has(object.spec.type) && object.spec.type == 'LoadBalancer' ?
        object.spec.ports.map(p, string(p.port) + '/' + (has(p.protocol) ? p.protocol : 'TCP')) : []
  validations:
    - expression: "!variables.usesPrivileged || params.data[?'privileged'].orValue('') == 'true'"
      message: "privileged mode, host PID or IPC, privilege escalation and added capabilities need the env's '<app>: privileged' exception"
    - expression: "!variables.usesRoot || params.data[?'root'].orValue('') == 'true'"
      message: "every container runs with runAsNonRoot: true and no runAsUser 0, unless the env has '<app>: root'"
    - expression: "!variables.usesHostNetwork || params.data[?'host-network'].orValue('') == 'true'"
      message: "host network and host ports need the env's '<app>: host-network' exception"
    - expression: "!variables.usesHostPath || params.data[?'host-path'].orValue('') == 'true'"
      message: "hostPath volumes need the env's '<app>: host-path' exception"
    - expression: >-
        object.kind != 'Ingress' ||
        (!has(object.spec.defaultBackend) && !has(object.spec.tls) && has(object.spec.rules) &&
         variables.hosts.all(h, h == params.data[?'host'].orValue('-') ||
           h in params.data[?'hostnames'].orValue('').split(',')))
      message: >-
        an app's Ingress host is <name>.apps.<dns suffix>, or a custom hostname the env grants as
        '<app>: hostname <name>'; no default backend and no spec.tls (the apps wildcard serves it)
    - expression: >-
        object.kind != 'Service' || !has(object.spec.type) || object.spec.type in ['ClusterIP', 'LoadBalancer']
      message: "an app's Services are ClusterIP, or LoadBalancer for its lan ports; no NodePort or ExternalName"
    - expression: "object.kind != 'Service' || !has(object.spec.externalIPs)"
      message: "an app's Service sets no externalIPs"
    - expression: "variables.lanPorts.all(p, p in params.data[?'lan-ports'].orValue('').split(','))"
      message: "a LoadBalancer exposes only ports the env grants as '<app>: lan-port <port>/<protocol>'"
