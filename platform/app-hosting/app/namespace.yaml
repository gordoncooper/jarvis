# The app's namespace. ClusterPolicy app-derive reads the env and the env's CIDRs from its
# annotations; no tenant can edit a Namespace. Prune stays off: removing the app from the
# env's list keeps the namespace and its volumes until the operator deletes them.
# Pod Security warns and audits at restricted; app-file and app-grants enforce the baseline,
# because a Pod Security label cannot admit the VolSync mover and refuse a tenant pod alike.
apiVersion: v1
kind: Namespace
metadata:
  name: app-${app_name}
  labels:
    hosting.jarvis.io/app: ${app_name}
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    hosting.jarvis.io/host: ${app_name}.apps.${dns_suffix}
    hosting.jarvis.io/env: ${jarvis_env}
    hosting.jarvis.io/pod-cidr: ${app_pod_cidr}
    hosting.jarvis.io/service-cidr: ${app_service_cidr}
