# Binds ValidatingAdmissionPolicy app-file to this app: its namespace, and its App as the
# params. A missing App refuses every object the policy matches there. Prune stays off, so a
# namespace the env dropped stays refused once its App is gone.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-file-${app_name}
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: app-file
  validationActions: [Deny]
  paramRef:
    name: ${app_name}
    namespace: app-${app_name}
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: app-${app_name}
