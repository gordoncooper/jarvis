# Binds ValidatingAdmissionPolicies app-file and app-grants to this app's namespace: the first
# to its App, the second to its grants. A missing App or grants ConfigMap refuses every object
# they match there. Prune stays off, so a namespace the env dropped stays refused once its
# App is gone.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-file-${app_name}
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: app-file
  validationActions: [Deny]
  paramRef:
    name: ${app_name}
    namespace: app-${app_name}
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: app-${app_name}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-grants-${app_name}
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: app-grants
  validationActions: [Deny]
  paramRef:
    name: app-${app_name}-grants
    namespace: flux-system
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: app-${app_name}
---
# The env's exception lines for this app, and its host. Only this wiring writes it: an app
# writes only in its own namespace (app-tenant). Prune stays off with the binding.
# lan-all and lan-targets are copied to the namespace for app-derive; no-uptime-check is
# for the uptime check, which reads it here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-${app_name}-grants
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
data:
  host: ${app_name}.apps.${dns_suffix}
  privileged: "${app_grant_privileged}"
  root: "${app_grant_root}"
  host-network: "${app_grant_host_network}"
  host-path: "${app_grant_host_path}"
  hostnames: "${app_grant_hostnames}"
  lan-ports: "${app_grant_lan_ports}"
  lan-all: "${app_grant_lan_all}"
  lan-targets: "${app_grant_lan_targets}"
  no-uptime-check: "${app_grant_no_uptime_check}"
