# ClusterPolicy app-derive reads each hosted app's App and writes that app's quota and
# NetworkPolicies in its own namespace. Kyverno's chart roles aggregate this.
# Prune stays off so a path move cannot drop the permissions under live policies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:app-derive
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["hosting.jarvis.io"]
    resources: ["apps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
