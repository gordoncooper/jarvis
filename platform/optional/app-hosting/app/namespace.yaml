# The app's namespace. The label brings it under admission policies app-file and app-grants,
# whose cluster-wide bindings match it. Its annotations hold the env's exception lines for this
# app, one source for all readers: app-grants reads them at admission (a missing annotation
# grants nothing), ClusterPolicy app-derive reads the env, the env's CIDRs and LAN ranges and
# the LAN grants, and the uptime check reads its opt-out. No tenant can edit a Namespace.
# Prune stays off: removing the app from the env's list keeps the namespace and its volumes
# until the operator deletes them.
# Pod Security warns and audits at restricted; app-file and app-grants enforce the baseline,
# because a Pod Security label cannot admit the VolSync mover and refuse a tenant pod alike.
apiVersion: v1
kind: Namespace
metadata:
  name: app-${app_name}
  labels:
    hosting.jarvis.io/app: ${app_name}
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    hosting.jarvis.io/host: ${app_name}.apps.${dns_suffix}
    hosting.jarvis.io/env: ${jarvis_env}
    hosting.jarvis.io/pod-cidr: ${app_pod_cidr}
    hosting.jarvis.io/service-cidr: ${app_service_cidr}
    # Flux substitutes into YAML that kustomize has already unquoted, so plain "${x}" would turn
    # false into a boolean and an empty value into null. ${quote} keeps each a string.
    hosting.jarvis.io/lan-cidrs: ${quote}${app_lan_cidrs}${quote}
    hosting.jarvis.io/privileged: ${quote}${app_grant_privileged}${quote}
    hosting.jarvis.io/root: ${quote}${app_grant_root}${quote}
    hosting.jarvis.io/host-network: ${quote}${app_grant_host_network}${quote}
    hosting.jarvis.io/host-path: ${quote}${app_grant_host_path}${quote}
    hosting.jarvis.io/hostnames: ${quote}${app_grant_hostnames}${quote}
    hosting.jarvis.io/lan-all: ${quote}${app_grant_lan_all}${quote}
    hosting.jarvis.io/lan-targets: ${quote}${app_grant_lan_targets}${quote}
    hosting.jarvis.io/lan-ports: ${quote}${app_grant_lan_ports}${quote}
    hosting.jarvis.io/no-uptime-check: ${quote}${app_grant_no_uptime_check}${quote}
