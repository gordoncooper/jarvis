# The grant reconciler (../grant-revoke.yaml) acts in this listed app's namespace, and in no
# namespace the env does not list.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-grant-revoke
  namespace: app-${app_name}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-grant-revoke
subjects:
  - kind: ServiceAccount
    name: app-grant-revoke
    namespace: platform-app-hosting
