# Hosted apps run below everything else. Core and add-on pods set no class and run at 0
# (k3s's own at system-cluster-critical), so a core pod that cannot fit preempts app pods,
# and an app pod never preempts anything: the scheduler leaves it Pending. Under memory
# pressure the kubelet first picks pods whose usage exceeds their requests, and only then
# goes by priority; app pods cannot exceed theirs (app-file holds memory request == limit).
# Prune stays off with the other app-hosting objects, so a path move cannot drop the class
# under running app pods.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: hosted-app
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
value: -1000
globalDefault: false
preemptionPolicy: Never
description: Hosted apps; below every core and add-on pod, never preempts.
---
# Sets hosted-app on every workload an app ships, so its author need not. The admission
# policies app-file and app-grants refuse any other class, so if Kyverno is down (Ignore) the
# app's workloads are refused rather than run at core's priority; core requests never wait on
# it. The VolSync controller's movers keep core's priority, as its other carve-outs do.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: app-priority
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Ignore
  # It matches the workloads themselves; no rule is generated for their pod templates.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchConditions:
    - name: app-namespace
      expression: request.namespace.startsWith('app-')
    - name: not-a-mover
      expression: request.userInfo.username != 'system:serviceaccount:volsync:volsync'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{
            op: "add",
            path: object.kind == "CronJob"
              ? "/spec/jobTemplate/spec/template/spec/priorityClassName"
              : "/spec/template/spec/priorityClassName",
            value: "hosted-app"
          }]
