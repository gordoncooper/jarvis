# rest-server 0.14. Digest pin; Renovate updates it (renovate.json).
# No --append-only: the mover forgets and prunes with these credentials.
# No --private-repos: one user, and repos are <namespace>/<pvc>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic
  namespace: platform-backups
  labels:
    app.kubernetes.io/name: restic
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: restic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restic
    spec:
      # Flux postBuild on platform-configs fills these from cluster-vars.
      nodeSelector:
        "role.${dns_suffix}/backup": "true"
      containers:
        - name: rest-server
          # renovate: datasource=docker depName=restic/rest-server
          image: restic/rest-server@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIRECTORY
              value: /data
            - name: PASSWORD_FILE
              value: /auth/htpasswd
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          # hostPath ignores fsGroup. Non-root waits until the disk honors it.
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: "${backup_path}/restic"
            type: DirectoryOrCreate
        - name: auth
          secret:
            secretName: backups-restic
            items:
              - key: htpasswd
                path: htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: restic
  namespace: platform-backups
  labels:
    app.kubernetes.io/name: restic
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: restic
  ports:
    - name: http
      port: 8000
      targetPort: http
