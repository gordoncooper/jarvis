# Backup enrollment: one restic Secret and one ReplicationSource per bound PVC, generated by
# Kyverno. Git never carries a ReplicationSource. A PVC opts out with annotation backup: none.
# Prune stays off. Deleting a policy deletes the objects it generated (synchronize).
#
# Core namespaces use core's credential (platform-backups/backups-restic). A hosted app's PVC
# (namespace app-*) never gets it: pvc-backup-app builds its Secret from that app's own
# platform-backups/backups-restic-<namespace>, and an app with no registered credential gets
# neither object.
#
# Schedule and retention are the env's cluster-wide values unless platform-backups/backup-overrides,
# which render_backup_selection.py writes from values/apps.yaml, has an entry for the namespace.
# The rebuild hold (kube-system/backup-rebuild-hold) and annotation backup: paused pause the source.
#
# Movers run as root, so a namespace that holds enrolled PVCs carries annotation
# volsync.backube/privileged-movers: "true" in its own manifest (app namespaces get it from the
# app wiring).
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: pvc-backup
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [persistentvolumeclaims]
  matchConditions:
    # volumeName is empty until the claim binds; that UPDATE triggers generation.
    - name: bound
      expression: object.spec.?volumeName.orValue("") != ""
    - name: enrolled
      expression: object.metadata.?annotations["backup"].orValue("") != "none"
    - name: not-a-mover
      expression: object.metadata.?labels["app.kubernetes.io/created-by"].orValue("") != "volsync"
    - name: core-namespace
      expression: "!object.metadata.namespace.startsWith('app-')"
  variables:
    - name: credential
      expression: resource.get("v1", "secrets", "platform-backups", "backups-restic").data
    # A missing ConfigMap is no hold and no override.
    - name: hold
      expression: >-
        dyn(resource.list("v1", "configmaps", "kube-system").items)
        .exists(c, c.metadata.name == "backup-rebuild-hold")
    - name: overrides
      expression: >-
        dyn(resource.list("v1", "configmaps", "platform-backups").items)
        .filter(c, c.metadata.name == "backup-overrides")
    # The namespace's overrides as JSON, or none.
    - name: override
      expression: >-
        size(variables.overrides) > 0
        && object.metadata.namespace in variables.overrides[0].?data.orValue({})
        ? json.unmarshal(variables.overrides[0].data[object.metadata.namespace]) : {}
    - name: secret
      expression: >-
        {
          "apiVersion": dyn("v1"),
          "kind": dyn("Secret"),
          "metadata": dyn({"name": "restic-" + object.metadata.name, "namespace": object.metadata.namespace}),
          "type": dyn("Opaque"),
          "data": dyn({
            "RESTIC_PASSWORD": variables.credential.RESTIC_PASSWORD,
            "RESTIC_REST_USERNAME": variables.credential.RESTIC_REST_USERNAME,
            "RESTIC_REST_PASSWORD": variables.credential.RESTIC_REST_PASSWORD,
            "RESTIC_REPOSITORY": base64.encode(bytes(
              string(base64.decode(variables.credential.RESTIC_REPOSITORY))
              + "ns-" + object.metadata.namespace + "/pvc-" + object.metadata.name))
          })
        }
    - name: source
      expression: >-
        {
          "apiVersion": dyn("volsync.backube/v1alpha1"),
          "kind": dyn("ReplicationSource"),
          "metadata": dyn({"name": object.metadata.name, "namespace": object.metadata.namespace}),
          "spec": dyn({
            "paused": variables.hold || object.metadata.?annotations["backup"].orValue("") == "paused",
            "sourcePVC": object.metadata.name,
            "trigger": {"schedule": string(variables.override.?backup_schedule.orValue("${backup_schedule}"))},
            "restic": {
              "repository": "restic-" + object.metadata.name,
              "copyMethod": "Direct",
              "cacheCapacity": "1Gi",
              "pruneIntervalDays": 7,
              "retain": {
                "daily": int(variables.override.?backup_retention_daily.orValue("${backup_retention_daily}")),
                "weekly": int(variables.override.?backup_retention_weekly.orValue("${backup_retention_weekly}")),
                "monthly": int(variables.override.?backup_retention_monthly.orValue("${backup_retention_monthly}")),
                "within": "7d"
              }
            }
          })
        }
  generate:
    - expression: generator.apply(object.metadata.namespace, [variables.secret, variables.source])
---
# A hosted app's PVC. Its Secret comes only from that app's own credential, which reaches only
# the apps rest-server and only the app's own ns-<namespace>/ folder there.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: pvc-backup-app
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [persistentvolumeclaims]
  matchConditions:
    # volumeName is empty until the claim binds; that UPDATE triggers generation.
    - name: bound
      expression: object.spec.?volumeName.orValue("") != ""
    - name: enrolled
      expression: object.metadata.?annotations["backup"].orValue("") != "none"
    - name: not-a-mover
      expression: object.metadata.?labels["app.kubernetes.io/created-by"].orValue("") != "volsync"
    - name: app-namespace
      expression: object.metadata.namespace.startsWith('app-')
  variables:
    # The app's own credential with a password, or none: nothing is generated without one.
    - name: credentials
      expression: >-
        dyn(resource.list("v1", "secrets", "platform-backups").items)
        .filter(s, s.metadata.name == "backups-restic-" + object.metadata.namespace
                && s.?data.RESTIC_PASSWORD.orValue("") != "")
    - name: credential
      expression: variables.credentials[0].data
    # A missing ConfigMap is no hold and no override.
    - name: hold
      expression: >-
        dyn(resource.list("v1", "configmaps", "kube-system").items)
        .exists(c, c.metadata.name == "backup-rebuild-hold")
    - name: overrides
      expression: >-
        dyn(resource.list("v1", "configmaps", "platform-backups").items)
        .filter(c, c.metadata.name == "backup-overrides")
    # The namespace's overrides as JSON, or none.
    - name: override
      expression: >-
        size(variables.overrides) > 0
        && object.metadata.namespace in variables.overrides[0].?data.orValue({})
        ? json.unmarshal(variables.overrides[0].data[object.metadata.namespace]) : {}
    - name: secret
      expression: >-
        {
          "apiVersion": dyn("v1"),
          "kind": dyn("Secret"),
          "metadata": dyn({"name": "restic-" + object.metadata.name, "namespace": object.metadata.namespace}),
          "type": dyn("Opaque"),
          "data": dyn({
            "RESTIC_PASSWORD": variables.credential.RESTIC_PASSWORD,
            "RESTIC_REST_USERNAME": variables.credential.RESTIC_REST_USERNAME,
            "RESTIC_REST_PASSWORD": variables.credential.RESTIC_REST_PASSWORD,
            "RESTIC_REPOSITORY": base64.encode(bytes(
              string(base64.decode(variables.credential.RESTIC_REPOSITORY))
              + "ns-" + object.metadata.namespace + "/pvc-" + object.metadata.name))
          })
        }
    - name: source
      expression: >-
        {
          "apiVersion": dyn("volsync.backube/v1alpha1"),
          "kind": dyn("ReplicationSource"),
          "metadata": dyn({"name": object.metadata.name, "namespace": object.metadata.namespace}),
          "spec": dyn({
            "paused": variables.hold || object.metadata.?annotations["backup"].orValue("") == "paused",
            "sourcePVC": object.metadata.name,
            "trigger": {"schedule": string(variables.override.?backup_schedule.orValue("${backup_schedule}"))},
            "restic": {
              "repository": "restic-" + object.metadata.name,
              "copyMethod": "Direct",
              "cacheCapacity": "1Gi",
              "pruneIntervalDays": 7,
              "retain": {
                "daily": int(variables.override.?backup_retention_daily.orValue("${backup_retention_daily}")),
                "weekly": int(variables.override.?backup_retention_weekly.orValue("${backup_retention_weekly}")),
                "monthly": int(variables.override.?backup_retention_monthly.orValue("${backup_retention_monthly}")),
                "within": "7d"
              }
            }
          })
        }
  generate:
    - expression: >-
        size(variables.credentials) == 0
        || generator.apply(object.metadata.namespace, [variables.secret, variables.source])
