# Generates one restic Secret and ReplicationSource per PVC. Not a ReplicationSource object.
# Prune stays off. Deleting this policy deletes the backup objects it generated.
# A hosted app's PVC (namespace app-*) never gets core's credential: the -app rules build its
# Secret from that app's own platform-backups/backups-restic-<namespace>, and an app with no
# registered credential gets no Secret and no ReplicationSource.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pvc-backup
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: restic-secret
      match: &enrolled-match
        any:
          - resources:
              kinds:
                - PersistentVolumeClaim
      exclude: &core-exclude
        any:
          - resources:
              annotations:
                backup: none
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/created-by: volsync
          - resources:
              namespaces:
                - app-*
      # volumeName is empty until the claim binds; that UPDATE re-triggers generate.
      preconditions: &enrolled-bound
        all:
          - key: "{{ request.object.spec.volumeName || '' }}"
            operator: NotEquals
            value: ""
      context:
        - name: backupsRestic
          apiCall:
            urlPath: /api/v1/namespaces/platform-backups/secrets/backups-restic
            jmesPath: data
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: v1
        kind: Secret
        name: "restic-{{ request.object.metadata.name }}"
        namespace: "{{ request.object.metadata.namespace }}"
        data:
          type: Opaque
          data:
            RESTIC_PASSWORD: "{{ backupsRestic.RESTIC_PASSWORD }}"
            RESTIC_REST_USERNAME: "{{ backupsRestic.RESTIC_REST_USERNAME }}"
            RESTIC_REST_PASSWORD: "{{ backupsRestic.RESTIC_REST_PASSWORD }}"
            RESTIC_REPOSITORY: "{{ base64_encode('{{ base64_decode(backupsRestic.RESTIC_REPOSITORY) }}ns-{{ request.object.metadata.namespace }}/pvc-{{ request.object.metadata.name }}') }}"
    - name: replication-source
      match: *enrolled-match
      exclude: *core-exclude
      preconditions: *enrolled-bound
      context:
        # Missing ConfigMap is not paused. Kyverno 1.19 uses this default when the GET errors.
        # A non-empty string is truthy in JMESPath, so the value is the string true or false.
        - &rebuild-hold
          name: rebuildHold
          apiCall:
            urlPath: /api/v1/namespaces/kube-system/configmaps/backup-rebuild-hold
            jmesPath: "metadata.name && 'true' || 'false'"
            default: "false"
        - &pause-backup
          name: pauseBackup
          variable:
            # String "true" / "false". to_boolean keeps spec.paused a bool.
            jmesPath: "((request.object.metadata.annotations.backup || '') == 'paused' || rebuildHold == 'true') && 'true' || 'false'"
            default: "false"
      generate: &replication-source-generate
        generateExisting: true
        synchronize: true
        apiVersion: volsync.backube/v1alpha1
        kind: ReplicationSource
        name: "{{ request.object.metadata.name }}"
        namespace: "{{ request.object.metadata.namespace }}"
        data:
          spec:
            # Annotation backup: paused. VolSync then sets the mover Job parallelism to 0.
            paused: "{{ to_boolean(pauseBackup) }}"
            sourcePVC: "{{ request.object.metadata.name }}"
            trigger:
              schedule: "${backup_schedule}"
            restic:
              repository: "restic-{{ request.object.metadata.name }}"
              copyMethod: Direct
              cacheCapacity: 1Gi
              pruneIntervalDays: 7
              retain:
                daily: ${backup_retention_daily}
                weekly: ${backup_retention_weekly}
                monthly: ${backup_retention_monthly}
                # Keeps every snapshot from the last 7 days, so one empty backup cannot forget that day's good snapshot yet.
                within: 7d
    # A hosted app's PVC. Its Secret comes only from that app's own credential, which reaches
    # only the apps rest-server and only the app's own ns-<namespace>/ folder there.
    - name: restic-secret-app
      match: &app-match
        any:
          - resources:
              kinds:
                - PersistentVolumeClaim
              namespaces:
                - app-*
      exclude: &enrolled-exclude
        any:
          - resources:
              annotations:
                backup: none
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/created-by: volsync
      # Missing credential: the default is empty, so the precondition skips the claim.
      context:
        - name: appRestic
          apiCall:
            urlPath: "/api/v1/namespaces/platform-backups/secrets/backups-restic-{{ request.object.metadata.namespace }}"
            jmesPath: data
            default: {}
      preconditions:
        all:
          - key: "{{ request.object.spec.volumeName || '' }}"
            operator: NotEquals
            value: ""
          - key: "{{ appRestic.RESTIC_PASSWORD || '' }}"
            operator: NotEquals
            value: ""
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: v1
        kind: Secret
        name: "restic-{{ request.object.metadata.name }}"
        namespace: "{{ request.object.metadata.namespace }}"
        data:
          type: Opaque
          data:
            RESTIC_PASSWORD: "{{ appRestic.RESTIC_PASSWORD }}"
            RESTIC_REST_USERNAME: "{{ appRestic.RESTIC_REST_USERNAME }}"
            RESTIC_REST_PASSWORD: "{{ appRestic.RESTIC_REST_PASSWORD }}"
            RESTIC_REPOSITORY: "{{ base64_encode('{{ base64_decode(appRestic.RESTIC_REPOSITORY) }}ns-{{ request.object.metadata.namespace }}/pvc-{{ request.object.metadata.name }}') }}"
    - name: replication-source-app
      match: *app-match
      exclude: *enrolled-exclude
      context:
        - name: appCredential
          apiCall:
            urlPath: "/api/v1/namespaces/platform-backups/secrets/backups-restic-{{ request.object.metadata.namespace }}"
            # The same test as restic-secret-app: a credential with a password.
            jmesPath: "data.RESTIC_PASSWORD && 'true' || 'false'"
            default: "false"
        - *rebuild-hold
        - *pause-backup
      preconditions:
        all:
          - key: "{{ request.object.spec.volumeName || '' }}"
            operator: NotEquals
            value: ""
          - key: "{{ appCredential }}"
            operator: Equals
            value: "true"
      generate: *replication-source-generate
    # An app- namespace gets privileged movers only once it has a registered credential, the
    # same test as the -app rules; a core or add-on namespace always does.
    - name: privileged-movers
      match: *enrolled-match
      exclude: *enrolled-exclude
      context:
        - name: appCredential
          apiCall:
            urlPath: "/api/v1/namespaces/platform-backups/secrets/backups-restic-{{ request.object.metadata.namespace }}"
            jmesPath: "data.RESTIC_PASSWORD && 'true' || 'false'"
            default: "false"
      preconditions:
        any:
          - key: "{{ starts_with(request.object.metadata.namespace, 'app-') }}"
            operator: Equals
            value: false
          - key: "{{ appCredential }}"
            operator: Equals
            value: "true"
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: v1
            kind: Namespace
            name: "{{ request.object.metadata.namespace }}"
        patchStrategicMerge:
          metadata:
            annotations:
              volsync.backube/privileged-movers: "true"
