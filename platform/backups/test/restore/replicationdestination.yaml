apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: volsync-test
  namespace: platform-backups
spec:
  trigger:
    manual: "test-1"
  restic:
    repository: backups-restic
    destinationPVC: volsync-test-dst
    copyMethod: Direct
    moverResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    moverVolumes:
      - mountPath: repo
        volumeSource:
          persistentVolumeClaim:
            claimName: volsync-test-repo
