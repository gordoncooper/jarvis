# VolSync 0.17 moverVolumes mount a PVC, Secret, or NFS at /mnt/<mountPath>.
# A hostPath PV is how that PVC lands on backup_path.
# https://volsync.readthedocs.io/en/stable/usage/movervolumes.html
# https://github.com/backube/volsync/blob/v0.17.0/internal/controller/utils/utils.go
apiVersion: v1
kind: PersistentVolume
metadata:
  name: volsync-test-repo
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  claimRef:
    name: volsync-test-repo
    namespace: platform-backups
  hostPath:
    path: ${backup_path}/volsync-test
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volsync-test-repo
  namespace: platform-backups
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: volsync-test-repo
  resources:
    requests:
      storage: 10Gi
