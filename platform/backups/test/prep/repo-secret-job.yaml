# VolSync requires RESTIC_REPOSITORY and RESTIC_PASSWORD in one Secret
# (validateRepository in mover-restic). backups-restic holds only the password.
# This Job copies that password and sets the in-pod repo path. The host path
# is the PV, mounted at /mnt/repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volsync-test-repo-secret
  namespace: platform-backups
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volsync-test-repo-secret
  namespace: platform-backups
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["backups-restic"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["volsync-test-restic"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volsync-test-repo-secret
  namespace: platform-backups
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: volsync-test-repo-secret
subjects:
  - kind: ServiceAccount
    name: volsync-test-repo-secret
    namespace: platform-backups
---
apiVersion: batch/v1
kind: Job
metadata:
  name: volsync-test-repo-secret
  namespace: platform-backups
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: volsync-test-repo-secret
      containers:
        - name: assemble
          image: quay.io/backube/volsync@sha256:bbc884d4fa108534260025bf1255a1010ebb6bb8dac9ba4f4a77f437ca7f8fbd
          imagePullPolicy: IfNotPresent
          env:
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            - name: JOB_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
          command: ["python3", "-c"]
          args:
            - |
              import base64
              import json
              import os
              import ssl
              import urllib.error
              import urllib.request

              ns = "platform-backups"
              name = "volsync-test-restic"
              repo = "/mnt/repo"
              token = open(
                  "/var/run/secrets/kubernetes.io/serviceaccount/token",
                  encoding="utf-8",
              ).read().strip()
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              if ":" in host and not host.startswith("["):
                  host = "[" + host + "]"
              port = os.environ["KUBERNETES_SERVICE_PORT"]
              ctx = ssl.create_default_context(
                  cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              )
              root = "https://" + host + ":" + port

              def call(method, url, body=None):
                  data = None if body is None else json.dumps(body).encode()
                  req = urllib.request.Request(
                      url,
                      data=data,
                      method=method,
                      headers={
                          "Authorization": "Bearer " + token,
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, context=ctx) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as err:
                      if err.code == 409 and method == "POST":
                          return None
                      raise SystemExit("kubernetes " + method + " " + str(err.code)) from None

              src = call("GET", root + "/api/v1/namespaces/" + ns + "/secrets/backups-restic")
              body = {
                  "apiVersion": "v1",
                  "kind": "Secret",
                  "metadata": {
                      "name": name,
                      "namespace": ns,
                      "labels": {"app.kubernetes.io/name": "volsync-test"},
                      "ownerReferences": [
                          {
                              "apiVersion": "batch/v1",
                              "kind": "Job",
                              "name": os.environ["JOB_NAME"],
                              "uid": os.environ["JOB_UID"],
                              "blockOwnerDeletion": False,
                          }
                      ],
                  },
                  "type": "Opaque",
                  "data": {
                      "RESTIC_PASSWORD": src["data"]["RESTIC_PASSWORD"],
                      "RESTIC_REPOSITORY": base64.b64encode(repo.encode()).decode(),
                  },
              }
              created = call("POST", root + "/api/v1/namespaces/" + ns + "/secrets", body)
              if created is None:
                  current = call(
                      "GET", root + "/api/v1/namespaces/" + ns + "/secrets/" + name
                  )
                  body["metadata"]["resourceVersion"] = current["metadata"]["resourceVersion"]
                  call("PUT", root + "/api/v1/namespaces/" + ns + "/secrets/" + name, body)
              print("volsync-test-restic ready")
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
