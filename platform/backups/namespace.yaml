apiVersion: v1
kind: Namespace
metadata:
  name: platform-backups
  annotations:
    # Restores and backups of a root-owned host path need the mover to run as
    # root. VolSync allows that only with this annotation.
    # https://volsync.readthedocs.io/en/stable/usage/permissionmodel.html
    volsync.backube/privileged-movers: "true"
