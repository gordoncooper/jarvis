apiVersion: v1
kind: Namespace
metadata:
  name: platform-backups
  annotations:
    # A hostPath repo ignores fsGroup, so the mover runs as root. This
    # annotation applies to every mover in the namespace. Revisit at the NFS target.
    # https://volsync.readthedocs.io/en/stable/usage/permissionmodel.html
    volsync.backube/privileged-movers: "true"
