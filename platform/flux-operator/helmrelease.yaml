apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 30m
  releaseName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # D30. The chart default sets a CPU limit. null drops that key.
  # Requests and the memory limit are the chart's.
  values:
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: null
        memory: 1Gi
