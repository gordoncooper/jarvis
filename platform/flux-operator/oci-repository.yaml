# D11: the one chart pin. The flux-operator Ansible role reads spec.ref.tag.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
  # The HelmRelease stays. This is the chart source it reconciles.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  ref:
    # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/charts/flux-operator versioning=semver
    tag: "0.60.0"
