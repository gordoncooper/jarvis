# The services stage base. Add-ons are not listed here: each env lists the ones it
# enables in values/switches.yaml, rendered under spec.components of its services Kustomization.
# This patch runs after those components, so every add-on Namespace is in layer addon and
# enforces Pod Security restricted, whatever the add-on's own manifest says.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: any
        labels:
          jarvis.io/layer: addon
          pod-security.kubernetes.io/enforce: restricted
