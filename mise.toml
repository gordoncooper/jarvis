# Every CLI core's tools, checks and CI use, one version each. `make deps` installs them with mise
# (https://mise.jdx.dev); mise.lock records each one's checksum for every platform an operator or
# CI runs on, and Renovate updates both files in one PR. CI fails when mise.lock no longer
# matches this file: run `mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64`.
[settings]
lockfile = true

[tools]
# Python packages: uv installs them from uv.lock into .venv.
uv = "0.13.7"
# Secrets: sops encrypts with age.
sops = "3.13.3"
age = "1.3.2"
# Cluster access and manifest checks. flux is the CLI for the Flux version core's FluxInstance
# runs (core/flux/flux-instance.yaml); Renovate moves both in one PR.
kubectl = "1.36.6"
flux2 = "2.10.0"
kustomize = "5.8.3"
kubeconform = "0.8.0"
kyverno = "1.19.2"
gitleaks = "8.30.1"
# Backups: the same releases as the restic and rest-server images (a test checks they match).
restic = "0.19.1"
# rest-server is not in mise's registry; the github backend still records its checksums.
"github:restic/rest-server" = "0.14.0"
# CI: the e2e cluster and the workflow linter.
k3d = "5.9.0"
actionlint = "1.7.12"
# The admission test's loopback API server (Linux only): kube-apiserver at kubectl's release,
# and the etcd kubeadm pairs with that minor.
"aqua:kubernetes/kubernetes/kube-apiserver" = { version = "1.36.6", os = ["linux"] }
etcd = { version = "3.6.16", os = ["linux"] }
