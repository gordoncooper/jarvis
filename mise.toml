# Every CLI the jarvis CLI runs on an operator's controller, one version each. The deps task installs
# them with mise (https://mise.jdx.dev); mise.lock records each one's checksum for every platform an
# operator or CI runs on, and Renovate updates both files in one PR. mise.dev.toml adds the CLIs only
# core's tests and CI run (MISE_ENV=dev). CI fails when a lock no longer matches its file: run
# `mise -E dev lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64`, which writes both.
[settings]
lockfile = true

[tools]
# Python packages: uv installs them from uv.lock into .venv.
uv = "0.13.10"
# Secrets: sops encrypts with age.
sops = "3.13.3"
age = "1.3.2"
# Cluster access and manifest checks. flux is the CLI for the Flux version core's FluxInstance
# runs (core/flux/flux-instance.yaml); Renovate moves both in one PR.
kubectl = "1.36.7"
flux2 = "2.10.1"
kustomize = "5.8.3"
# Renders each HelmRelease's chart for the env checks (jarvis validate).
helm = "4.3.2"
kubeconform = "0.8.0"
kyverno = "1.20.0"
gitleaks = "8.30.1"
# Backups: the same release as the restic image (a test checks they match).
restic = "0.20.0"

[vars]
# The operator's Python packages from uv.lock: the jarvis CLI and Ansible (the ops group).
# mise.dev.toml sets the whole dev group.
uv_groups = "--no-default-groups --group ops"

[tasks.deps]
# The one way a core checkout installs itself: the jarvis CLI (for the core release an env pins)
# and an instance's CI run it as is; make deps and core's CI run it with MISE_ENV=dev. Every pinned
# CLI, then the Python packages from uv.lock into .venv, the jarvis CLI included.
description = "Install the pinned CLIs and Python packages"
run = ["mise install --locked", "uv sync --frozen {{vars.uv_groups}}"]

