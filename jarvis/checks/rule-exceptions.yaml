# Exceptions to jarvis/checks/rules.yaml. The Kyverno CLI reads them from their own file.
# Upstream charts that template no probe for these containers: cert-manager's controller (liveness
# only) and cainjector, and Kyverno's background controller.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: chart-probes
spec:
  policyRefs:
    - {name: probes, kind: ValidatingPolicy}
  matchConditions:
    - name: upstream-chart-without-probes
      expression: >-
        object.kind == 'Deployment' && object.metadata.namespace + '/' + object.metadata.name in [
          'platform-cert-manager/cert-manager', 'platform-cert-manager/cert-manager-cainjector',
          'kyverno/kyverno-background-controller']
