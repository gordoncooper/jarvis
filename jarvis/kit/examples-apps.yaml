# The example hosted apps, as values/apps.yaml: what jarvis init --with-examples writes for a
# first-run tour, and what core's tests and e2e run. The apps live in the jarvis-apps repository
# beside core (each pin is its tag <app>/<version> there); an env's Renovate moves them.
versions:
  hello-web: v0.1.0
  notes: v0.1.0
  lan-demo: v0.1.0
exceptions:
  - lan-demo: lan-port 8080/TCP
backups:
  mode: selected
  selected: []
