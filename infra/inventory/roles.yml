# Core constructed inventory. Pass as the second -i after envs/<env>/inventory/hosts.yml.
# No env copies this file. node_roles become groups of the same name (D42).
plugin: ansible.builtin.constructed
strict: true
keyed_groups:
  - key: node_roles
    prefix: ""
    separator: ""
    leading_separator: false
groups:
  data_disk: data_disk is defined
