[defaults]
roles_path = roles
# The k3s role's filters, also for its templates rendered outside the role.
filter_plugins = roles/k3s/filter_plugins
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
# Ignore ~/.ansible and /usr/share. Bundled collections still load from the venv.
collections_path = collections

[privilege_escalation]
become = True
become_method = sudo
