---
- name: Stage kubeconfig for the site.yml runner
  vars:
    k3s_kubeconfig_home: "{{ lookup('env', 'HOME') }}"
    k3s_kubeconfig_dir: "{{ k3s_kubeconfig_home }}/.kube"
    k3s_kubeconfig_path: "{{ k3s_kubeconfig_dir }}/config"
  block:
    - name: Create temp directory for kubeconfig staging
      ansible.builtin.tempfile:
        state: directory
        prefix: jarvis-kubeconfig-
      register: k3s_kubeconfig_staging
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Fetch kubeconfig from node
      ansible.builtin.fetch:
        src: "{{ k3s_kubeconfig_path }}"
        dest: "{{ k3s_kubeconfig_staging.path }}/k3s.yaml"
        flat: true
      changed_when: false

    - name: Point kubeconfig server at inventory hostname
      ansible.builtin.replace:
        path: "{{ k3s_kubeconfig_staging.path }}/k3s.yaml"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ inventory_hostname }}:6443"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Ensure .kube directory exists for site.yml runner
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Install kubeconfig for site.yml runner
      ansible.builtin.copy:
        src: "{{ k3s_kubeconfig_staging.path }}/k3s.yaml"
        dest: "{{ k3s_kubeconfig_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
  always:
    - name: Remove kubeconfig staging directory
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_staging.path }}"
        state: absent
      when: k3s_kubeconfig_staging is defined and k3s_kubeconfig_staging.path is defined
      delegate_to: localhost
      become: false
      changed_when: false
