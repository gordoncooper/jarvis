---
- name: Install the per-env kubeconfig for the site.yml runner
  vars:
    k3s_kubeconfig_home: "{{ lookup('env', 'HOME') }}"
    k3s_kubeconfig_dir: "{{ k3s_kubeconfig_home }}/.kube"
    k3s_kubeconfig_runner_path: "{{ k3s_kubeconfig_dir }}/jarvis-{{ jarvis_env }}.yaml"
    k3s_kubeconfig_server_pattern: 'https://127\.0\.0\.1:6443'
  block:
    - name: Read the node kubeconfig
      ansible.builtin.slurp:
        src: "{{ k3s_kubeconfig_path }}"
      register: k3s_kubeconfig_slurp
      no_log: true

    - name: Rewrite the kubeconfig server to the control-plane hostname
      ansible.builtin.set_fact:
        k3s_kubeconfig_rewritten: >-
          {{
            (k3s_kubeconfig_slurp.content | b64decode)
            | regex_replace(
              k3s_kubeconfig_server_pattern,
              'https://' ~ inventory_hostname ~ ':6443'
            )
          }}
      changed_when: false
      no_log: true

    - name: Fail when the kubeconfig server line did not change
      ansible.builtin.assert:
        that:
          - k3s_kubeconfig_rewritten != (k3s_kubeconfig_slurp.content | b64decode)
        fail_msg: kubeconfig server line was not rewritten
      no_log: true

    - name: Ensure the runner kubeconfig directory exists
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write the per-env kubeconfig
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig_rewritten }}"
        dest: "{{ k3s_kubeconfig_runner_path }}"
        mode: "0600"
        backup: false
      delegate_to: localhost
      become: false
      no_log: true
      diff: false
