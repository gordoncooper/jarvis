---
- name: Refuse a missing data disk
  ansible.builtin.assert:
    that:
      - node_disk.exists | bool
    fail_msg: "data disk {{ data_disk.id }} does not exist on {{ inventory_hostname }}."

- name: Refuse a partition as a data disk
  ansible.builtin.assert:
    that:
      - node_disk.is_whole | bool
      - not (node_disk.is_partition | bool)
    fail_msg: "{{ data_disk.id }} resolves to {{ node_disk.kernel }}, which is not a whole disk."

- name: Refuse when the root mount cannot be identified
  ansible.builtin.assert:
    that:
      - node_disk.saw_root | bool
    fail_msg: >-
      cannot see the / mount on {{ inventory_hostname }}, so {{ data_disk.id }}
      cannot be proved distinct from the root disk.

- name: Refuse the root disk
  ansible.builtin.assert:
    that:
      - not (node_disk.is_root | bool)
    fail_msg: "{{ data_disk.id }} is the root disk ({{ node_disk.root_mount_device }})."

- name: Refuse a data disk mounted elsewhere
  ansible.builtin.assert:
    that:
      - node_disk.mounted_elsewhere | length == 0
    fail_msg: "{{ data_disk.id }} is mounted at {{ node_disk.mounted_elsewhere | join(', ') }}."

- name: Refuse a second disk labeled jarvis-data
  ansible.builtin.assert:
    that:
      - not (node_disk.label_elsewhere | bool)
    fail_msg: "another disk already has the label {{ node_disk_label }}."

- name: Refuse a non-empty /var/lib/jarvis
  ansible.builtin.assert:
    that:
      - not (node_disk.mountpoint_nonempty | bool)
    fail_msg: "refusing to mount over {{ node_disk_mount }} on {{ inventory_hostname }}: it is not empty."

- name: Refuse to mount over a foreign filesystem
  ansible.builtin.assert:
    that:
      - not (node_disk.mountpoint_foreign | bool)
    fail_msg: "refusing to mount over {{ node_disk_mount }} on {{ inventory_hostname }}: it is already a mount."

- name: Refuse a data disk mounted without the jarvis-data label
  ansible.builtin.assert:
    that:
      - not (node_disk.mounted_here | bool) or (node_disk.ours | bool)
    fail_msg: >-
      refusing to mount over {{ node_disk_mount }} on {{ inventory_hostname }}:
      the disk is mounted there without the {{ node_disk_label }} label.

- name: Refuse to wipe without both confirmations
  when: not (node_disk.ours | bool)
  ansible.builtin.assert:
    that:
      - data_disk.wipe_confirmed is sameas true
      - (jarvis_wipe_confirm | default('')) == (inventory_hostname ~ ':' ~ data_disk.id)
    fail_msg: >-
      refusing to wipe {{ inventory_hostname }} {{ data_disk.id }}
      model: {{ node_disk.model }}
      size: {{ node_disk.size }}
      partitions: {{ node_disk.partitions | join(', ') if (node_disk.partitions | length > 0) else 'none' }}
      given: {{ jarvis_wipe_confirm | default('') }}
      needs: wipe_confirmed true and jarvis_wipe_confirm={{ inventory_hostname }}:{{ data_disk.id }}
