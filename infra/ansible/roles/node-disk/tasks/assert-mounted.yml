---
- name: Read block device mounts
  ansible.builtin.command:
    argv:
      - lsblk
      - --json
      # Same probe as discover: an empty udev label is not "unlabeled".
      - --properties-by
      - blkid
      - -o
      - LABEL,MOUNTPOINTS
  register: node_disk_mount_tree
  changed_when: false
  tags:
    - always

- name: The data disk is mounted with its label
  ansible.builtin.assert:
    that:
      - >-
        node_disk_mount_tree.stdout | from_json
        | node_disk_mount_matches(node_disk_mount, node_disk_label)
    fail_msg: >-
      {{ node_disk_mount }} on {{ inventory_hostname }} is not mounted as {{ node_disk_label }}.
  tags:
    - always
