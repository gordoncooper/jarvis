---
- name: Record data disk facts
  ansible.builtin.set_fact:
    node_disk: >-
      {{ node_disk_tree
         | node_disk_facts(
             node_disk_stat,
             data_disk.id,
             node_disk_mount,
             node_disk_label,
             node_disk_mount_stat,
             node_disk_mount_entries
           )
         | to_json
         | from_json }}
  changed_when: false
