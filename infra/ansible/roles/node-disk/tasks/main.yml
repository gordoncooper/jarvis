---
- name: Check a declared data disk
  tags: [node-disk]
  when: data_disk | default(false) is sameas true
  block:
    - name: Require data paths and the k3s data dir
      ansible.builtin.assert:
        that:
          - local_path_data is defined
          - local_path_data is string
          - local_path_data | length > 0
          - backup_path is defined
          - backup_path is string
          - backup_path | length > 0
          - k3s_data_dir is defined
          - k3s_data_dir is string
          - k3s_data_dir | length > 0
        fail_msg: node-disk requires local_path_data, backup_path, and k3s_data_dir.

    - name: Refuse local_path_data that is the data mount
      ansible.builtin.assert:
        that:
          - (local_path_data | regex_replace('/+$', '')) != node_disk_mount
        fail_msg: >-
          local_path_data ({{ local_path_data }}) must be a subdirectory of
          {{ node_disk_mount }}.

    - name: Stat the data path
      ansible.builtin.stat:
        path: "{{ node_disk_mount }}"
        follow: false
      register: node_disk_stat

    - name: Refuse a missing data path
      ansible.builtin.assert:
        that:
          - node_disk_stat.stat.exists
          - node_disk_stat.stat.isdir
        fail_msg: "data path {{ node_disk_mount }} does not exist or is not a directory."

    - name: Read the mount target of the data path
      ansible.builtin.command:
        argv: [findmnt, -n, -T, "{{ node_disk_mount }}", -o, TARGET]
      register: node_disk_mount_target
      changed_when: false
      check_mode: false

    - name: Read the filesystem id of the data path
      ansible.builtin.command:
        argv: [findmnt, -n, -T, "{{ node_disk_mount }}", -o, "MAJ:MIN"]
      register: node_disk_mount_id
      changed_when: false
      check_mode: false

    - name: Read the filesystem id of root
      ansible.builtin.command:
        argv: [findmnt, -n, -T, /, -o, "MAJ:MIN"]
      register: node_disk_root_id
      changed_when: false
      check_mode: false

    - name: Refuse a data path that is not a mount
      ansible.builtin.assert:
        that:
          - (node_disk_mount_target.stdout | trim) == node_disk_mount
        fail_msg: >-
          {{ node_disk_mount }} is not a mount; it is part of
          {{ node_disk_mount_target.stdout | trim }}.

    - name: Refuse a data path on the root filesystem
      ansible.builtin.assert:
        that:
          - (node_disk_mount_id.stdout | trim) != (node_disk_root_id.stdout | trim)
        fail_msg: "{{ node_disk_mount }} is not its own filesystem; it is part of /."

    - name: Refuse local_path_data or backup_path outside the data mount
      ansible.builtin.assert:
        that:
          - local_path_data is match('^' ~ (node_disk_mount | regex_escape) ~ '/.+')
          - >-
            backup_path == node_disk_mount
            or backup_path is match('^' ~ (node_disk_mount | regex_escape) ~ '/')
          - "'/../' not in ('/' ~ local_path_data ~ '/')"
          - "'/../' not in ('/' ~ backup_path ~ '/')"
        fail_msg: >-
          local_path_data ({{ local_path_data }}) or backup_path ({{ backup_path }})
          is outside {{ node_disk_mount }}.

    - name: Stat local_path_data
      ansible.builtin.stat:
        path: "{{ local_path_data }}"
        follow: false
      register: node_disk_local_stat

    - name: Read the mount that holds local_path_data
      when: node_disk_local_stat.stat.exists
      ansible.builtin.command:
        argv: [findmnt, -n, -T, "{{ local_path_data }}", -o, TARGET]
      register: node_disk_local_mount
      changed_when: false
      check_mode: false

    - name: Refuse local_path_data on another mount
      when: node_disk_local_stat.stat.exists
      ansible.builtin.assert:
        that:
          - (node_disk_local_mount.stdout | trim) == node_disk_mount
        fail_msg: >-
          local_path_data ({{ local_path_data }}) is outside {{ node_disk_mount }}
          (mounted at {{ node_disk_local_mount.stdout | trim }}).

    - name: Stat backup_path
      ansible.builtin.stat:
        path: "{{ backup_path }}"
        follow: false
      register: node_disk_backup_stat

    - name: Read the mount that holds backup_path
      when: node_disk_backup_stat.stat.exists
      ansible.builtin.command:
        argv: [findmnt, -n, -T, "{{ backup_path }}", -o, TARGET]
      register: node_disk_backup_mount
      changed_when: false
      check_mode: false

    - name: Refuse backup_path on another mount
      when: node_disk_backup_stat.stat.exists
      ansible.builtin.assert:
        that:
          - (node_disk_backup_mount.stdout | trim) == node_disk_mount
        fail_msg: >-
          backup_path ({{ backup_path }}) is outside {{ node_disk_mount }}
          (mounted at {{ node_disk_backup_mount.stdout | trim }}).

    - name: List the data path
      ansible.builtin.find:
        paths: "{{ node_disk_mount }}"
        file_type: any
        recurse: false
        hidden: true
      register: node_disk_listing

    - name: Record names on the data path
      ansible.builtin.set_fact:
        node_disk_names: "{{ node_disk_listing.files | map(attribute='path') | map('basename') | list }}"
        node_disk_jarvis_names: >-
          {{
            [local_path_data, backup_path]
            | map('regex_replace', '^' ~ (node_disk_mount | regex_escape) ~ '/', '')
            | map('regex_replace', '/.*$', '')
            | reject('equalto', '')
            | unique
            | list
          }}
      changed_when: false

    - name: Refuse entries that are not Jarvis data
      vars:
        node_disk_allowed: "{{ (node_disk_jarvis_names + ['lost+found']) | unique }}"
        node_disk_foreign: "{{ node_disk_names | difference(node_disk_allowed) }}"
      ansible.builtin.assert:
        that:
          - node_disk_foreign | length == 0
        fail_msg: >-
          {{ node_disk_mount }} holds entries that are not Jarvis data:
          {{ node_disk_foreign | join(', ') }}.

    - name: Stat the k3s server data directory
      ansible.builtin.stat:
        path: "{{ k3s_data_dir }}/server"
      register: node_disk_k3s_server

    - name: Stat the k3s agent data directory
      ansible.builtin.stat:
        path: "{{ k3s_data_dir }}/agent"
      register: node_disk_k3s_agent

    - name: List the k3s server data directory
      when: node_disk_k3s_server.stat.isdir | default(false)
      ansible.builtin.find:
        paths: "{{ k3s_data_dir }}/server"
        file_type: any
        recurse: false
        hidden: true
      register: node_disk_k3s_server_files

    - name: List the k3s agent data directory
      when: node_disk_k3s_agent.stat.isdir | default(false)
      ansible.builtin.find:
        paths: "{{ k3s_data_dir }}/agent"
        file_type: any
        recurse: false
        hidden: true
      register: node_disk_k3s_agent_files

    - name: Record whether k3s has stored server or agent state
      ansible.builtin.set_fact:
        node_disk_k3s_ran: >-
          {{
            (node_disk_k3s_server_files.files | default([]) | length > 0)
            or (node_disk_k3s_agent_files.files | default([]) | length > 0)
          }}
      changed_when: false

    - name: Refuse an empty data path when k3s has already run
      when: node_disk_k3s_ran | bool
      vars:
        node_disk_held: "{{ node_disk_names | intersect(node_disk_jarvis_names) }}"
      ansible.builtin.assert:
        that:
          - node_disk_held | length > 0
        fail_msg: >-
          {{ node_disk_mount }} has no Jarvis data, but {{ k3s_data_dir }}
          already holds k3s server or agent state, so existing data is missing
          or hidden under the mount.
