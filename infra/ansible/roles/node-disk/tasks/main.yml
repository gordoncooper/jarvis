---
- name: Require nodes from env values
  ansible.builtin.assert:
    that:
      - nodes is mapping
      - inventory_hostname in nodes
    fail_msg: nodes.yaml must list every inventory host (D42).
  tags: [node-disk]

- name: Resolve node spec
  ansible.builtin.set_fact:
    jarvis_node_spec: "{{ nodes[inventory_hostname] }}"
    jarvis_data_disk_id: "{{ nodes[inventory_hostname].data_disk.id }}"
  tags: [node-disk]

- name: Refuse data disk without by-id path
  ansible.builtin.assert:
    that:
      - jarvis_data_disk_id is match('^/dev/disk/by-id/')
    fail_msg: data_disk.id must be a stable /dev/disk/by-id/ path (D42).
  tags: [node-disk]

- name: Refuse missing data disk
  ansible.builtin.stat:
    path: "{{ jarvis_data_disk_id }}"
  register: jarvis_data_disk_stat
  failed_when: not jarvis_data_disk_stat.stat.exists
  tags: [node-disk]

- name: Validate data disk topology
  ansible.builtin.shell: |
    set -euo pipefail
    data_id="{{ jarvis_data_disk_id }}"
    data_mount="{{ jarvis_data_mount }}"
    data_label="{{ jarvis_data_label }}"
    whole_disk() {
      local dev
      dev="$(readlink -f "$1")"
      local pk
      pk="$(lsblk -ndo PKNAME "$dev" 2>/dev/null | head -n1 || true)"
      if [[ -n "${pk}" ]]; then
        readlink -f "/dev/${pk}"
      else
        echo "${dev}"
      fi
    }
    root_src="$(findmnt -n -o SOURCE --target / | head -n1)"
    root_disk="$(whole_disk "${root_src}")"
    data_base="$(readlink -f "${data_id}")"
    data_disk="$(whole_disk "${data_base}")"
    if [[ "${root_disk}" == "${data_disk}" ]]; then
      echo "data disk ${data_id} is the root disk (${root_disk})" >&2
      exit 1
    fi
    marked=no
    while read -r name; do
      [[ -z "${name}" ]] && continue
      dev="/dev/${name}"
      [[ -b "${dev}" ]] || continue
      label="$(blkid -o value -s LABEL "${dev}" 2>/dev/null || true)"
      if [[ "${label}" == "${data_label}" ]]; then
        marked=yes
      fi
      mountpoint="$(lsblk -no MOUNTPOINT "${dev}" 2>/dev/null | head -n1 || true)"
      if [[ -n "${mountpoint}" ]]; then
        if [[ "${mountpoint}" != "${data_mount}" ]]; then
          echo "${dev} is mounted at ${mountpoint}" >&2
          exit 1
        fi
        if [[ "${label}" != "${data_label}" ]]; then
          echo "${dev} is mounted at ${data_mount} without label ${data_label}" >&2
          exit 1
        fi
      fi
    done < <(lsblk -nr "${data_base}" -o NAME)
    echo "MARKED=${marked}"
  args:
    executable: /bin/bash
  register: jarvis_disk_topology
  changed_when: false
  check_mode: false
  tags: [node-disk]

- name: Set whether data disk carries the jarvis-data label
  ansible.builtin.set_fact:
    jarvis_disk_is_marked: "{{ jarvis_disk_topology.stdout is search('MARKED=yes') }}"
  tags: [node-disk]

- name: Refuse non-empty jarvis data directory on the root filesystem
  ansible.builtin.shell: |
    set -euo pipefail
    mount="{{ jarvis_data_mount }}"
    label="{{ jarvis_data_label }}"
    if [[ ! -d "${mount}" ]]; then
      exit 0
    fi
    if [[ -z "$(ls -A "${mount}" 2>/dev/null || true)" ]]; then
      exit 0
    fi
    src="$(findmnt -n -o SOURCE --target "${mount}" 2>/dev/null || true)"
    if [[ -z "${src}" ]]; then
      echo "${mount} is not empty and is not a mount point (D42)." >&2
      exit 1
    fi
    dev="$(readlink -f "${src}")"
    fs_label="$(blkid -o value -s LABEL "${dev}" 2>/dev/null || true)"
    if [[ "${fs_label}" != "${label}" ]]; then
      echo "${mount} is not empty and is not backed by label ${label}." >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false
  tags: [node-disk]

- name: Gather disk identity before wipe decision
  ansible.builtin.shell: |
    set -euo pipefail
    lsblk -dn -o MODEL,SIZE,TYPE {{ jarvis_data_disk_id }}
    lsblk -n {{ jarvis_data_disk_id }}
  args:
    executable: /bin/bash
  register: jarvis_disk_identity
  changed_when: false
  check_mode: false
  when: not (jarvis_disk_is_marked | bool)
  tags: [node-disk]

- name: Refuse wipe without two-key confirmation
  ansible.builtin.fail:
    msg: |
      Refusing to wipe {{ jarvis_data_disk_id }} on {{ inventory_hostname }} (D42).
      Disk identity:
      {{ jarvis_disk_identity.stdout | default('') }}
      Set wipe_confirmed: true in nodes.yaml and pass
      -e jarvis_wipe_confirm={{ inventory_hostname }}:{{ jarvis_data_disk_id }}
  when:
    - not (jarvis_disk_is_marked | bool)
    - not (
        jarvis_node_spec.data_disk.wipe_confirmed | default(false) | bool
        and (jarvis_wipe_confirm | default('')) == (inventory_hostname ~ ':' ~ jarvis_data_disk_id)
      )
  check_mode: false
  tags: [node-disk]

- name: Wipe and format data disk
  when: not (jarvis_disk_is_marked | bool)
  block:
    - name: Wipe filesystem signatures from data disk
      ansible.builtin.command:
        cmd: wipefs -a {{ jarvis_data_disk_id }}
      tags: [node-disk]

    - name: Create ext4 filesystem on data disk
      community.general.filesystem:
        fstype: "{{ jarvis_data_fs }}"
        dev: "{{ jarvis_data_disk_id }}"
        opts: "-L {{ jarvis_data_label }}"
      tags: [node-disk]
  tags: [node-disk]

- name: Mount jarvis data disk and lay out paths
  block:
    - name: Ensure jarvis data mount directory exists
      ansible.builtin.file:
        path: "{{ jarvis_data_mount }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Mount jarvis data disk
      ansible.posix.mount:
        path: "{{ jarvis_data_mount }}"
        src: "{{ jarvis_data_disk_id }}"
        fstype: "{{ jarvis_data_fs }}"
        opts: defaults
        state: mounted

    - name: Write jarvis env mark on data disk
      ansible.builtin.copy:
        dest: "{{ jarvis_data_mark_file }}"
        content: "{{ jarvis_env }}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Ensure jarvis data subdirectories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ local_path_data }}"
        - "{{ backup_path }}"
        - "{{ backup_path }}/etcd-snapshots"
        - "{{ backup_path }}/restic"
  tags: [node-disk]
