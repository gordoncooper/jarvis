---
- name: Stat the data disk by-id path
  ansible.builtin.stat:
    path: "{{ data_disk.id }}"
  register: node_disk_id_stat

- name: Read the block device tree
  ansible.builtin.command:
    argv:
      - lsblk
      - --json
      # udev stops at an empty label when it has not scanned the filesystem.
      - --properties-by
      - blkid
      - -o
      - NAME,KNAME,PATH,TYPE,SIZE,MODEL,LABEL,MOUNTPOINTS,PARTN
  register: node_disk_lsblk
  changed_when: false

- name: Stat the jarvis mount point
  ansible.builtin.stat:
    path: "{{ node_disk_mount }}"
  register: node_disk_mountpoint_stat

- name: List entries on the jarvis mount point
  ansible.builtin.find:
    paths: "{{ node_disk_mount }}"
    file_type: any
    hidden: true
    recurse: false
  register: node_disk_mountpoint_entries
  when:
    - node_disk_mountpoint_stat.stat.exists | default(false)
    - node_disk_mountpoint_stat.stat.isdir | default(false)

- name: Derive data disk facts
  ansible.builtin.import_tasks: derive.yml
  vars:
    node_disk_tree: "{{ node_disk_lsblk.stdout | from_json }}"
    node_disk_stat: "{{ node_disk_id_stat.stat }}"
    node_disk_mount_stat: "{{ node_disk_mountpoint_stat.stat }}"
    node_disk_mount_entries: "{{ node_disk_mountpoint_entries.matched | default(0) }}"
