---
# The root GitRepository marks a cluster Flux already syncs. Until it exists, this
# applies the FluxInstance (controllers), then sync.yaml (the root and core sources
# and the root Kustomization). Flux reconciles both files from Git after that.
# Before the FluxInstance installs the CRD, the lookup finds no such type and no object.
- name: Check whether the root GitRepository exists
  kubernetes.core.k8s_info:
    api_version: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    namespace: "{{ flux_system_namespace }}"
    name: "{{ flux_root_source_name }}"
  register: flux_root_lookup
  check_mode: false

- name: Bootstrap Flux from Git on a new cluster
  when: flux_root_lookup.resources | length == 0
  block:
    - name: Hold PVC backups when restic data is already on disk
      ansible.builtin.import_role:
        name: backups

    - name: Apply the env FluxInstance from Git
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', flux_instance_file) | from_yaml_all | list }}"

    - name: Wait for the Flux source and kustomize CRDs
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item }}"
        wait: true
        wait_condition:
          type: Established
          status: "True"
        wait_timeout: "{{ flux_crd_wait_timeout }}"
      loop:
        - gitrepositories.source.toolkit.fluxcd.io
        - kustomizations.kustomize.toolkit.fluxcd.io

    - name: Apply the env Flux sources and root Kustomization from Git once
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', flux_sync_file) | from_yaml_all | list }}"
