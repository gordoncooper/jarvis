---
# Migration only: stamp install.yaml objects from legacy kubectl bootstrap (see install-vs-chart test).
- name: Label Flux Operator install objects for Helm adoption
  ansible.builtin.command:
    cmd: "{{ lookup('template', 'adopt-label.cmd.j2') | trim }}"
  loop: "{{ flux_operator_helm_adopt_resources }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  changed_when: false
  tags:
    - flux-operator
    - flux-cluster
    - flux-adopt

- name: Annotate Flux Operator install objects for Helm adoption
  ansible.builtin.command:
    cmd: "{{ lookup('template', 'adopt-annotate.cmd.j2') | trim }}"
  loop: "{{ flux_operator_helm_adopt_resources }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  changed_when: false
  tags:
    - flux-operator
    - flux-cluster
    - flux-adopt
