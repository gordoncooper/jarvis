---
# sops_age.yml chose flux_sops_age_key_content: only the key file's identities
# for the env's age recipients.
- name: Create flux-system sops-age secret once
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'sops-age-secret.yaml.j2') | from_yaml }}"
  when: not (flux_sops_age_present | bool)
  no_log: true
