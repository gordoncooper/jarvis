---
# Stats the controller's age private key, sops_age_key_file, which jarvis site resolves.
# Shared with the k3s role.
- name: Stat the age private key file
  ansible.builtin.stat:
    path: "{{ sops_age_key_file }}"
  register: sops_age_key_stat
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
