---
- name: Check whether Flux Operator deployment exists
  ansible.builtin.command:
    cmd: >-
      {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }}
      get deployment {{ flux_operator_deployment_name }} -o name
  register: flux_operator_deploy_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record Flux Operator deployment presence
  ansible.builtin.set_fact:
    flux_operator_deployed: >-
      {{ flux_operator_deploy_lookup.rc == 0
         and (flux_operator_deploy_lookup.stdout | trim | length) > 0 }}

- name: Bootstrap Flux Operator when absent
  when: not (flux_operator_deployed | bool)
  block:
    - name: Ensure Helm CLI for chart bootstrap
      ansible.builtin.import_tasks: helm_cli.yml

    - name: Install Flux Operator chart once (matches Git HelmRelease pin)
      ansible.builtin.command:
        cmd: "{{ lookup('template', 'helm-upgrade.cmd.j2') | trim }}"
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_path }}"
      when: not ansible_check_mode

    - name: Wait for FluxInstance CRD to be established
      ansible.builtin.command:
        cmd: >-
          {{ k3s_binary_path }} kubectl wait --for=condition=Established
          crd/fluxinstances.fluxcd.controlplane.io
          --timeout={{ flux_operator_crd_wait_timeout }}
      changed_when: false
      check_mode: false

    - name: Wait for Flux Operator deployment rollout
      ansible.builtin.command:
        cmd: >-
          {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }} wait
          --for=condition=Available deployment/{{ flux_operator_deployment_name }}
          --timeout={{ flux_operator_rollout_wait_timeout }}
      changed_when: false
      check_mode: false
