---
- name: Check whether Flux Operator deployment exists
  ansible.builtin.command:
    cmd: >-
      {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }}
      get deployment {{ flux_operator_deployment_name }} -o name
  register: flux_operator_deploy_lookup
  changed_when: false
  failed_when: false
  tags:
    - flux-operator
    - flux-cluster

- name: Record Flux Operator deployment presence
  ansible.builtin.set_fact:
    flux_operator_deployed: >-
      {{ flux_operator_deploy_lookup.rc == 0
         and (flux_operator_deploy_lookup.stdout | trim | length) > 0 }}
  tags:
    - flux-operator
    - flux-cluster

- name: Download pinned Flux Operator install manifest
  ansible.builtin.get_url:
    url: "{{ flux_operator_install_url }}"
    dest: /tmp/flux-operator-install.yaml
    mode: "0600"
    owner: root
    group: root
    checksum: "sha256:{{ flux_operator_install_sha256 }}"
  when: not (flux_operator_deployed | bool)
  tags:
    - flux-operator
    - flux-cluster

- name: Apply Flux Operator install manifest once
  ansible.builtin.command:
    cmd: "{{ k3s_binary_path }} kubectl apply -f /tmp/flux-operator-install.yaml"
  when: not (flux_operator_deployed | bool)
  tags:
    - flux-operator
    - flux-cluster
