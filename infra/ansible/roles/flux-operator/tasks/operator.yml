---
- name: Check whether Flux Operator deployment exists
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ flux_system_namespace }}"
    name: "{{ flux_operator_deployment_name }}"
  register: flux_operator_deploy_lookup
  check_mode: false

- name: Bootstrap Flux Operator when absent
  when: flux_operator_deploy_lookup.resources | length == 0
  block:
    - name: Ensure Helm CLI for chart bootstrap
      ansible.builtin.import_tasks: helm_cli.yml

    - name: Install Flux Operator chart once (matches Git HelmRelease pin)
      ansible.builtin.command:
        cmd: "{{ lookup('template', 'helm-upgrade.cmd.j2') | trim }}"
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_path }}"
      when: not ansible_check_mode

# Every run, so a run cut short after the install still waits before the FluxInstance.
- name: Wait for FluxInstance CRD to be established
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: fluxinstances.fluxcd.controlplane.io
    wait: true
    wait_condition:
      type: Established
      status: "True"
    wait_timeout: "{{ flux_operator_crd_wait_timeout }}"
  check_mode: false

- name: Wait for Flux Operator deployment rollout
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ flux_system_namespace }}"
    name: "{{ flux_operator_deployment_name }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ flux_operator_rollout_wait_timeout }}"
  check_mode: false
