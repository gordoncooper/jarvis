---
- name: Check whether Flux Operator deployment exists
  ansible.builtin.command:
    cmd: >-
      {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }}
      get deployment {{ flux_operator_deployment_name }} -o name
  register: flux_operator_deploy_lookup
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - flux-operator
    - flux-cluster

- name: Record Flux Operator deployment presence
  ansible.builtin.set_fact:
    flux_operator_deployed: >-
      {{ flux_operator_deploy_lookup.rc == 0
         and (flux_operator_deploy_lookup.stdout | trim | length) > 0 }}
  tags:
    - flux-operator
    - flux-cluster

- name: Bootstrap Flux Operator when absent
  when: not (flux_operator_deployed | bool)
  tags:
    - flux-operator
    - flux-cluster
  block:
    - name: Ensure Helm CLI for chart bootstrap
      ansible.builtin.import_tasks: helm_cli.yml

    - name: Install Flux Operator chart once (matches Git HelmRelease pin)
      ansible.builtin.command:
        cmd: >-
          {{ helm_binary_path }} upgrade --install {{ flux_operator_deployment_name }}
          oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
          --version {{ flux_operator_chart_version }}
          --namespace {{ flux_system_namespace }}
          --create-namespace
          --wait
          --timeout {{ flux_operator_helm_timeout }}
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_path }}"
      when: not ansible_check_mode

    - name: Wait for FluxInstance CRD to be established
      ansible.builtin.command:
        cmd: >-
          {{ k3s_binary_path }} kubectl wait --for=condition=Established
          crd/fluxinstances.fluxcd.controlplane.io
          --timeout={{ flux_operator_crd_wait_timeout }}
      changed_when: false
      check_mode: false

    - name: Wait for Flux Operator deployment rollout
      ansible.builtin.command:
        cmd: >-
          {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }} wait
          --for=condition=Available deployment/{{ flux_operator_deployment_name }}
          --timeout={{ flux_operator_rollout_wait_timeout }}
      changed_when: false
      check_mode: false

- name: Check for legacy kubectl install manifest
  ansible.builtin.command:
    cmd: >-
      {{ k3s_binary_path }} kubectl get clusterrolebinding
      flux-operator-cluster-admin -o name
  register: flux_operator_legacy_install_lookup
  changed_when: false
  failed_when: false
  check_mode: false
  when: flux_operator_deployed | bool
  tags:
    - flux-operator
    - flux-cluster
    - flux-adopt

- name: Migrate legacy kubectl install objects for Helm adoption
  ansible.builtin.import_tasks: operator_adopt.yml
  when:
    - flux_operator_deployed | bool
    - not ansible_check_mode
    - flux_operator_legacy_install_lookup.rc == 0
  tags:
    - flux-operator
    - flux-cluster
    - flux-adopt
