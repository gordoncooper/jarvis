---
- name: Check whether flux-system sops-age secret exists
  ansible.builtin.command:
    cmd: >-
      {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }}
      get secret sops-age -o name
  register: flux_sops_age_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record flux-system sops-age secret presence
  ansible.builtin.set_fact:
    flux_sops_age_present: >-
      {{ flux_sops_age_lookup.rc == 0 and (flux_sops_age_lookup.stdout | trim | length) > 0 }}

- name: Record the age private key path
  ansible.builtin.set_fact:
    sops_age_key_file: "{{ _sops_age_from_env | default(_sops_age_from_vars, true) | regex_replace('^~/', lookup('env', 'HOME') ~ '/') }}"
  vars:
    _sops_age_from_env: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') }}"
    _sops_age_from_vars: "{{ age_key_file | default('~/.config/sops/age/keys.txt', true) }}"
  no_log: true
  changed_when: false

- name: Stat the age private key file
  ansible.builtin.stat:
    path: "{{ sops_age_key_file }}"
  register: sops_age_key_stat
  no_log: true

- name: Require an age private key when the sops-age secret is absent
  ansible.builtin.assert:
    that:
      - sops_age_key_stat.stat.exists | default(false)
    fail_msg: >-
      Set SOPS_AGE_KEY_FILE or age_key_file to the age private key on the
      controller (default ~/.config/sops/age/keys.txt) before running
      flux-operator (bootstrap secret flux-system/sops-age).
  when: not (flux_sops_age_present | bool)
  no_log: true

- name: Use the age private key when the file exists
  when: sops_age_key_stat.stat.exists | default(false)
  no_log: true
  block:
    - name: Require age private key file on the controller
      ansible.builtin.assert:
        that:
          - lookup('file', sops_age_key_file, errors='ignore') | length > 0
        fail_msg: >-
          The age private key file is missing or empty. Set SOPS_AGE_KEY_FILE
          or age_key_file.
      no_log: true

    - name: Load age private key from the controller
      ansible.builtin.set_fact:
        flux_sops_age_key_content: "{{ lookup('file', sops_age_key_file) }}"
      no_log: true

    - name: Read existing sops-age secret data when present
      ansible.builtin.command:
        cmd: >-
          {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }}
          get secret sops-age -o json
      register: flux_sops_age_existing_json
      changed_when: false
      when: flux_sops_age_present | bool
      check_mode: false
      no_log: true

    - name: Decode existing sops-age secret key when present
      ansible.builtin.set_fact:
        flux_sops_age_existing_key_content: >-
          {{ (flux_sops_age_existing_json.stdout | from_json).data['age.agekey'] | b64decode }}
      when: flux_sops_age_present | bool
      no_log: true

    - name: Refuse to overwrite an existing sops-age secret with different content
      ansible.builtin.assert:
        that:
          - flux_sops_age_existing_json is defined
          - flux_sops_age_existing_json.stdout | length > 0
          - (flux_sops_age_existing_json.stdout | from_json).data['age.agekey'] is defined
          - (flux_sops_age_existing_json.stdout | from_json).data['age.agekey'] | length > 0
          - (flux_sops_age_existing_key_content | trim) == (flux_sops_age_key_content | trim)
        fail_msg: >-
          flux-system/sops-age already exists with different content; remove it
          manually or point SOPS_AGE_KEY_FILE or age_key_file at the original key.
      when: flux_sops_age_present | bool
      no_log: true

- name: Create flux-system sops-age secret once
  ansible.builtin.command:
    cmd: "{{ k3s_binary_path }} kubectl create -f -"
    stdin: "{{ lookup('template', 'sops-age-secret.yaml.j2') }}"
  when: not (flux_sops_age_present | bool)
  no_log: true
