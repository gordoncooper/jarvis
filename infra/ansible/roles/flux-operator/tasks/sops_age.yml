---
- name: Check whether flux-system sops-age secret exists
  ansible.builtin.command:
    cmd: >-
      {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }}
      get secret sops-age -o name
  register: flux_sops_age_lookup
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - flux-operator
    - flux-cluster

- name: Record flux-system sops-age secret presence
  ansible.builtin.set_fact:
    flux_sops_age_present: >-
      {{ flux_sops_age_lookup.rc == 0 and (flux_sops_age_lookup.stdout | trim | length) > 0 }}
  tags:
    - flux-operator
    - flux-cluster

- name: Require SOPS_AGE_KEY_FILE on the controller
  ansible.builtin.assert:
    that:
      - sops_age_key_file | length > 0
    fail_msg: >-
      Set SOPS_AGE_KEY_FILE to the age private key path on the controller before
      running flux-operator (bootstrap secret flux-system/sops-age).
  vars:
    sops_age_key_file: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') }}"
  no_log: true
  tags:
    - flux-operator
    - flux-cluster

- name: Require age private key file on the controller
  ansible.builtin.assert:
    that:
      - lookup('file', sops_age_key_file, errors='ignore') | length > 0
    fail_msg: >-
      SOPS_AGE_KEY_FILE must point at an existing age private key file on the
      controller.
  vars:
    sops_age_key_file: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') }}"
  no_log: true
  tags:
    - flux-operator
    - flux-cluster

- name: Load age private key from the controller
  ansible.builtin.set_fact:
    flux_sops_age_key_content: "{{ lookup('file', sops_age_key_file) }}"
  vars:
    sops_age_key_file: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') }}"
  no_log: true
  tags:
    - flux-operator
    - flux-cluster

- name: Read existing sops-age secret data when present
  ansible.builtin.command:
    cmd: >-
      {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }}
      get secret sops-age -o jsonpath={.data.age\.agekey}
  register: flux_sops_age_existing_b64
  changed_when: false
  failed_when: false
  when: flux_sops_age_present | bool
  check_mode: false
  no_log: true
  tags:
    - flux-operator
    - flux-cluster

- name: Refuse to overwrite an existing sops-age secret with different content
  ansible.builtin.assert:
    that:
      - (flux_sops_age_existing_b64.stdout | trim | b64decode | trim)
        == (flux_sops_age_key_content | trim)
    fail_msg: >-
      flux-system/sops-age already exists with different content; remove it manually
      or fix SOPS_AGE_KEY_FILE before re-running site.yml.
  when: flux_sops_age_present | bool
  no_log: true
  tags:
    - flux-operator
    - flux-cluster

- name: Create flux-system sops-age secret once
  ansible.builtin.command:
    cmd: "{{ k3s_binary_path }} kubectl create -f -"
    stdin: "{{ lookup('template', 'sops-age-secret.yaml.j2') }}"
  when: not (flux_sops_age_present | bool)
  no_log: true
  tags:
    - flux-operator
    - flux-cluster
