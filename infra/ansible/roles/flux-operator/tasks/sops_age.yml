---
# Read-only. Runs before the operator install, so a wrong key file stops the run
# before any cluster change. sops_age_secret.yml creates the secret.
- name: Check whether flux-system sops-age secret exists
  ansible.builtin.command:
    cmd: >-
      {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }}
      get secret sops-age -o name
  register: flux_sops_age_lookup
  changed_when: false
  failed_when: >-
    flux_sops_age_lookup.rc != 0
    and 'NotFound' not in (
      (flux_sops_age_lookup.stderr | default(''))
      ~ (flux_sops_age_lookup.stdout | default(''))
    )
  check_mode: false

- name: Record flux-system sops-age secret presence
  ansible.builtin.set_fact:
    flux_sops_age_present: "{{ flux_sops_age_lookup.rc == 0 }}"

- name: Resolve and stat the SOPS key file
  ansible.builtin.import_tasks: sops_age_key_file.yml
  no_log: true

- name: Require an age private key when the sops-age secret is absent
  ansible.builtin.assert:
    that:
      - sops_age_key_stat.stat.exists | default(false)
    fail_msg: >-
      Set SOPS_AGE_KEY_FILE or age_key_file to the age private key on the
      controller (default ~/.config/sops/age/keys.txt) before running
      flux-operator (bootstrap secret flux-system/sops-age).
  when: not (flux_sops_age_present | bool)
  no_log: true

- name: Check age key file mode and owner
  ansible.builtin.include_tasks: sops_age_key_mode.yml
  when: sops_age_key_stat.stat.exists | default(false)

# Outside the no_log block: a missing age-keygen must name itself.
- name: Check whether age-keygen is on PATH
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - command -v age-keygen
  register: flux_age_keygen_check
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true
  when: sops_age_key_stat.stat.exists | default(false)

- name: Require age-keygen on the controller
  ansible.builtin.assert:
    that:
      - flux_age_keygen_check.rc | default(1) == 0
    fail_msg: >-
      age-keygen is not on PATH. Install age-keygen before flux-operator.
      A missing binary would otherwise fail inside a no_log task.
  when: sops_age_key_stat.stat.exists | default(false)

- name: Use the age private key when the file exists
  when: sops_age_key_stat.stat.exists | default(false)
  no_log: true
  block:
    - name: Read the env's age recipients from the SOPS config
      ansible.builtin.set_fact:
        flux_sops_recipients: >-
          {{ ((lookup('file', flux_sops_config_file, errors='ignore') or '{}') | from_yaml).creation_rules
             | default([], true)
             | selectattr('path_regex', 'defined')
             | selectattr('path_regex', 'contains', 'envs/' ~ jarvis_env ~ '/secrets/')
             | selectattr('age', 'defined')
             | map(attribute='age') | flatten | join(',') | split(',')
             | map('trim') | select | list }}

    - name: Require an age recipient for this env
      ansible.builtin.assert:
        that:
          - flux_sops_recipients | length > 0
        fail_msg: >-
          .sops.yaml has no age recipient in a creation rule for
          envs/{{ jarvis_env }}/secrets/, so no identity in the key file can be chosen.
      # Public recipients only, so the reason stays visible.
      no_log: false

    - name: Require age private key file on the controller
      ansible.builtin.assert:
        that:
          - lookup('file', sops_age_key_file, errors='ignore') | length > 0
        fail_msg: >-
          The age private key file is missing or empty. Set SOPS_AGE_KEY_FILE
          or age_key_file.
      no_log: true

    - name: Read the identities in the age private key file
      ansible.builtin.set_fact:
        flux_sops_age_file_identities: >-
          {{ lookup('file', sops_age_key_file).splitlines() | map('trim')
             | select('match', '^AGE-SECRET-KEY-1[0-9A-Z]+$') | list }}
      no_log: true

    - name: Derive the public key of each identity in the age private key file
      ansible.builtin.command:
        argv:
          - age-keygen
          - -y
        stdin: "{{ item }}"
      loop: "{{ flux_sops_age_file_identities | default([]) }}"
      register: flux_sops_age_publics
      changed_when: false
      check_mode: false
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

    - name: Keep only the identities for the env's age recipients
      ansible.builtin.set_fact:
        # Double-quoted, so YAML turns the \n into a real newline.
        flux_sops_age_key_content: "{{ flux_sops_age_publics.results | default([]) | selectattr('stdout', 'in', flux_sops_recipients) | map(attribute='item') | join('\n') }}"
      no_log: true

    - name: Record whether the key file holds an identity for the env
      ansible.builtin.set_fact:
        flux_sops_age_matched: "{{ flux_sops_age_key_content | length > 0 }}"
      no_log: true

    - name: Refuse a key file with no identity for the env's age recipient
      ansible.builtin.assert:
        that:
          - flux_sops_age_matched | bool
        fail_msg: >-
          No identity in the age key file matches the age recipient for
          envs/{{ jarvis_env }}/secrets/ in .sops.yaml. Point SOPS_AGE_KEY_FILE
          or age_key_file at the key for this env.
      no_log: true

    - name: Read existing sops-age secret data when present
      ansible.builtin.command:
        cmd: >-
          {{ k3s_binary_path }} kubectl -n {{ flux_system_namespace }}
          get secret sops-age -o json
      register: flux_sops_age_existing_json
      changed_when: false
      when: flux_sops_age_present | bool
      check_mode: false
      no_log: true

    # The secret may hold more than the env's identity, and comment lines.
    # It passes when its identities include every one chosen from the key file.
    - name: Record whether the existing sops-age secret holds the env's identity
      ansible.builtin.set_fact:
        flux_sops_age_secret_holds_match: >-
          {{ flux_sops_age_key_content.splitlines()
             | difference(_existing.splitlines() | map('trim') | list)
             | length == 0 }}
      vars:
        _existing: >-
          {{ ((flux_sops_age_existing_json.stdout | from_json).get('data') or {}).get('age.agekey', '')
             | b64decode }}
      when: flux_sops_age_present | bool
      no_log: true

    - name: Refuse to overwrite an existing sops-age secret with different content
      ansible.builtin.assert:
        that:
          - flux_sops_age_secret_holds_match | bool
        fail_msg: >-
          flux-system/sops-age already exists with different content and may be
          the only copy of the age key. Do not delete it. Point SOPS_AGE_KEY_FILE
          or age_key_file at the original key, or copy age.agekey from the secret
          back to that path first (infra/ansible/README.md, Recovery).
      when: flux_sops_age_present | bool
      no_log: true
