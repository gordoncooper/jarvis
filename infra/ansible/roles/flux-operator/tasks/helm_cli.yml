---
- name: Read the installed Helm CLI version
  ansible.builtin.command:
    argv:
      - "{{ helm_binary_path }}"
      - version
      - --short
  register: flux_operator_helm_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the pinned Helm CLI when it is missing or another version
  when: >-
    flux_operator_helm_installed.rc != 0
    or (flux_operator_helm_installed.stdout | trim | regex_replace('\+.*$', ''))
    != ('v' ~ helm_version)
  block:
    - name: Create staging directory for Helm CLI
      ansible.builtin.tempfile:
        state: directory
        prefix: jarvis-helm-cli-
      register: flux_operator_helm_staging
      changed_when: false

    - name: Download pinned Helm CLI archive
      ansible.builtin.get_url:
        url: "{{ helm_download_url }}"
        dest: "{{ flux_operator_helm_staging.path }}/helm.tar.gz"
        mode: "0600"
        checksum: "sha256:{{ helm_linux_amd64_tarball_sha256 }}"

    - name: Extract Helm CLI binary
      ansible.builtin.command:
        cmd: >-
          tar -xzf {{ flux_operator_helm_staging.path }}/helm.tar.gz
          -C {{ flux_operator_helm_staging.path }}
          {{ helm_archive_member_linux_amd64 }}
          --strip-components=1
      changed_when: false

    - name: Install Helm CLI on node
      ansible.builtin.copy:
        src: "{{ flux_operator_helm_staging.path }}/helm"
        dest: "{{ helm_binary_path }}"
        mode: "0755"
        owner: "{{ helm_binary_owner }}"
        group: "{{ helm_binary_group }}"
        remote_src: true
  always:
    - name: Remove Helm CLI staging directory
      ansible.builtin.file:
        path: "{{ flux_operator_helm_staging.path }}"
        state: absent
      when: flux_operator_helm_staging is defined and flux_operator_helm_staging.path is defined
      changed_when: false
