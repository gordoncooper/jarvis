---
# Chart pin is spec.ref.tag in core/platform/flux-operator/oci-repository.yaml (chart_pin.yml).
# Seconds.
flux_operator_crd_wait_timeout: 120
flux_operator_rollout_wait_timeout: 300
flux_operator_helm_timeout: 5m
flux_system_namespace: flux-system
flux_operator_deployment_name: flux-operator
# sync.yaml's root GitRepository. Its presence marks a cluster Flux already syncs.
flux_root_source_name: flux-system
helm_binary_path: /usr/local/bin/helm
# The play runs as root.
helm_binary_owner: root
helm_binary_group: root
# Pinned Helm host CLI for the one-time bootstrap. The version and sha256 are bumped together by PR.
# Before the bootstrap install, a binary at helm_binary_path that is missing or reports another version is replaced.
# renovate: datasource=github-releases depName=helm/helm versioning=semver
helm_version: 4.3.2
helm_linux_amd64_tarball_sha256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
helm_archive_member_linux_amd64: linux-amd64/helm
helm_download_url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
# An ssh:// root reads the env repo with this sealed read-only deploy key, created once as
# flux-system/<flux_deploy_key_secret_name>, which sync.yaml's root GitRepository names.
flux_deploy_key_file: "{{ jarvis_env_dir }}/secrets/flux-deploy-key.sops.yaml"
flux_deploy_key_secret_name: flux-deploy-key
# The FluxInstance installs the source and kustomize CRDs before sync.yaml can apply. Seconds.
flux_crd_wait_timeout: 300
