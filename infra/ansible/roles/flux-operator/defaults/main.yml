---
# Chart pin is spec.ref.tag in platform/flux-operator/oci-repository.yaml (chart_pin.yml).
flux_operator_crd_wait_timeout: 120s
flux_operator_rollout_wait_timeout: 300s
flux_operator_helm_timeout: 5m
flux_system_namespace: flux-system
flux_operator_deployment_name: flux-operator
flux_instance_name: flux
helm_binary_path: /usr/local/bin/helm
# The play runs as root.
helm_binary_owner: root
helm_binary_group: root
# Pinned Helm host CLI for the one-time bootstrap. The version and sha256 are bumped together by PR.
# A binary at helm_binary_path that reports another version is replaced.
# renovate: datasource=github-releases depName=helm/helm versioning=semver
helm_version: 3.16.4
helm_linux_amd64_tarball_sha256: fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179
helm_archive_member_linux_amd64: linux-amd64/helm
helm_download_url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
# The repo's SOPS config. Its creation rule for envs/<jarvis_env>/secrets/ names the env's age recipients.
flux_sops_config_file: "{{ role_path }}/../../../../.sops.yaml"
