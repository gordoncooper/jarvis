---
- name: Record the k3s service this host will run
  ansible.builtin.set_fact:
    k3s_service_name: "{{ 'k3s' if 'control_plane' in group_names else 'k3s-agent' }}"

# LSB is-active: 0 active, 3 not active, 4 no such unit. Any other exit is an error.
- name: Probe whether k3s service is active
  ansible.builtin.command:
    cmd: systemctl is-active {{ k3s_service_name }}
  register: k3s_guard_active
  changed_when: false
  check_mode: false
  failed_when: k3s_guard_active.rc not in [0, 3, 4]

- name: Stat k3s binary
  ansible.builtin.stat:
    path: "{{ k3s_binary_path }}"
  register: k3s_guard_binary

- name: Stat k3s data directory
  ansible.builtin.stat:
    path: "{{ k3s_data_dir }}"
  register: k3s_guard_data

- name: Determine whether k3s is present on the host
  ansible.builtin.set_fact:
    k3s_guard_present: >-
      {{ (k3s_guard_active.stdout == 'active')
         or k3s_guard_binary.stat.exists
         or k3s_guard_data.stat.exists }}

- name: Stat jarvis env marker
  ansible.builtin.stat:
    path: "{{ jarvis_marker_path }}"
  register: k3s_guard_marker_stat

- name: Read jarvis env marker
  ansible.builtin.slurp:
    src: "{{ jarvis_marker_path }}"
  register: k3s_guard_marker
  when: k3s_guard_marker_stat.stat.exists

- name: Refuse host with foreign or unmarked k3s
  ansible.builtin.assert:
    that:
      - not (k3s_guard_present | bool) or (
          k3s_guard_marker_stat.stat.exists
          and (k3s_guard_marker.content | b64decode | trim) == jarvis_env
        )
    fail_msg: >-
      k3s is already present on this host but {{ jarvis_marker_path }} is missing or does not
      contain '{{ jarvis_env }}'. Wipe the node or fix the marker before re-running this env.
