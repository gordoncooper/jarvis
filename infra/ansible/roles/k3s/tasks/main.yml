---
- name: k3s guard and env marker
  ansible.builtin.import_tasks: guard.yml
  tags:
    - k3s

- name: Require k3s cluster-vars
  tags:
    - k3s
  ansible.builtin.assert:
    that:
      - k3s_version is defined
      - k3s_version | length > 0
      - k3s_sha256 is defined
      - k3s_sha256 | length == 64
      - pod_cidr is defined
      - service_cidr is defined
      - backup_path is defined
      - local_path_data is defined
      - bastion_kubeconfig_local_paths is defined
      - bastion_kubeconfig_local_paths | length >= 2
    fail_msg: k3s role requires k3s_version, k3s_sha256, CIDRs, paths, and bastion_kubeconfig_local_paths in cluster-vars.

- name: Ensure jarvis state directories exist
  tags:
    - k3s
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/jarvis
    - /etc/rancher/k3s
    - "{{ local_path_data }}"
    - "{{ backup_path }}"

- name: Install k3s server config
  tags:
    - k3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: Download pinned k3s binary
  tags:
    - k3s
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: "{{ k3s_binary_path }}"
    mode: "0755"
    owner: root
    group: root
    checksum: "sha256:{{ k3s_sha256 }}"
  register: k3s_binary_download

- name: Install k3s systemd unit
  tags:
    - k3s
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Reload systemd after unit or binary change
  tags:
    - k3s
  ansible.builtin.systemd:
    daemon_reload: true
  when: k3s_binary_download is changed

- name: Enable and start k3s
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    enabled: true
    state: started
  tags:
    - k3s
    - k3s-service

- name: Fetch kubeconfig to bastion paths
  ansible.builtin.include_tasks: kubeconfig.yml
  tags:
    - k3s
    - k3s-service
    - k3s-kubeconfig
