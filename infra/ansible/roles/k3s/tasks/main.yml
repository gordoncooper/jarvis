---
- name: Require k3s mode
  ansible.builtin.assert:
    that: k3s_mode in ['server', 'agent']
    fail_msg: k3s role requires k3s_mode server or agent.

- name: Set the k3s service name
  ansible.builtin.set_fact:
    k3s_service_name: "{{ 'k3s' if k3s_mode == 'server' else 'k3s-agent' }}"
  changed_when: false

- name: k3s guard and env marker
  ansible.builtin.import_tasks: guard.yml

- name: Require k3s cluster-vars
  ansible.builtin.assert:
    that:
      - k3s_version is defined
      - k3s_version | length > 0
      - k3s_sha256 is defined
      - k3s_sha256 | length == 64
      - pod_cidr is defined
      - service_cidr is defined
      - backup_path is defined
      - local_path_data is defined
    fail_msg: k3s role requires k3s_version, k3s_sha256, CIDRs, and paths in cluster-vars.

- name: Require an amd64 host
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'x86_64'
    fail_msg: k3s role supports only amd64 hosts.

- name: Read the server node token
  ansible.builtin.import_tasks: token.yml
  when: k3s_mode == 'agent'

- name: Ensure jarvis state directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/jarvis
    - /etc/rancher/k3s
    - "{{ local_path_data }}"
    - "{{ backup_path }}"
    - "{{ backup_path }}/etcd-snapshots"

- name: Install k3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_path }}"
    owner: root
    group: root
    mode: "0600"
  when: k3s_mode == 'server'
  notify: Restart k3s

- name: Install k3s agent config
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ k3s_config_path }}"
    owner: root
    group: root
    mode: "0600"
  when: k3s_mode == 'agent'
  no_log: true
  notify: Restart k3s

- name: Download pinned k3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: "{{ k3s_binary_path }}"
    mode: "0755"
    owner: root
    group: root
    checksum: "sha256:{{ k3s_sha256 }}"
  notify: Restart k3s

- name: Install k3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "/etc/systemd/system/{{ k3s_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Enable and start k3s
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
