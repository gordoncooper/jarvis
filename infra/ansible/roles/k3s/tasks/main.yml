---
- name: Require k3s mode
  ansible.builtin.assert:
    that: k3s_mode in ['server', 'agent']
    fail_msg: k3s role requires k3s_mode server or agent.

- name: Set the k3s service name
  ansible.builtin.set_fact:
    k3s_service_name: "{{ 'k3s' if k3s_mode == 'server' else 'k3s-agent' }}"
  changed_when: false

- name: Write the jarvis env marker
  ansible.builtin.import_tasks: guard.yml

- name: Read the sealed tokens and refuse a mismatch
  ansible.builtin.import_tasks: token.yml

# A first install starts k3s once. Restart k3s only if it was already running.
# LSB is-active: 0 active, 3 not active, 4 no such unit. Any other exit is an error.
- name: Record whether k3s was running before this run
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ k3s_service_name }}"]
  register: k3s_was_active
  changed_when: false
  check_mode: false
  failed_when: k3s_was_active.rc not in [0, 3, 4]

- name: Ensure jarvis state directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/jarvis
    - /etc/rancher/k3s

- ansible.builtin.import_tasks: data-dirs.yml

- name: Install k3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_path }}"
    owner: root
    group: root
    mode: "0600"
  when: k3s_mode == 'server'
  no_log: true
  notify: Restart k3s

- name: Install k3s agent config
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ k3s_config_path }}"
    owner: root
    group: root
    mode: "0600"
  when: k3s_mode == 'agent'
  no_log: true
  notify: Restart k3s

- name: Download pinned k3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: "{{ k3s_binary_path }}"
    mode: "0755"
    owner: root
    group: root
    checksum: "sha256:{{ k3s_sha256 }}"
  notify: Restart k3s

- name: Install k3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "{{ k3s_unit_dir }}/{{ k3s_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- ansible.builtin.import_tasks: service-unit.yml

- name: Enable and start k3s
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

# A new cluster has no etcd snapshot until k3s's first scheduled one (k3s_etcd_snapshot_schedule_cron,
# 00:00 and 12:00 by default), so a drill or restore right after setup would have nothing to use.
# Take one now; the etcd-snapshots CronJob copies it on its next run. A cluster that already has
# a snapshot is left alone.
- name: Find etcd snapshots
  when: k3s_mode == 'server'
  ansible.builtin.find:
    paths: "{{ backup_path }}/etcd-snapshots"
    file_type: file
  register: k3s_etcd_snapshot_files

- name: Take the first etcd snapshot on a new cluster
  when: k3s_mode == 'server' and k3s_etcd_snapshot_files.matched == 0
  ansible.builtin.command:
    argv:
      - "{{ k3s_binary_path }}"
      - etcd-snapshot
      - save
      - --etcd-snapshot-dir
      - "{{ backup_path }}/etcd-snapshots"
  changed_when: true
