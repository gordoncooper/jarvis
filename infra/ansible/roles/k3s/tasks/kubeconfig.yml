---
- name: Fetch kubeconfig from node
  ansible.builtin.fetch:
    src: "{{ k3s_remote_kubeconfig }}"
    dest: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/jarvis-kubeconfig-{{ inventory_hostname }}.yaml"
    flat: true
  tags:
    - k3s
    - k3s-service
    - k3s-kubeconfig

- name: Point kubeconfig server at inventory hostname
  ansible.builtin.replace:
    path: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/jarvis-kubeconfig-{{ inventory_hostname }}.yaml"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ inventory_hostname }}:6443"
  delegate_to: localhost
  become: false
  tags:
    - k3s
    - k3s-service
    - k3s-kubeconfig

- name: Install kubeconfig for each bastion destination
  ansible.builtin.copy:
    src: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/jarvis-kubeconfig-{{ inventory_hostname }}.yaml"
    dest: "{{ item }}"
    mode: "0600"
    owner: "{{ lookup('env', 'USER') }}"
  delegate_to: localhost
  become: false
  loop: "{{ bastion_kubeconfig_local_paths }}"
  tags:
    - k3s
    - k3s-service
    - k3s-kubeconfig
