---
- name: Stage kubeconfig on bastion localhost
  tags:
    - k3s
    - k3s-service
    - k3s-kubeconfig
  block:
    - name: Create temp directory for kubeconfig staging
      ansible.builtin.tempfile:
        state: directory
        prefix: jarvis-kubeconfig-
      register: k3s_kubeconfig_staging
      delegate_to: localhost
      become: false

    - name: Fetch kubeconfig from node
      ansible.builtin.fetch:
        src: "{{ k3s_remote_kubeconfig }}"
        dest: "{{ k3s_kubeconfig_staging.path }}/k3s.yaml"
        flat: true

    - name: Point kubeconfig server at inventory hostname
      ansible.builtin.replace:
        path: "{{ k3s_kubeconfig_staging.path }}/k3s.yaml"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ inventory_hostname }}:6443"
      delegate_to: localhost
      become: false

    - name: Ensure bastion .kube directory exists
      ansible.builtin.file:
        path: "{{ item.path | dirname }}"
        state: directory
        mode: "0700"
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
      delegate_to: localhost
      become: true
      loop: "{{ bastion_kubeconfig_destinations }}"

    - name: Install kubeconfig for each bastion destination
      ansible.builtin.copy:
        src: "{{ k3s_kubeconfig_staging.path }}/k3s.yaml"
        dest: "{{ item.path }}"
        mode: "0600"
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
      delegate_to: localhost
      become: true
      loop: "{{ bastion_kubeconfig_destinations }}"
  always:
    - name: Remove kubeconfig staging directory
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_staging.path }}"
        state: absent
      when: k3s_kubeconfig_staging is defined and k3s_kubeconfig_staging.path is defined
      delegate_to: localhost
      become: false
