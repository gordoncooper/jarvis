---
- name: Ensure jarvis marker directory exists
  ansible.builtin.file:
    path: /etc/jarvis
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write jarvis env marker
  ansible.builtin.copy:
    dest: "{{ jarvis_marker_path }}"
    content: "{{ jarvis_env }}\n"
    owner: root
    group: root
    mode: "0644"
