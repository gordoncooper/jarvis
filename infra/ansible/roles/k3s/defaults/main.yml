---
# Populated from env cluster-vars (see schema/CONTRACT.md).
# k3s_binary_path and k3s_data_dir are playbook group_vars (shared with node-disk).
k3s_config_path: /etc/rancher/k3s/config.yaml
k3s_unit_dir: /etc/systemd/system
jarvis_marker_path: /etc/jarvis/env
# The sealed server and agent tokens, decrypted on the controller.
k3s_token_file: "{{ jarvis_env_dir }}/secrets/k3s-token.sops.yaml"
# k3s v1.36.5+k3s1 built-in defaults; snapshot dir comes from backup_path.
k3s_etcd_snapshot_schedule_cron: "0 */12 * * *"
k3s_etcd_snapshot_retention: 5

# The node's memory in MiB, for the kubelet eviction reserve. Read from ansible_facts, not the
# injected ansible_memtotal_mb variable, which ansible-core 2.24 drops (INJECT_FACTS_AS_VARS).
k3s_node_memtotal_mb: "{{ ansible_facts['memtotal_mb'] }}"
