---
- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  tags:
    - base-os
    - journald

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  tags:
    - base-os
    - resolved

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
  tags:
    - base-os
    - time
