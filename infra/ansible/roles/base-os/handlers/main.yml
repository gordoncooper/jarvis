---
- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Reconfigure tzdata
  ansible.builtin.command:
    cmd: dpkg-reconfigure -f noninteractive tzdata
  changed_when: true
