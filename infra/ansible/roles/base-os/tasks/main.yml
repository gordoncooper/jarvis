---
- name: Require time_zone from cluster-vars
  ansible.builtin.assert:
    that:
      - time_zone is defined
      - time_zone | length > 0
    fail_msg: time_zone must be set in cluster-vars (env schema).
  tags:
    - base-os

- name: Install base OS packages
  ansible.builtin.apt:
    name:
      - chrony
      - unattended-upgrades
      - tzdata
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - base-os

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - base-os
    - journald

- name: Install journald disk cap
  ansible.builtin.template:
    src: journald-jarvis.conf.j2
    dest: /etc/systemd/journald.conf.d/jarvis.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald
  tags:
    - base-os
    - journald

# AppArmor usr.sbin.chronyd only allows chronyd to read /etc/chrony/**; validate must copy there.
- name: Install chrony configuration with NTS
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/bin/sh -c 'f=/etc/chrony/.ansible-validate.conf; install -m 0644 \"$1\" \"$f\" && chronyd -p -f \"$f\" >/dev/null; rc=$?; rm -f \"$f\"; exit $rc' _ %s"
  tags:
    - base-os
    - time

- name: Enable and start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  tags:
    - base-os
    - time
    - chrony-service

- name: Configure periodic apt (list refresh only)
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  tags:
    - base-os
    - apt-policy

- name: Keep unattended-upgrades package policy inert
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  tags:
    - base-os
    - apt-policy

- name: Keep apt-daily timer enabled for package list refresh
  ansible.builtin.systemd:
    name: apt-daily.timer
    enabled: true
    state: started
  tags:
    - base-os
    - apt-policy

- name: Disable automatic package upgrades timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    enabled: false
    state: stopped
  tags:
    - base-os
    - apt-policy

- name: Set node timezone from cluster-vars
  community.general.timezone:
    name: "{{ time_zone }}"
  tags:
    - base-os
    - time

# Edge only. ServiceLB requests hostPort 53 with no hostIP, and the portmap
# DNAT sends locally generated traffic for the stub at 127.0.0.53 to App DNS.
# systemd-resolved.service(8): with the stub off, resolv.conf points at the
# upstream list resolved already uses. A later site.yml applies this when a
# host joins edge. Leaving edge does not turn the stub back on.
- name: Keep edge host DNS off the resolved stub
  when: "'edge' in group_names"
  tags:
    - base-os
    - resolved
  block:
    - name: Ensure resolved drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - base-os
        - resolved

    - name: Install resolved stub listener drop-in
      ansible.builtin.template:
        src: resolved-stub.conf.j2
        dest: /etc/systemd/resolved.conf.d/jarvis.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-resolved
      tags:
        - base-os
        - resolved

    - name: Point resolv.conf at resolved's upstream list
      ansible.builtin.file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
        # Link only. follow true with owner or group chowns the target, and
        # resolved replaces that file, so the next run stays changed.
        follow: false
      tags:
        - base-os
        - resolved
