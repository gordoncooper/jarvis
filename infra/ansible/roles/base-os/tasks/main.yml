---
- name: Require time_zone from cluster-vars
  ansible.builtin.assert:
    that:
      - time_zone is defined
      - time_zone | length > 0
    fail_msg: time_zone must be set in cluster-vars (env schema).

- name: Install base OS packages
  ansible.builtin.apt:
    name:
      - chrony
      - unattended-upgrades
      - tzdata
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install journald disk cap
  ansible.builtin.template:
    src: journald-jarvis.conf.j2
    dest: /etc/systemd/journald.conf.d/jarvis.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald

- name: Install chrony configuration with NTS
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Install unattended-upgrades periodic config
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Install unattended-upgrades policy
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Read current timezone file
  ansible.builtin.slurp:
    src: /etc/timezone
  register: base_os_tz_file
  failed_when: false

- name: Set node timezone from cluster-vars
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ time_zone }}\n"
    owner: root
    group: root
    mode: "0644"
  when: base_os_tz_file.failed or (base_os_tz_file.content | b64decode | trim) != time_zone
  notify: Reconfigure tzdata
