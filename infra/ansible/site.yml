---
# Fact asserts run before any change. Tags for k3s, kubeconfig, and flux-operator are on the plays.
- name: Assert facts before any change
  hosts: all
  become: true
  gather_facts: false
  tags: [always]
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  tasks:
    - name: Assert exactly one control_plane host
      ansible.builtin.assert:
        that:
          - groups['control_plane'] | default([]) | length == 1
        fail_msg: >-
          control_plane has {{ groups['control_plane'] | default([]) | length }} hosts;
          expected exactly one.
          Pass both inventories, as in infra/ansible/README.md:
          ansible-playbook site.yml
          -i ../../envs/<env>/inventory/hosts.yml
          -i ../inventory/roles.yml
          -e jarvis_cluster_vars=../../envs/<env>/values/cluster-vars.yaml

    - name: Assert a declared gpu host has an NVIDIA device
      ansible.builtin.import_tasks: tasks/assert-gpu.yml

- name: Base OS
  hosts: all
  become: true
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  roles:
    - base-os

- name: Prepare data disk
  hosts: data_disk
  become: true
  gather_facts: false
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  roles:
    - node-disk

- name: Install k3s server
  hosts: control_plane
  become: true
  tags: [k3s]
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  roles:
    - role: k3s
      vars:
        k3s_mode: server

- name: Join k3s agents
  hosts: all:!control_plane
  become: true
  tags: [k3s]
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  roles:
    - role: k3s
      vars:
        k3s_mode: agent

- name: Reconcile node labels
  hosts: control_plane
  become: true
  gather_facts: false
  tags: [k3s]
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  tasks:
    - ansible.builtin.import_role:
        name: k3s
        tasks_from: labels.yml

- name: Install kubeconfig
  hosts: control_plane
  become: true
  gather_facts: false
  tags: [kubeconfig]
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  roles:
    - kubeconfig

- name: Install Flux Operator
  hosts: control_plane
  become: true
  tags: [flux-operator]
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  roles:
    - flux-operator
