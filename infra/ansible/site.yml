---
# Fact asserts run before any change, and again after node-disk, before k3s (D42).
# k3s and flux-operator stay on all until the agent play is split.
- name: Assert facts before any change
  hosts: all
  become: true
  gather_facts: false
  tags:
    - always
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  tasks:
    - name: Find PCI vendor files
      ansible.builtin.find:
        paths: /sys/bus/pci/devices
        patterns: vendor
        recurse: true
        file_type: file
      register: node_pci_vendors
      when: "'gpu' in group_names"

    - name: Read PCI vendor ids
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ node_pci_vendors.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      register: node_pci_vendor_ids
      when: "'gpu' in group_names"

    - name: A declared gpu host has an NVIDIA device
      ansible.builtin.assert:
        that:
          - node_pci_vendor_ids.results | default([]) | map(attribute="content") | map("b64decode") | map("trim") | map("lower") | select("equalto", "0x10de") | list | length > 0
        fail_msg: "gpu host {{ inventory_hostname }} has no NVIDIA device."
      when: "'gpu' in group_names"

- name: Base OS
  hosts: all
  become: true
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  roles:
    - base-os

- name: Prepare data disk
  hosts: data_disk
  become: true
  gather_facts: false
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  roles:
    - node-disk

- name: Assert the data disk is mounted before k3s
  hosts: data_disk
  become: true
  gather_facts: false
  tags:
    - always
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  tasks:
    - name: Read mounts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - mounts
      register: jarvis_mount_setup

    - name: Select the /var/lib/jarvis mount
      ansible.builtin.set_fact:
        jarvis_data_mounts: >-
          {{ jarvis_mount_setup.ansible_facts.ansible_mounts
             | selectattr('mount', 'equalto', '/var/lib/jarvis')
             | list }}
      changed_when: false

    - name: Read the /var/lib/jarvis filesystem
      ansible.builtin.command:
        argv:
          - blkid
          - -o
          - export
          - "{{ jarvis_data_mounts[0].device if (jarvis_data_mounts | length == 1) else '/dev/null' }}"
      register: jarvis_data_blkid
      changed_when: false
      when: jarvis_data_mounts | length == 1

    - name: /var/lib/jarvis is mounted as jarvis-data
      ansible.builtin.assert:
        that:
          - jarvis_data_mounts | length == 1
          - "'LABEL=jarvis-data' in (jarvis_data_blkid.stdout | default(''))"
        fail_msg: "/var/lib/jarvis on {{ inventory_hostname }} is not mounted as jarvis-data."

- name: Bootstrap k3s and Flux
  hosts: all
  become: true
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
  roles:
    - k3s
    - flux-operator
