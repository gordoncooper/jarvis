---
# §8 step 4 order: base-os → node-disk → k3s → flux-operator.
- name: Bootstrap jarvis node
  hosts: all
  become: true
  vars:
    ansible_user: "{{ ssh_user }}"
  vars_files:
    - "{{ jarvis_cluster_vars }}"
    - "{{ jarvis_nodes_vars }}"
  roles:
    - base-os
    - role: node-disk
      when: nodes[inventory_hostname].data_disk is defined
    - k3s
    - flux-operator
