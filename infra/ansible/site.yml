---
# Fact asserts run before any change. One bad host stops the run. Tags for k3s,
# kubeconfig, and flux-operator are on the plays.
# ansible_user uses ssh_user, or the schema default when cluster-vars omits it (D34).
- name: Assert facts before any change
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [always]
  vars: &jarvis_play_vars
    ansible_user: "{{ ssh_user | default('ubuntu') }}"
  vars_files: &jarvis_vars_files
    - "{{ jarvis_cluster_vars }}"
  tasks:
    - name: Assert architecture, cluster-vars, and host facts
      ansible.builtin.import_tasks: tasks/preflight.yml

    - name: Assert a declared gpu host has an NVIDIA device
      ansible.builtin.import_tasks: tasks/assert-gpu.yml

    - name: Refuse a foreign or unmarked k3s
      ansible.builtin.import_role:
        name: k3s
        tasks_from: refuse.yml

    - name: Check a declared data disk
      ansible.builtin.import_role:
        name: node-disk

- name: Base OS
  hosts: all
  become: true
  vars: *jarvis_play_vars
  vars_files: *jarvis_vars_files
  roles:
    - base-os

- name: Install k3s server
  hosts: control_plane
  become: true
  tags: [k3s]
  vars: *jarvis_play_vars
  vars_files: *jarvis_vars_files
  roles:
    - role: k3s
      vars:
        k3s_mode: server

- name: Join k3s agents
  hosts: all:!control_plane
  become: true
  tags: [k3s]
  vars: *jarvis_play_vars
  vars_files: *jarvis_vars_files
  roles:
    - role: k3s
      vars:
        k3s_mode: agent

- name: Reconcile node labels
  hosts: control_plane
  become: true
  gather_facts: false
  tags: [k3s]
  vars: *jarvis_play_vars
  vars_files: *jarvis_vars_files
  tasks:
    - ansible.builtin.import_role:
        name: k3s
        tasks_from: labels.yml

- name: Install kubeconfig
  hosts: control_plane
  become: true
  gather_facts: false
  tags: [kubeconfig]
  vars: *jarvis_play_vars
  vars_files: *jarvis_vars_files
  roles:
    - kubeconfig

- name: Install Flux Operator
  hosts: control_plane
  become: true
  tags: [flux-operator]
  vars: *jarvis_play_vars
  vars_files: *jarvis_vars_files
  roles:
    - flux-operator
