---
# Read-only. A failure here is fatal for every host (the play sets any_errors_fatal).
- name: Assert exactly one control_plane host
  ansible.builtin.assert:
    that:
      - groups['control_plane'] | default([]) | length == 1
    fail_msg: >-
      control_plane has {{ groups['control_plane'] | default([]) | length }} hosts;
      expected exactly one.
      Pass both inventories with jarvis site --env <env>
      (hosts file, then infra/inventory/roles).

- name: Collect host architecture
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - platform
    filter:
      - ansible_architecture

- name: Require an amd64 host
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'x86_64'
    fail_msg: k3s role supports only amd64 hosts.

- name: Require k3s cluster-vars
  ansible.builtin.assert:
    that:
      - k3s_version is defined
      - k3s_version | length > 0
      - k3s_sha256 is defined
      - k3s_sha256 | length == 64
      - pod_cidr is defined
      - service_cidr is defined
      - backup_path is defined
      - local_path_data is defined
      - jarvis_env is defined
      - jarvis_env | length > 0
    fail_msg: >-
      site.yml requires k3s_version, k3s_sha256, CIDRs, paths, and jarvis_env
      in cluster-vars.

- name: Require a node memory reserve from 0 to 50 percent
  ansible.builtin.assert:
    that:
      - (node_memory_reserve_percent | default(10) | string) is match('^[0-9]+$')
      - node_memory_reserve_percent | default(10) | int <= 50
    fail_msg: >-
      node_memory_reserve_percent is a whole number from 0 to 50
      (the share of each node's memory no pod is scheduled into; default 10).

# The k3s role compares this host's memory.available threshold with the reserve; its config
# task logs nothing, so a threshold it cannot read stops here, before any change.
- name: Require a readable eviction-hard memory.available on each host
  ansible.builtin.assert:
    that: >-
      (jarvis_host_eviction_hard | default('') or k3s_kubelet_eviction_hard | default('')).split(',')
      | map('trim') | select('match', '^memory\.available') | reject('match', _quantity) | list | length == 0
    fail_msg: >-
      eviction-hard's memory.available on {{ inventory_hostname }} is not a Kubernetes quantity
      (such as 100Mi) or a percent (such as 10%).
  vars:
    _quantity: '^memory\.available<([0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?|[0-9]+(\.[0-9]+)?%)$'

- name: Require the instance repository
  ansible.builtin.assert:
    that:
      - jarvis_instance_root is defined
      - jarvis_instance_root | length > 0
    fail_msg: >-
      jarvis_instance_root is not set: run jarvis site --env <env> from the instance repository,
      which passes it.

- name: Require the env FluxInstance and Flux sources in Git
  ansible.builtin.assert:
    that:
      - flux_instance_file is file
      - flux_sync_file is file
    fail_msg: >-
      core/flux/flux-instance.yaml (core's) or envs/{{ jarvis_env }}/flux/sync.yaml is missing.
      flux-operator applies them on a new cluster; commit sync.yaml before running site.yml.
