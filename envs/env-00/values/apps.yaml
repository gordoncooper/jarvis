# The names of the hosted apps this env runs are in values/switches.yaml. Everything else about
# an app is in its own app file in the apps repository; this file holds what the env decides for it.
# Exception lines, '<app>: <grant>', one grant each. A grant takes effect only for an app
# whose app file asks for the same item. Grants: privileged, root, host-network,
# host-path, hostname <name>, lan-port <port>/<TCP|UDP>, lan-all,
# lan-target <name> <cidr> <port>/<TCP|UDP> (inside values/cluster-vars.yaml lan_cidrs).
# One line needs no ask: no-uptime-check takes the app's web address out of the uptime check.
exceptions:
  - lan-demo: lan-port 8080/TCP
# Backup selection (platform/backups/CONTRACT.md): default off until an app is listed here.
# mode selected: only selected apps with backup-eligible volumes register a credential.
# mode all_except: every eligible listed app registers except exclude.
backups:
  mode: selected
  selected: []
