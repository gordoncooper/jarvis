# Example env. Identity values are invented. k3s_version and k3s_sha256 are the
# pin platform/traefik/CONTRACT.md checks, so a copy can run.
jarvis_env: env-00
dns_suffix: env-00.example
time_zone: Etc/UTC
ssh_user: example
age_key_file: ~/.config/sops/age/keys.txt

backup_path: /var/lib/jarvis/backup
backup_retention_daily: 1
backup_retention_weekly: 2
backup_retention_monthly: 3
backup_schedule: 0 0 * * *
backup_check_schedule: 30 6 * * 3

k3s_version: v1.36.5+k3s1
k3s_sha256: d73847bcd3c5fccef0115b372e2f9a91f3032dc84bbf71518a4617565294d313
pod_cidr: 10.80.0.0/16
service_cidr: 10.81.0.0/16
app_dns_cluster_ip: 10.81.0.53
# The LAN's ranges (invented here). Hosted apps' internet egress never reaches
# them; lan-all and lan-target exception lines open them only inside these.
lan_cidrs:
  - 10.200.0.0/24
local_path_data: /var/lib/jarvis/local-path

k3s_kubelet_kube_reserved: cpu=100m,memory=128Mi
k3s_kubelet_system_reserved: cpu=100m,memory=128Mi
k3s_kubelet_eviction_hard: memory.available<100Mi
# The share of each node's memory no pod is scheduled into: the kubelet's
# memory.available eviction threshold, unless the line above is larger.
node_memory_reserve_percent: 10

ntp_pools:
  - time.example
chrony_nts: true

flux_git_repo_url: https://github.com/example-owner/example-cluster
apps_git_repo_url: https://github.com/example-owner/example-apps
flux_git_ref: refs/heads/example
core_git_repo_url: https://github.com/example-owner/example-core
core_git_ref: refs/heads/example

llm_provider_host: llm.example
