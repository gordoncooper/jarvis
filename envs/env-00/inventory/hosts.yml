all:
  hosts:
    cp-1:
      node_roles: [control_plane]
      data_disk: true
    wk-1:
      node_roles: [workers, edge]
      data_disk: true
    wk-2:
      node_roles: [workers, gpu]
      data_disk: true
    wk-3:
      node_roles: [workers, gpu]
      data_disk: true
    wk-4:
      # Keeps data on the root disk. No data_disk.
      node_roles: [workers]
    st-1:
      node_roles: [storage]
      data_disk: true
    bk-1:
      node_roles: [backup]
      data_disk: true
