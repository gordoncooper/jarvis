apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - generated/cluster-vars-configmap.yaml
  - flux-instance.yaml
  - sync.yaml
  - identities.yaml
  - kustomizations/platform-controllers.yaml
  - kustomizations/platform-configs.yaml
  - kustomizations/services.yaml
  - kustomizations/apps.yaml
  # One trusted wiring per app in values/apps.yaml, rendered by tools/lib/render_apps.py.
  # An env that lists no app has neither this line nor the file.
  - generated/apps.yaml
