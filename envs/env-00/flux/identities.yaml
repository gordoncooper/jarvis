# The identities the Flux Kustomizations and HelmReleases run as. The root
# sync applies this file as kustomize-controller, so no Kustomization creates
# the account it runs as. Removing an account here stops every object that
# names it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-platform
  namespace: flux-system
---
# platform-controllers and platform-configs install CRDs, cluster policies,
# webhooks and charts in their own namespaces. services applies each enabled
# add-on's namespaces and tenant identity, which the add-on cannot create itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: flux-platform
    namespace: flux-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-apps
  namespace: flux-system
---
# apps applies and prunes one placeholder ConfigMap in default.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-apps
  namespace: default
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [placeholder-apps]
    verbs: [get, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-apps
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-apps
subjects:
  - kind: ServiceAccount
    name: flux-apps
    namespace: flux-system
