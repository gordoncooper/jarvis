apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-backups-test-verify
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  wait: true
  prune: true
  path: ./platform/backups/test/verify
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-backups-test-restore
