apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-backups-test-restore
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  wait: true
  prune: true
  path: ./platform/backups/test/restore
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-backups-test-backup
  healthCheckExprs:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationDestination
      current: "has(status.lastManualSync) && status.lastManualSync == 'test-1'"
