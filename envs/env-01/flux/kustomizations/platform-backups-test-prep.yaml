apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-backups-test-prep
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  wait: true
  prune: true
  path: ./platform/backups/test/prep
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-configs
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
