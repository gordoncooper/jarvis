# P0a rollback drill (R37): revert a commit that changes drill_token to restore baseline.
# Remove this ConfigMap during P0a exit cleanup once the drill evidence is attached.
apiVersion: v1
kind: ConfigMap
metadata:
  name: p0a-rollback-drill
  namespace: platform-backups
  labels:
    jarvis.alpha/purpose: p0a-rollback-drill
data:
  drill_token: baseline
