# Ansible (flux-operator role) applies this file once on a new cluster; Flux reconciles it from Git after that (R1).
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    # renovate: datasource=github-releases depName=fluxcd/flux2 versioning=semver
    version: "2.8.8"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: medium
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  sync:
    kind: GitRepository
    url: "https://github.com/gordoncooper/jarvis"
    ref: "refs/heads/main"
    path: "envs/env-01/flux"
  kustomize:
    patches:
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=StrictPostBuildSubstitutions=true
        target:
          kind: Deployment
          name: kustomize-controller
