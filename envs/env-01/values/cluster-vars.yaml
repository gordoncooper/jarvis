# Flat keys for Flux postBuild substitution and Ansible (env schema: schema/CONTRACT.md).
jarvis_env: env-01
dns_suffix: alpha.lan
time_zone: America/Los_Angeles
code_delivery: github
build_agent: cursor
ssh_user: ubuntu

backup_path: /var/lib/jarvis/backup
backup_retention_daily: 7
backup_retention_weekly: 4
backup_retention_monthly: 3

# Host binary; changes only by PR (R33, D5). CIDRs are k3s defaults for this pin (D4).
k3s_version: v1.36.5+k3s1
k3s_sha256: d73847bcd3c5fccef0115b372e2f9a91f3032dc84bbf71518a4617565294d313
pod_cidr: 10.42.0.0/16
service_cidr: 10.43.0.0/16
local_path_data: /var/lib/jarvis/local-path

# Node-sized kubelet reservations and eviction (Ansible k3s role).
k3s_kubelet_kube_reserved: cpu=500m,memory=1Gi,ephemeral-storage=1Gi
k3s_kubelet_system_reserved: cpu=500m,memory=1Gi,ephemeral-storage=1Gi
k3s_kubelet_eviction_hard: memory.available<500Mi,nodefs.available<10%

# Chrony NTS pools (base-os role).
ntp_pools:
  - ntp.ubuntu.com

# Flux Git sync (public HTTPS, no deploy key; R25).
flux_git_repo_url: https://github.com/gordoncooper/jarvis
apps_git_repo_url: https://github.com/gordoncooper/jarvis-apps
flux_git_ref: refs/heads/main

# AI provider API host (D45).
llm_provider_host: api.x.ai
