# Hostnames only (R25, D2). Inventory is not encrypted and does not need the age key (D42).
# bench.lan keeps Jarvis data on the root disk on purpose.
# It has no data_disk. The other drive is the OS-install disk and stays out of this inventory.
all:
  hosts:
    bench.lan:
      node_roles: [control_plane, workers, storage, backup]
