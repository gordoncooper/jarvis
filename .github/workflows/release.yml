name: release

# A pushed v* tag becomes a GitHub release. Its notes are that tag's section of CHANGELOG.md;
# a tag with no section fails, so every release says what changed and how to upgrade.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notes from CHANGELOG.md
        run: python3 ci/release-notes "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
