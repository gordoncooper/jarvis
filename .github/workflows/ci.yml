name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned CLIs and portable Node
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.local/bin
            tools/.node
            tools/renovate/node_modules
          key: jarvis-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/install-deps', 'tools/renovate/package-lock.json') }}

      - name: Install pinned CLIs
        run: make deps

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test deps
        run: pip install -r requirements-dev.txt

      - name: Validate renovate.json
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          renovate-config-validator

      - name: Run tools/checks
        run: bash tools/run-checks

      - name: pytest (non-container)
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          pytest -m "not container"

  slow:
    name: slow (${{ matrix.container_test_file }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container_test_file:
          - test_base_os
          - test_flux_operator
          - test_k3s
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned CLIs and portable Node
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.local/bin
            tools/.node
            tools/renovate/node_modules
          key: jarvis-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/install-deps', 'tools/renovate/package-lock.json') }}

      - name: Install pinned CLIs
        run: make deps

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test deps
        run: pip install -r requirements-dev.txt

      - name: pytest (container)
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          pytest "tools/tests/${{ matrix.container_test_file }}.py" -m container

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - fast
      - slow
    if: ${{ always() }}
    steps:
      - name: Require fast and slow
        run: |
          set -euo pipefail
          echo "fast: ${{ needs.fast.result }}"
          echo "slow: ${{ needs.slow.result }}"
          if [[ "${{ needs.fast.result }}" != "success" || "${{ needs.slow.result }}" != "success" ]]; then
            exit 1
          fi
