name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # The product holds only the env-00 sample, so one leg covers it. Real envs
  # live in instance repos, whose CI runs this repo's env-level checks.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ci/checks/secret-scan reads the whole history, so it needs every commit.
          fetch-depth: 0

      - name: Restore pinned CLIs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: jarvis-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/install-deps') }}

      - name: Install pinned CLIs and Python test deps
        run: make deps

      - name: Fetch the loopback API server for the admission test
        run: ci/fetch-test-apiserver

      - name: Run ci/checks
        env:
          OWNER_NAME: ${{ vars.OWNER_NAME }}
        run: bash ci/run-checks

      - name: pytest
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          .venv/bin/pytest -ra
