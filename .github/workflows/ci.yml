name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast:
    name: fast (${{ matrix.copy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        copy:
          - full
          - env00-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ci/checks/secret-scan reads the whole history, so it needs every commit.
          fetch-depth: 0

      - name: Keep only the env-00 sample (throwaway local commit, never pushed)
        if: ${{ matrix.copy == 'env00-only' }}
        run: |
          set -euo pipefail
          for dir in envs/*/; do
            dir="${dir%/}"
            if [[ "${dir}" != "envs/env-00" ]]; then
              git rm -r -q "${dir}"
            fi
          done
          if ! git diff --cached --quiet; then
            git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "ci: keep only env-00"
          fi
          echo "envs/ now holds:"
          git ls-files envs | cut -d/ -f2 | sort -u

      - name: Restore pinned CLIs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: jarvis-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/install-deps') }}

      - name: Install pinned CLIs and Python test deps
        run: make deps

      - name: Run ci/checks
        env:
          OWNER_NAME: ${{ vars.OWNER_NAME }}
        run: bash ci/run-checks

      - name: pytest
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          .venv/bin/pytest -ra

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - fast
    if: ${{ always() }}
    steps:
      - name: Require fast
        run: |
          set -euo pipefail
          echo "fast: ${{ needs.fast.result }}"
          if [[ "${{ needs.fast.result }}" != "success" ]]; then
            exit 1
          fi
