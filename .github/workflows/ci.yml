name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # The product holds only the env-00 sample, so one leg covers it. Real envs
  # live in instance repos, whose CI runs this repo's env-level checks.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ci/checks/secret-scan reads the whole history, so it needs every commit.
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.5
          install: false

      # mise.lock must hold every tool's checksum for every platform mise.toml serves. On a
      # mismatch the step prints the lock to commit (Renovate's PRs update it themselves).
      - name: mise.lock matches mise.toml
        run: |
          set -euo pipefail
          mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
          if ! git diff --quiet -- mise.lock || [[ -n "$(git status --porcelain -- mise.lock)" ]]; then
            echo "::error file=mise.lock::mise.lock does not match mise.toml; commit the lock below (mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64)"
            cat mise.lock
            exit 1
          fi

      - name: Install the pinned CLIs and Python packages
        run: make deps

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      # A docs-only PR runs no tests and a Renovate PR only the tests its files reach (ci/select-tests);
      # every other PR, and main, runs the whole suite. The installs and the rule checks always run.
      - name: Select tests
        id: select
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            mapfile -t changed < <(git diff --name-only "origin/${BASE_REF}...HEAD")
            tests="$(python3 ci/select-tests --branch "${HEAD_REF}" "${changed[@]}")"
          else
            tests=all
          fi
          echo "tests=${tests}" >> "${GITHUB_OUTPUT}"
          echo "pytest: ${tests}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Run ci/checks
        run: bash ci/run-checks

      - name: ruff and pyright
        run: bash ci/lint

      - name: pytest
        if: steps.select.outputs.tests != 'none'
        env:
          TESTS: ${{ steps.select.outputs.tests }}
        run: |
          if [[ "${TESTS}" == all ]]; then
            .venv/bin/pytest -ra
          else
            # shellcheck disable=SC2086
            .venv/bin/pytest -ra ${TESTS}
          fi

      # The Action an apps repository runs at a core tag, here at this commit over the fixture apps.
      - name: app-check Action over the fixture apps repository
        uses: ./.github/actions/app-check
        with:
          path: ci/tests/fixtures/app-hosting/jarvis-apps
          exclude: ""
