name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned CLIs
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.local/bin
          key: jarvis-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/install-deps') }}

      - name: Install pinned CLIs and Python test deps
        run: make deps

      - name: Run tools/checks
        env:
          OWNER_NAME: ${{ vars.OWNER_NAME }}
        run: bash tools/run-checks

      - name: pytest
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          .venv/bin/pytest -ra

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - fast
    if: ${{ always() }}
    steps:
      - name: Require fast
        run: |
          set -euo pipefail
          echo "fast: ${{ needs.fast.result }}"
          if [[ "${{ needs.fast.result }}" != "success" ]]; then
            exit 1
          fi
