name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned CLIs
        run: make deps

      - name: Install Python test deps
        run: pip install -r requirements-dev.txt

      - name: Run tools/checks
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          shopt -s nullglob
          checks=(tools/checks/*)
          if ((${#checks[@]} == 0)); then
            echo "no checks in tools/checks/" >&2
            exit 1
          fi
          ran=0
          for check in "${checks[@]}"; do
            name="$(basename "$check")"
            if [[ ! -f "$check" || ! -x "$check" ]]; then
              echo "skip non-executable: $check" >&2
              continue
            fi
            ran=$((ran + 1))
            echo "::group::$name"
            "$check"
            echo "::endgroup::"
          done
          if ((ran == 0)); then
            echo "no executable checks in tools/checks/" >&2
            exit 1
          fi

      - name: pytest
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          pytest tools/tests/
