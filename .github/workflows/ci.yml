name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned CLIs
        run: make deps

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python test deps
        run: pip install -r requirements-dev.txt

      - name: Validate renovate.json
        run: renovate-config-validator renovate.json

      - name: Run tools/checks
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          expected_checks=(
            cli-deny
            contract-md
            core-names
            env-schema
            pvc-backup
            secret-scan
          )
          shopt -s nullglob
          found_checks=()
          for check in tools/checks/*; do
            name="$(basename "$check")"
            if [[ ! -f "$check" ]]; then
              echo "missing check file: $check" >&2
              exit 1
            fi
            if [[ ! -x "$check" ]]; then
              echo "check must be executable: $check" >&2
              exit 1
            fi
            found_checks+=("$name")
          done
          missing=()
          for name in "${expected_checks[@]}"; do
            if [[ " ${found_checks[*]} " != *" ${name} "* ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "missing expected checks: ${missing[*]}" >&2
            exit 1
          fi
          extra=()
          for name in "${found_checks[@]}"; do
            if [[ " ${expected_checks[*]} " != *" ${name} "* ]]; then
              extra+=("$name")
            fi
          done
          if ((${#extra[@]} > 0)); then
            echo "unexpected checks in tools/checks/: ${extra[*]}" >&2
            exit 1
          fi
          for name in "${expected_checks[@]}"; do
            check="tools/checks/${name}"
            echo "::group::$name"
            "$check"
            echo "::endgroup::"
          done

      - name: pytest
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          pytest tools/tests/
