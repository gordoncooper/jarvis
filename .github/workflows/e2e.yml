name: e2e

# A real cluster from this commit: k3d (k3s in Docker), the env's FluxInstance and sync.yaml
# applied by the flux-operator role, every Kustomization and HelmRelease Ready, the sample hosted
# apps running at their pinned tags from the apps repository, an app kept off core's door and
# core's backups, one app's lost volume restored, then jarvis verify --smoke, one alert delivered,
# and jarvis drill.
# The env is a throwaway one written by jarvis init's code (ci/e2e/make-env), whose root source is
# a temporary branch of this repository; its core source is that branch too, or on a release tag
# push the tag itself. The job deletes the branch.
on:
  push:
    tags:
      - "v*"
  # Every pull request gets an e2e result, so the check can be required: one that touches none of
  # the paths the changes job lists reports e2e as skipped, which branch protection counts as passing.
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Does this change reach the cluster?
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          run=true
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            pattern='^(core/|addons/|envs/|infra/ansible/roles/(flux-operator|backups)/|jarvis/|schema/|ci/e2e/|\.github/workflows/e2e\.yml$|mise(\.dev)?\.(toml|lock)$|uv\.lock$|pyproject\.toml$)'
            grep -Eq "${pattern}" <<<"${changed}" || run=false
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "e2e runs: ${run}" | tee -a "${GITHUB_STEP_SUMMARY}"

  cluster:
    needs: changes
    # Only a change that reaches the cluster. A fork cannot push the temporary branch.
    if: >-
      needs.changes.outputs.run == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: cluster (app-dns ${{ matrix.app_dns }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Core with App DNS and without it: off, verify reaches Traefik's address directly.
    strategy:
      fail-fast: false
      matrix:
        app_dns: ["on", "off"]
    env:
      E2E_ENV: e2e
      # The sample apps (ci/tests/sample.py), at the tags the env's values/apps.yaml pins.
      APPS_URL: https://github.com/${{ github.repository_owner }}/jarvis-apps
      E2E_BRANCH: e2e/${{ github.run_id }}-${{ github.run_attempt }}-app-dns-${{ matrix.app_dns }}
      KUBECONFIG: /home/runner/.kube/jarvis-e2e.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned CLIs (mise.lock), k3d included
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: --locked
          # mise.dev.toml's tools too (k3d), for this step and every later one (MISE_ENV).
          mise_env: dev
          # The tools' own directories on PATH, not shims, which resolve per directory.
          add_shims_to_path: false

      - name: Python packages (uv.lock), and the pinned CLIs on PATH
        run: |
          mise bin-paths >> "${GITHUB_PATH}"
          mise exec -- uv sync --frozen

      # What the jarvis CLI gives an instance (jarvis/apps/checkout.py): the default branch with every tag.
      - name: Check out the apps repository with its tags
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "${APPS_URL}" "${RUNNER_TEMP}/apps"
          git -C "${RUNNER_TEMP}/apps" fetch -q --tags
          echo "APPS_REPO=${RUNNER_TEMP}/apps" >> "${GITHUB_ENV}"

      - name: Make the throwaway env and push its branch
        env:
          APP_DNS_FLAG: ${{ matrix.app_dns == 'on' && '--app-dns' || '' }}
        run: |
          set -euo pipefail
          age-keygen -o "${RUNNER_TEMP}/age.key" 2>/dev/null
          chmod 600 "${RUNNER_TEMP}/age.key"
          # Core at the commit under test, on its own temporary branch; a release tag push reads the tag.
          core_ref="refs/heads/${E2E_BRANCH}-core"
          [[ "${GITHUB_REF}" == refs/tags/v* ]] && core_ref="${GITHUB_REF}"
          echo "core source: ${core_ref}" | tee -a "${GITHUB_STEP_SUMMARY}"
          .venv/bin/python ci/e2e/make-env --env "${E2E_ENV}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --ref "refs/heads/${E2E_BRANCH}" --core-ref "${core_ref}" \
            --apps-url "${APPS_URL}" --key-file "${RUNNER_TEMP}/age.key" \
            --node "k3d-${E2E_ENV}-server-0" ${APP_DNS_FLAG}
          .venv/bin/jarvis --env "${E2E_ENV}" render
          git config user.name "e2e"
          git config user.email "e2e@users.noreply.github.com"
          [[ "${core_ref}" == refs/heads/* ]] && git push -q origin "HEAD:${core_ref}"
          # The root source holds only the env, as an instance repository does: core/ and addons/
          # come from the core source by include, so the root must not carry its own.
          git checkout -q --orphan "${E2E_BRANCH}"
          git rm -rq --cached .
          git add -f envs/"${E2E_ENV}" .sops.yaml
          git commit -q -m "e2e env for run ${GITHUB_RUN_ID}"
          git push -q origin "${E2E_BRANCH}"

      - name: Create the k3d cluster at the env's k3s version
        run: |
          set -euo pipefail
          vars="envs/${E2E_ENV}/values/cluster-vars.yaml"
          read_var() { sed -n "s/^$1:[[:space:]]*//p" "${vars}" | tr -d "\"'"; }
          # The env's k3s release: core's unless its cluster-vars overrides it.
          image="rancher/k3s:$(.venv/bin/python -m jarvis.env.k3s "${vars}" | tr '+' '-')"
          mkdir -p "$(dirname "${KUBECONFIG}")"
          k3d cluster create "${E2E_ENV}" --image "${image}" --wait --timeout 300s \
            --k3s-arg "--cluster-cidr=$(read_var pod_cidr)@server:0" \
            --k3s-arg "--service-cidr=$(read_var service_cidr)@server:0" \
            --k3s-arg "--cluster-init@server:0" \
            --k3s-arg "--etcd-snapshot-dir=$(read_var backup_path)/etcd-snapshots@server:0" \
            --kubeconfig-update-default=false --kubeconfig-switch-context=false
          k3d kubeconfig get "${E2E_ENV}" > "${KUBECONFIG}"
          chmod 600 "${KUBECONFIG}"
          node="k3d-${E2E_ENV}-server-0"
          # What site.yml's label play sets from the inventory's node_roles, and ServiceLB on the edge host.
          kubectl label node "${node}" node-role.jarvis.io/control_plane=true node-role.jarvis.io/backup=true \
            node-role.jarvis.io/edge=true svccontroller.k3s.cattle.io/enablelb=true --overwrite
          # The LAN's DNS stand-in: the canary host at the node, where ServiceLB serves Traefik.
          address="$(kubectl get node "${node}" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')"
          echo "${address} testapp.$(read_var dns_suffix) hello-web.apps.$(read_var dns_suffix) notes.apps.$(read_var dns_suffix)" | sudo tee -a /etc/hosts

      - name: Bootstrap Flux with the flux-operator role
        working-directory: infra/ansible
        run: |
          set -euo pipefail
          SOPS_AGE_KEY_FILE="${RUNNER_TEMP}/age.key" ../../.venv/bin/ansible-playbook ../../ci/e2e/flux.yml \
            -i ../../ci/e2e/hosts.yml \
            -e @"${GITHUB_WORKSPACE}/envs/${E2E_ENV}/values/cluster-vars.yaml" \
            -e jarvis_instance_root="${GITHUB_WORKSPACE}" \
            -e jarvis_env_dir="${GITHUB_WORKSPACE}/envs/${E2E_ENV}" \
            -e flux_instance_file="${GITHUB_WORKSPACE}/core/flux/flux-instance.yaml" \
            -e flux_sync_file="${GITHUB_WORKSPACE}/envs/${E2E_ENV}/flux/sync.yaml" \
            -e k3s_kubeconfig_path="${KUBECONFIG}" \
            -e helm_binary_path="${RUNNER_TEMP}/helm" \
            -e helm_binary_owner="$(id -un)" -e helm_binary_group="$(id -gn)"

      - name: Wait for every Kustomization and HelmRelease
        run: |
          set -euo pipefail
          # The root source first: a source that cannot build its artifact fails here in minutes.
          kubectl -n flux-system wait --for=condition=Ready gitrepository/core gitrepository/flux-system --timeout=5m
          kubectl -n flux-system wait --for=condition=Ready kustomization/flux-system --timeout=10m
          # The root applies the layer Kustomizations, which apply the HelmReleases: wait for each to exist first.
          layers="flux-system platform-controllers platform-configs services"
          for name in ${layers}; do
            for attempt in $(seq 1 90); do
              kubectl -n flux-system get kustomization "${name}" >/dev/null 2>&1 && break
              sleep 10
            done
          done
          for name in ${layers}; do
            kubectl -n flux-system wait --for=condition=Ready "kustomization/${name}" --timeout=20m
          done
          # Every Kustomization (add-on and app wiring included) and every HelmRelease, once the layers are up.
          kubectl wait --for=condition=Ready kustomizations.kustomize.toolkit.fluxcd.io --all -A --timeout=10m
          kubectl wait --for=condition=Ready helmreleases.helm.toolkit.fluxcd.io --all -A --timeout=10m

      - name: Each app runs at its pinned tag
        run: |
          set -euo pipefail
          env_dir="envs/${E2E_ENV}"
          # Each pin, and how the env's render runs the app: its deploy/ Kustomization, or its chart's HelmRelease.
          pins="$(.venv/bin/python -c '
          import sys, yaml
          charts = {d["metadata"]["name"] for d in yaml.safe_load_all(open(sys.argv[2])) if d and d["kind"] == "HelmRelease"}
          for app, entry in yaml.safe_load(open(sys.argv[1])).items():
              print(app, entry["version"], "helmrelease" if f"app-{app}" in charts else "kustomization")
          ' "${env_dir}/values/apps.yaml" "${env_dir}/flux/generated/apps.yaml")"
          [[ -n "${pins}" ]] || { echo "no app pins"; exit 1; }
          while read -r app version kind; do
            # The env's wiring makes the app file's Kustomization, then the app's own; wait for each to exist, then apply.
            for object in "kustomization/app-${app}-file" "${kind}/app-${app}"; do
              for attempt in $(seq 1 60); do
                kubectl -n flux-system get "${object}" >/dev/null 2>&1 && break
                sleep 10
              done
              kubectl -n flux-system wait --for=condition=Ready "${object}" --timeout=10m
            done
            # A chart app's only source in the apps repository is its app file.
            sources="app-${app}-file"
            [[ "${kind}" == kustomization ]] && sources="app-${app} ${sources}"
            for source in ${sources}; do
              revision="$(kubectl -n flux-system get gitrepository "${source}" -o jsonpath='{.status.artifact.revision}')"
              echo "${source}: ${revision}"
              [[ "${revision}" == "refs/tags/${app}/${version}@sha1:"* ]] || { echo "${source} is not at ${app}/${version}"; exit 1; }
            done
            kubectl -n "app-${app}" wait --for=condition=Available deployment --all --timeout=10m
          done <<<"${pins}"
          # hello-web through Traefik, on the cluster CA's certificate; then the app-to-app rules:
          # notes is granted both ways, lan-demo is not (the default-deny egress drops it: 502 or 504).
          host="hello-web.apps.$(sed -n 's/^dns_suffix:[[:space:]]*//p' "${env_dir}/values/cluster-vars.yaml")"
          code() { curl -sS --cacert "${env_dir}/ca.crt" -o /dev/null -w '%{http_code}' --max-time 20 "https://${host}$1" || true; }
          for attempt in $(seq 1 30); do
            [[ "$(code /)" == 200 ]] && break
            sleep 10
          done
          root="$(code /)"; notes="$(code /notes/)"; blocked="$(code /blocked/)"
          echo "${host}: / ${root}, /notes/ ${notes}, /blocked/ ${blocked}" | tee -a "${GITHUB_STEP_SUMMARY}"
          [[ "${root}" == 200 && "${notes}" == 200 && "${blocked}" =~ ^50[24]$ ]]

      # The core door admits routes only from namespaces labelled with a core layer, which an app's
      # never is: one offered from an app's namespace, for a name the core listener covers, is refused.
      - name: An app's route does not attach to the core door
        run: |
          set -euo pipefail
          host="notes.apps.$(sed -n 's/^dns_suffix:[[:space:]]*//p' "envs/${E2E_ENV}/values/cluster-vars.yaml")"
          kubectl apply -f - <<EOF
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: e2e-core-door
            namespace: app-notes
          spec:
            parentRefs:
              - {name: jarvis, namespace: platform-gateway, sectionName: core}
            hostnames: ["${host}"]
          EOF
          accepted() {
            kubectl -n app-notes get httproute e2e-core-door -o json \
              | jq -r '.status.parents[]? | select(.parentRef.sectionName == "core") | .conditions[]? | select(.type == "Accepted") | .status'
          }
          for attempt in $(seq 1 30); do
            [[ -n "$(accepted)" ]] && break
            [ "${attempt}" -lt 30 ] || { kubectl -n app-notes get httproute e2e-core-door -o yaml || true; exit 1; }
            sleep 5
          done
          [[ "$(accepted)" == False ]] || { echo "::error::the core door accepted a route from app-notes"; exit 1; }
          kubectl -n app-notes delete httproute e2e-core-door
          echo "core door: a route from app-notes is not accepted" | tee -a "${GITHUB_STEP_SUMMARY}"

      # A granted LAN port by its app's name: App DNS answers lan-demo.apps.<dns suffix> with its
      # LoadBalancer's address. With App DNS off the LAN's DNS names it; here the address stands in.
      - name: lan-demo's LAN port answers at its name
        env:
          APP_DNS: ${{ matrix.app_dns }}
        run: |
          set -euo pipefail
          host="lan-demo.apps.$(sed -n 's/^dns_suffix:[[:space:]]*//p' "envs/${E2E_ENV}/values/cluster-vars.yaml")"
          lb_address() { kubectl -n "$1" get services -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].status.loadBalancer.ingress[0].ip}'; }
          lb="$(lb_address app-lan-demo)"
          address="${lb}"
          if [[ "${APP_DNS}" == on ]]; then
            server="$(lb_address platform-app-dns)"
            for attempt in $(seq 1 30); do
              address="$(dig +short "@${server}" "${host}" A | head -1)"
              [[ -n "${address}" ]] && break
              sleep 5
            done
            [[ "${address}" == "${lb}" ]] || { echo "::error::App DNS answered ${host} with '${address}', not ${lb}"; exit 1; }
          fi
          # The LoadBalancer can refuse for a moment after k3s gives it its address: retry, within the
          # same bound as the dig loop.
          for attempt in $(seq 1 30); do
            curl -sS -f -o /dev/null --max-time 20 --resolve "${host}:8080:${address}" "http://${host}:8080/health" && break
            [ "${attempt}" -lt 30 ] || exit 1
            sleep 5
          done
          echo "${host}:8080 answers at ${address}" | tee -a "${GITHUB_STEP_SUMMARY}"

      # A hosted app's backup and restore, with its own credential on the apps rest-server: a file
      # written to notes reaches a fresh backup. jarvis restore puts it back twice: once deleted
      # while notes runs, which restore quiesces and brings back, and once with its volume lost.
      - name: A hosted app's volume backs up and restores
        run: |
          set -euo pipefail
          env_dir="envs/${E2E_ENV}"
          url="https://notes.apps.$(sed -n 's/^dns_suffix:[[:space:]]*//p' "${env_dir}/values/cluster-vars.yaml")/e2e-restore.txt"
          get() { curl -sS --cacert "${env_dir}/ca.crt" --max-time 20 "$@"; }
          marker="run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 30); do
            printf '%s' "${marker}" | get -f -T - "${url}" && break
            [ "${attempt}" -lt 30 ] || exit 1
            sleep 10
          done
          # A new source syncs at once, as jarvis drill's does: delete it, and Kyverno makes it again.
          for attempt in $(seq 1 60); do
            kubectl -n app-notes get replicationsource data >/dev/null 2>&1 && break
            [ "${attempt}" -lt 60 ] || { echo "::error::no ReplicationSource app-notes/data"; exit 1; }
            sleep 10
          done
          kubectl -n app-notes delete replicationsource data --wait
          for attempt in $(seq 1 60); do
            [[ -n "$(kubectl -n app-notes get replicationsource data -o jsonpath='{.status.lastSyncTime}' 2>/dev/null)" ]] && break
            [ "${attempt}" -lt 60 ] || { kubectl -n app-notes describe replicationsource data || true; exit 1; }
            sleep 10
          done
          # Core's pvc-backup enrolls only core's namespaces: the source is the app's own, on the apps server.
          core_password="$(kubectl -n platform-backups get secret backups-restic -o jsonpath='{.data.RESTIC_PASSWORD}')"
          app_password="$(kubectl -n app-notes get secret restic-data -o jsonpath='{.data.RESTIC_PASSWORD}')"
          repository="$(kubectl -n app-notes get secret restic-data -o jsonpath='{.data.RESTIC_REPOSITORY}' | base64 -d)"
          [[ -n "${app_password}" && "${app_password}" != "${core_password}" && "${repository}" == rest:http://restic-apps.* ]] \
            || { echo "::error::core's backup credential reached app-notes"; exit 1; }
          back() {
            for attempt in $(seq 1 30); do
              [[ "$(get "${url}" || true)" == "${marker}" ]] && return
              [ "${attempt}" -lt 30 ] || { echo "::error::${url} did not come back ($1)"; exit 1; }
              sleep 5
            done
          }
          # In place: restore suspends notes' wiring, scales it down, restores, and undoes both.
          get -f -X DELETE "${url}"
          [[ "$(get -o /dev/null -w '%{http_code}' "${url}")" == 404 ]]
          .venv/bin/jarvis --env "${E2E_ENV}" restore --namespace app-notes --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          kubectl -n app-notes wait --for=condition=Available deployment/notes --timeout=5m
          [[ "$(kubectl -n flux-system get kustomization app-notes -o jsonpath='{.spec.suspend}')" != true ]]
          back "deleted"
          # Lose the volume: its claim deleted and made again, unbound, with notes stopped and its
          # wiring suspended. The API server defaults what it defaulted before, so Flux's manifest
          # still owns the claim. jarvis restore binds it with a pod that admission holds to notes'
          # own PriorityClass, then restores into it.
          kubectl -n flux-system patch kustomization app-notes --type merge -p '{"spec":{"suspend":true}}'
          kubectl -n app-notes scale deployment notes --replicas=0
          kubectl -n app-notes get pvc data -o json | jq '{apiVersion, kind,
            metadata: {name: .metadata.name, namespace: .metadata.namespace, labels: (.metadata.labels // {}),
              annotations: ((.metadata.annotations // {}) | with_entries(select(.key | test("^(pv|volume)\\.(beta\\.)?kubernetes\\.io/") | not)))},
            spec: (.spec | del(.volumeName, .storageClassName, .volumeMode))}' > "${RUNNER_TEMP}/claim.json"
          kubectl -n app-notes delete pvc data --wait --timeout=5m
          kubectl create -f "${RUNNER_TEMP}/claim.json"
          .venv/bin/jarvis --env "${E2E_ENV}" restore --namespace app-notes
          kubectl -n app-notes scale deployment notes --replicas=1
          kubectl -n flux-system patch kustomization app-notes --type merge -p '{"spec":{"suspend":false}}'
          kubectl -n app-notes wait --for=condition=Available deployment/notes --timeout=5m
          back "volume lost"
          echo "notes: ${url} backed up, then restored deleted and with its volume lost" | tee -a "${GITHUB_STEP_SUMMARY}"

      # The standing checks, then each enabled capability's short-lived probe (jarvis/verify/smoke.py).
      - name: jarvis verify --smoke
        run: .venv/bin/jarvis --env "${E2E_ENV}" verify --smoke

      # The env seals testapp as its alerts target (ci/tests/sample.py, ALERTS_TARGET): a Kustomization
      # that cannot build raises an error event, and notification-controller POSTs it there.
      - name: A failed reconcile reaches the alerts target
        run: |
          set -euo pipefail
          posts() { kubectl -n platform-testapp logs deploy/testapp | grep -c '"POST /alerts-e2e ' || true; }
          # Bring-up's own transient failures may have posted already: wait for one more than that.
          before="$(posts)"
          kubectl apply -f - <<'EOF'
          apiVersion: kustomize.toolkit.fluxcd.io/v1
          kind: Kustomization
          metadata:
            name: alerts-e2e
            namespace: flux-system
          spec:
            interval: 10m
            path: ./alerts-e2e-missing
            prune: false
            serviceAccountName: flux-platform
            sourceRef:
              kind: GitRepository
              name: flux-system
          EOF
          for attempt in $(seq 1 30); do
            (( $(posts) > before )) && break
            [ "${attempt}" -lt 30 ] || { kubectl -n flux-system logs deploy/notification-controller --tail=40 || true; exit 1; }
            sleep 10
          done
          kubectl -n flux-system delete kustomization alerts-e2e

      - name: Take an etcd snapshot and copy it, as the schedules would
        run: |
          set -euo pipefail
          # k3s's own schedule is every 12 h and the copy runs after it; the drill restores the newest copy.
          backup_path="$(sed -n 's/^backup_path:[[:space:]]*//p' "envs/${E2E_ENV}/values/cluster-vars.yaml")"
          # The save subcommand does not read the server's flags; give it the same snapshot dir.
          node="k3d-${E2E_ENV}-server-0"
          # site.yml's node-disk role makes this folder on a real node.
          docker exec "${node}" mkdir -p "${backup_path}/etcd-snapshots"
          docker exec "${node}" k3s etcd-snapshot save --name e2e --etcd-snapshot-dir "${backup_path}/etcd-snapshots" \
            || { docker logs --tail 40 "${node}" 2>&1 | grep -i snapshot; exit 1; }
          docker exec "${node}" ls -l "${backup_path}/etcd-snapshots"
          # The repository is new here: a scheduled run (:15) beside this one would race its restic init
          # (core/platform/backups/CONTRACT.md, Limits). Suspend the schedule and let a started run finish.
          kubectl -n platform-backups patch cronjob etcd-snapshots --type merge -p '{"spec":{"suspend":true}}'
          for i in $(seq 1 60); do
            [ -z "$(kubectl -n platform-backups get cronjob etcd-snapshots -o jsonpath='{.status.active}')" ] && break
            [ "$i" -lt 60 ] || { echo "::error::a scheduled etcd-snapshots run is still active after 10 minutes"; exit 1; }
            sleep 10
          done
          kubectl -n platform-backups create job etcd-snapshots-e2e --from=cronjob/etcd-snapshots
          kubectl -n platform-backups wait --for=condition=complete job/etcd-snapshots-e2e --timeout=10m \
            || { kubectl -n platform-backups logs job/etcd-snapshots-e2e --all-containers --tail 50 || true; exit 1; }
          kubectl -n platform-backups patch cronjob etcd-snapshots --type merge -p '{"spec":{"suspend":false}}'

      - name: jarvis drill
        run: .venv/bin/jarvis --env "${E2E_ENV}" drill

      - name: Show Flux state
        if: failure()
        run: |
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io,gitrepositories.source.toolkit.fluxcd.io -A || true
          kubectl get pods -A || true
          kubectl get apps.hosting.jarvis.io -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          kubectl -n flux-system describe gitrepositories.source.toolkit.fluxcd.io || true
          kubectl -n flux-system logs deploy/source-controller --tail=100 || true
          kubectl -n flux-system logs deploy/kustomize-controller --tail=100 || true
          kubectl -n flux-system logs deploy/helm-controller --tail=100 || true

      - name: Delete the temporary branches
        if: always()
        run: |
          git push -q origin --delete "${E2E_BRANCH}" || true
          git push -q origin --delete "${E2E_BRANCH}-core" || true

  # The required check: green when every cluster leg passed, or when the change reaches no cluster.
  e2e:
    needs: [changes, cluster]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every cluster leg passed, or none ran
        env:
          RESULT: ${{ needs.cluster.result }}
          CHANGES: ${{ needs.changes.result }}
        run: test "${CHANGES}" = success && { test "${RESULT}" = success || test "${RESULT}" = skipped; }
