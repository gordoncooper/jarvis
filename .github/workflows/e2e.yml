name: e2e

# A real cluster from this commit: k3d (k3s in Docker), the env's FluxInstance and sync.yaml
# applied by the flux-operator role, every Kustomization and HelmRelease Ready, env-00's hosted
# apps running at their pinned tags from the apps repository, then make verify and make drill.
# The env is a throwaway copy of env-00 whose root source is a temporary branch of this
# repository; its core source is that branch too, or on a release tag push the tag itself. The
# job deletes the branch.
on:
  push:
    tags:
      - "v*"
  # Every pull request gets an e2e result, so the check can be required: one that touches none of
  # the paths the changes job lists reports e2e as skipped, which branch protection counts as passing.
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Does this change reach the cluster?
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          run=true
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            pattern='^(flux/|platform/|services/|envs/|infra/ansible/roles/flux-operator/|tools/|schema/|ci/e2e/|\.github/workflows/e2e\.yml$)'
            grep -Eq "${pattern}" <<<"${changed}" || run=false
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "e2e runs: ${run}" | tee -a "${GITHUB_STEP_SUMMARY}"

  cluster:
    needs: changes
    # Only a change that reaches the cluster. A fork cannot push the temporary branch.
    if: >-
      needs.changes.outputs.run == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: cluster (app-dns ${{ matrix.app_dns }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Core with App DNS and without it: off, verify reaches Traefik's address directly.
    strategy:
      fail-fast: false
      matrix:
        app_dns: ["on", "off"]
    env:
      E2E_ENV: e2e
      # The apps env-00 lists, at the tags its values/apps.yaml pins.
      APPS_URL: https://github.com/${{ github.repository_owner }}/jarvis-apps
      E2E_BRANCH: e2e/${{ github.run_id }}-${{ github.run_attempt }}-app-dns-${{ matrix.app_dns }}
      KUBECONFIG: /home/runner/.kube/jarvis-e2e.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore pinned CLIs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: jarvis-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/install-deps') }}

      - name: Install pinned CLIs and Python deps
        run: make deps

      - name: Install k3d
        env:
          # renovate: datasource=github-releases depName=k3d-io/k3d
          K3D_VERSION: v5.9.0
          # The k3d-linux-amd64 line of the release's checksums.txt. Bump it by hand in the version's PR.
          K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/k3d" "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  ${RUNNER_TEMP}/k3d" | sha256sum -c -
          install -m 0755 "${RUNNER_TEMP}/k3d" "${HOME}/.local/bin/k3d"

      # What ci/checkout-apps-for-instance.sh gives an instance: the default branch with every tag.
      - name: Check out the apps repository with its tags
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "${APPS_URL}" "${RUNNER_TEMP}/apps"
          git -C "${RUNNER_TEMP}/apps" fetch -q --tags
          echo "APPS_REPO=${RUNNER_TEMP}/apps" >> "${GITHUB_ENV}"

      - name: Make the throwaway env and push its branch
        env:
          APP_DNS_FLAG: ${{ matrix.app_dns == 'on' && '--app-dns' || '' }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          age-keygen -o "${RUNNER_TEMP}/age.key" 2>/dev/null
          chmod 600 "${RUNNER_TEMP}/age.key"
          # A release tag push runs Flux's core source at that tag; anything else at the branch.
          core_ref="refs/heads/${E2E_BRANCH}"
          [[ "${GITHUB_REF}" == refs/tags/v* ]] && core_ref="${GITHUB_REF}"
          echo "core source: ${core_ref}" | tee -a "${GITHUB_STEP_SUMMARY}"
          .venv/bin/python ci/e2e/make-env --env "${E2E_ENV}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --ref "refs/heads/${E2E_BRANCH}" --core-ref "${core_ref}" \
            --apps-url "${APPS_URL}" --key-file "${RUNNER_TEMP}/age.key" \
            --node "k3d-${E2E_ENV}-server-0" ${APP_DNS_FLAG}
          git config user.name "e2e"
          git config user.email "e2e@users.noreply.github.com"
          git checkout -b "${E2E_BRANCH}"
          git add -A envs/"${E2E_ENV}" .sops.yaml
          git commit -q -m "e2e env for run ${GITHUB_RUN_ID}"
          git push -q origin "${E2E_BRANCH}"

      - name: Create the k3d cluster at the env's k3s version
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          vars="envs/${E2E_ENV}/values/cluster-vars.yaml"
          read_var() { sed -n "s/^$1:[[:space:]]*//p" "${vars}" | tr -d "\"'"; }
          # The env's k3s release: core's unless its cluster-vars overrides it.
          image="rancher/k3s:$(.venv/bin/python -m jarvis.lib.k3s "${vars}" | tr '+' '-')"
          mkdir -p "$(dirname "${KUBECONFIG}")"
          k3d cluster create "${E2E_ENV}" --image "${image}" --wait --timeout 300s \
            --k3s-arg "--cluster-cidr=$(read_var pod_cidr)@server:0" \
            --k3s-arg "--service-cidr=$(read_var service_cidr)@server:0" \
            --k3s-arg "--cluster-init@server:0" \
            --k3s-arg "--etcd-snapshot-dir=$(read_var backup_path)/etcd-snapshots@server:0" \
            --kubeconfig-update-default=false --kubeconfig-switch-context=false
          k3d kubeconfig get "${E2E_ENV}" > "${KUBECONFIG}"
          chmod 600 "${KUBECONFIG}"
          node="k3d-${E2E_ENV}-server-0"
          # What site.yml's label play sets from the inventory's node_roles, and ServiceLB on the edge host.
          kubectl label node "${node}" node-role.jarvis.io/control_plane=true node-role.jarvis.io/backup=true \
            node-role.jarvis.io/edge=true svccontroller.k3s.cattle.io/enablelb=true --overwrite
          # The LAN's DNS stand-in: the canary host at the node, where ServiceLB serves Traefik.
          address="$(kubectl get node "${node}" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')"
          echo "${address} testapp.$(read_var dns_suffix) hello-web.apps.$(read_var dns_suffix)" | sudo tee -a /etc/hosts

      - name: Bootstrap Flux with the flux-operator role
        working-directory: infra/ansible
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          SOPS_AGE_KEY_FILE="${RUNNER_TEMP}/age.key" ../../.venv/bin/ansible-playbook ../../ci/e2e/flux.yml \
            -i ../../ci/e2e/hosts.yml \
            -e jarvis_env="${E2E_ENV}" \
            -e jarvis_cluster_vars="${GITHUB_WORKSPACE}/envs/${E2E_ENV}/values/cluster-vars.yaml" \
            -e jarvis_instance_root="${GITHUB_WORKSPACE}" \
            -e jarvis_env_dir="${GITHUB_WORKSPACE}/envs/${E2E_ENV}" \
            -e flux_instance_file="${GITHUB_WORKSPACE}/flux/flux-instance.yaml" \
            -e flux_sync_file="${GITHUB_WORKSPACE}/envs/${E2E_ENV}/flux/sync.yaml" \
            -e k3s_binary_path="${GITHUB_WORKSPACE}/ci/e2e/k3s" \
            -e k3s_kubeconfig_path="${KUBECONFIG}" \
            -e helm_binary_path="${HOME}/.local/bin/helm" \
            -e helm_binary_owner="$(id -un)" -e helm_binary_group="$(id -gn)"

      - name: Wait for every Kustomization and HelmRelease
        run: |
          set -euo pipefail
          # The root applies the layer Kustomizations, which apply the HelmReleases: wait for each to exist first.
          layers="flux-system platform-controllers platform-configs services"
          for name in ${layers}; do
            for attempt in $(seq 1 90); do
              kubectl -n flux-system get kustomization "${name}" >/dev/null 2>&1 && break
              sleep 10
            done
          done
          for name in ${layers}; do
            kubectl -n flux-system wait --for=condition=Ready "kustomization/${name}" --timeout=20m
          done
          # Every Kustomization (add-on and app wiring included) and every HelmRelease, once the layers are up.
          kubectl wait --for=condition=Ready kustomizations.kustomize.toolkit.fluxcd.io --all -A --timeout=10m
          kubectl wait --for=condition=Ready helmreleases.helm.toolkit.fluxcd.io --all -A --timeout=10m

      - name: Each app runs at its pinned tag
        run: |
          set -euo pipefail
          env_dir="envs/${E2E_ENV}"
          pins="$(.venv/bin/python -c 'import sys, yaml; [print(a, v) for a, v in yaml.safe_load(open(sys.argv[1]))["versions"].items()]' "${env_dir}/values/apps.yaml")"
          [[ -n "${pins}" ]] || { echo "no app pins"; exit 1; }
          while read -r app version; do
            # The env's wiring makes the app's Kustomizations; wait for them to exist, then apply.
            for name in "app-${app}-file" "app-${app}"; do
              for attempt in $(seq 1 60); do
                kubectl -n flux-system get kustomization "${name}" >/dev/null 2>&1 && break
                sleep 10
              done
              kubectl -n flux-system wait --for=condition=Ready "kustomization/${name}" --timeout=10m
            done
            for source in "app-${app}" "app-${app}-file"; do
              revision="$(kubectl -n flux-system get gitrepository "${source}" -o jsonpath='{.status.artifact.revision}')"
              echo "${source}: ${revision}"
              [[ "${revision}" == "refs/tags/${app}/${version}@sha1:"* ]] || { echo "${source} is not at ${app}/${version}"; exit 1; }
            done
            kubectl -n "app-${app}" wait --for=condition=Available deployment --all --timeout=10m
          done <<<"${pins}"
          # hello-web through Traefik, on the cluster CA's certificate; then the app-to-app rules:
          # notes is granted both ways, lan-demo is not (the default-deny egress drops it: 502 or 504).
          host="hello-web.apps.$(sed -n 's/^dns_suffix:[[:space:]]*//p' "${env_dir}/values/cluster-vars.yaml")"
          code() { curl -sS --cacert "${env_dir}/ca.crt" -o /dev/null -w '%{http_code}' --max-time 20 "https://${host}$1" || true; }
          for attempt in $(seq 1 30); do
            [[ "$(code /)" == 200 ]] && break
            sleep 10
          done
          root="$(code /)"; notes="$(code /notes/)"; blocked="$(code /blocked/)"
          echo "${host}: / ${root}, /notes/ ${notes}, /blocked/ ${blocked}" | tee -a "${GITHUB_STEP_SUMMARY}"
          [[ "${root}" == 200 && "${notes}" == 200 && "${blocked}" =~ ^50[24]$ ]]

      - name: make verify
        run: make verify ENV="${E2E_ENV}" ALLOW_UNPINNED=1

      - name: Take an etcd snapshot and copy it, as the schedules would
        run: |
          set -euo pipefail
          # k3s's own schedule is every 12 h and the copy runs after it; the drill restores the newest copy.
          backup_path="$(sed -n 's/^backup_path:[[:space:]]*//p' "envs/${E2E_ENV}/values/cluster-vars.yaml")"
          # The save subcommand does not read the server's flags; give it the same snapshot dir.
          node="k3d-${E2E_ENV}-server-0"
          # site.yml's node-disk role makes this folder on a real node.
          docker exec "${node}" mkdir -p "${backup_path}/etcd-snapshots"
          docker exec "${node}" k3s etcd-snapshot save --name e2e --etcd-snapshot-dir "${backup_path}/etcd-snapshots" \
            || { docker logs --tail 40 "${node}" 2>&1 | grep -i snapshot; exit 1; }
          docker exec "${node}" ls -l "${backup_path}/etcd-snapshots"
          kubectl -n platform-backups create job etcd-snapshots-e2e --from=cronjob/etcd-snapshots
          kubectl -n platform-backups wait --for=condition=complete job/etcd-snapshots-e2e --timeout=10m

      - name: make drill
        run: make drill ENV="${E2E_ENV}" ALLOW_UNPINNED=1

      - name: Show Flux state
        if: failure()
        run: |
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io,gitrepositories.source.toolkit.fluxcd.io -A || true
          kubectl get pods -A || true
          kubectl get apps.hosting.jarvis.io -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          kubectl -n flux-system logs deploy/kustomize-controller --tail=100 || true
          kubectl -n flux-system logs deploy/helm-controller --tail=100 || true

      - name: Delete the temporary branch
        if: always()
        run: git push -q origin --delete "${E2E_BRANCH}" || true

  # The required check: green when every cluster leg passed, or when the change reaches no cluster.
  e2e:
    needs: [changes, cluster]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every cluster leg passed, or none ran
        env:
          RESULT: ${{ needs.cluster.result }}
          CHANGES: ${{ needs.changes.result }}
        run: test "${CHANGES}" = success && { test "${RESULT}" = success || test "${RESULT}" = skipped; }
