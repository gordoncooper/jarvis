name: app-check
description: >-
  Check every app folder of a Jarvis apps repository against the app rules of the core
  release this Action is used at (core/feature/app-hosting/CONTRACT.md).
inputs:
  path:
    description: The apps repository checkout.
    default: .
  exclude:
    description: Top-level folders that are not apps (the repository's own tooling), space-separated.
    default: ci
runs:
  using: composite
  steps:
    - name: Install mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.11.5
        install: false
    # kustomize and the jarvis package's Python dependencies at this core's pins (mise.lock, uv.lock).
    - name: Install kustomize and the jarvis package at the core pins
      shell: bash
      env:
        CORE: ${{ github.action_path }}/../../..
        # Its own venv, so the Action never changes the caller's .venv (core's CI runs it too).
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/app-check-venv
      run: |
        set -euo pipefail
        mise trust --quiet "${CORE}/mise.toml"
        mise -C "${CORE}" install --locked kustomize uv
        mise -C "${CORE}" exec -- uv sync --frozen --no-dev --project "${CORE}"
    - name: app-check
      shell: bash
      env:
        CORE: ${{ github.action_path }}/../../..
        APPS: ${{ inputs.path }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        args=()
        for name in ${EXCLUDE}; do args+=(--exclude "${name}"); done
        mise -C "${CORE}" exec -- "${RUNNER_TEMP}/app-check-venv/bin/python" "${CORE}/tools/app-check" --repo "$(realpath "${APPS}")" "${args[@]}"
