# The app file. Every hosted app folder holds one App, <name>/app.yaml, and the cluster reads
# it as this object in namespace app-<name>. The API server refuses an App that breaks this
# schema; jarvis/apps/check.py also refuses unknown keys, which the API server prunes unread.
# Prune stays off: removing the CRD would delete every App, and with them every app's admission params.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.hosting.jarvis.io
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  group: hosting.jarvis.io
  names:
    kind: App
    listKind: AppList
    plural: apps
    singular: app
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [volumes]
              properties:
                network:
                  description: >-
                    What reaches the app and what it reaches. Absent or empty: no web address,
                    no LAN port, no egress beyond DNS, no caller.
                  type: object
                  properties:
                    web:
                      description: >-
                        Web addresses, each an HTTPRoute core makes on the apps door, TLS from
                        core: https://<name>.apps.<dns suffix> for the entry with no name, and
                        https://<name>-<entry>.apps.<dns suffix> for a named one. Absent or
                        empty: no web address.
                      type: array
                      maxItems: 8
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [service, port]
                        properties:
                          name:
                            description: Empty for the app's own address; otherwise a DNS label added to it.
                            type: string
                            default: ""
                            maxLength: 61
                            pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                          service:
                            description: The Service in the app's namespace the route sends to.
                            type: string
                            maxLength: 63
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                          port:
                            description: That Service's port, plain HTTP.
                            type: integer
                            minimum: 1
                            maximum: 65535
                          hostnames:
                            description: >-
                              Custom hostnames the entry also answers on, outside the env's zone.
                              Each needs the env's grant hostname <name>.
                            type: array
                            maxItems: 8
                            x-kubernetes-list-type: set
                            items:
                              type: string
                              maxLength: 253
                              pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?\\.)+[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                          ownRoute:
                            description: >-
                              The app ships this entry's HTTPRoute itself, for routing one service
                              and port cannot express; core makes none for that service and port.
                            type: boolean
                    ports:
                      description: >-
                        LAN ports, each a LoadBalancer port listen forwarding to container
                        port target. Each needs the env's lan-port <listen>/<protocol> line.
                      type: array
                      maxItems: 16
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [listen, protocol]
                      items:
                        type: object
                        required: [listen, target, protocol]
                        properties:
                          listen:
                            type: integer
                            minimum: 1
                            maximum: 65535
                          target:
                            type: integer
                            minimum: 1
                            maximum: 65535
                          protocol:
                            type: string
                            enum: [TCP, UDP]
                    egress:
                      description: What the app reaches beyond cluster DNS. Default nothing.
                      type: object
                      properties:
                        internet:
                          description: >-
                            Any port and protocol to the internet, never the LAN or the cluster.
                            Default false.
                          type: boolean
                        lan:
                          description: >-
                            LAN targets by name, each needing the env's lan-target lines, or
                            exactly [all] for the whole LAN, needing the env's lan-all.
                          type: array
                          maxItems: 32
                          x-kubernetes-list-type: set
                          x-kubernetes-validations:
                            - rule: "!('all' in self) || self.size() == 1"
                              message: lan is [all] or a list of target names
                          items:
                            type: string
                            maxLength: 63
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        apps: &app-names
                          description: >-
                            Other apps, by name. Traffic flows only when the caller lists the
                            callee under egress.apps and the callee lists the caller under callers.
                          type: array
                          maxItems: 32
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            maxLength: 59
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    callers: *app-names
                volumes:
                  description: Every PVC the app keeps, each backed up or not.
                  type: array
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, backup]
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                      backup:
                        type: boolean
                resources:
                  description: The namespace's total limits. Default 500m CPU and 512Mi memory.
                  type: object
                  properties:
                    cpu:
                      type: string
                      pattern: "^[0-9]+(\\.[0-9]+)?m?$"
                    memory:
                      type: string
                      pattern: "^[0-9]+(Ki|Mi|Gi)$"
                risky:
                  description: Items the app asks for. Each needs the env's matching grant.
                  type: object
                  properties:
                    privileged:
                      type: boolean
                    root:
                      type: boolean
                    hostNetwork:
                      type: boolean
                    hostPath:
                      type: boolean
                chart:
                  description: >-
                    The upstream Helm chart the app runs, in place of deploy/: core renders it
                    as the app's tenant with these values, and the env's on top. An app that
                    ships only an image runs a generic chart such as bjw-s app-template.
                  type: object
                  required: [url, version]
                  properties:
                    url:
                      description: The chart's own oci:// address.
                      type: string
                      maxLength: 512
                      pattern: "^oci://[^\\s]+$"
                    version:
                      description: The chart version, exactly.
                      type: string
                      maxLength: 128
                      pattern: "^[0-9A-Za-z][0-9A-Za-z.+_-]*$"
                    values:
                      description: The chart's values.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
