# The app file, from the app's folder in the apps repository at its pinned tag (${app_ref}:
# refs/tags/<app>/v<version>, from the env's values/apps.yaml), never a branch, applied as the
# app's tenant identity. Admission reads the App and refuses the app's objects until it exists.
# The source holds only that file, and no other app's folder.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app-${app_name}-file
  namespace: flux-system
  # A source stays when the app leaves the env's list, as every Flux source does; delete it by hand.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 5m
  url: ${apps_git_repo_url}
  ref:
    name: ${app_ref}
  ignore: |
    /*
    !/${app_name}/
    /${app_name}/*
    !/${app_name}/app.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-${app_name}-file
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./${app_name}
  prune: true
  serviceAccountName: app-${app_name}
  targetNamespace: app-${app_name}
  sourceRef:
    kind: GitRepository
    name: app-${app_name}-file
