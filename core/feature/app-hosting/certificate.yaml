# Hosted apps: one wildcard one level down, <name>.apps.${dns_suffix}, so no app has its own
# certificate. A separate Certificate, so adding it leaves core's wildcard and its key alone.
# The apps listener (kustomization.yaml) serves it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apps
  namespace: platform-gateway
spec:
  secretName: wildcard-apps-tls
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  dnsNames:
    - "*.apps.${dns_suffix}"
