# App hosting, optional and off by default. An env turns it on with one name in
# envs/<env>/values/switches.yaml:
#
#   features:
#     - app-hosting
#
# and off by removing it (with its app list). It is a Component, not a directory under
# resources, because it adds to an object platform-configs already has: the apps door, two
# listeners on core's Gateway. Without the name, the env renders none of this.
# The per-app wiring (app/) is applied by each app's own wiring Kustomization, not here.
# backups/ is hosted apps' backups: the apps rest-server and the policies that enroll app volumes.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - crd/app-crd.yaml
  - kyverno-rbac.yaml
  - policies/admission.yaml
  - policies/derive.yaml
  - backups
  - priority.yaml
  - lan-name.yaml
  - grant-revoke.yaml
  - certificate.yaml
patches:
  # A hosted app's repositories open only with that app's own password, which its registration
  # mounts in restic-check (jarvis/apps/backups.py); core's never reaches them.
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata: {name: restic-check, namespace: platform-backups}
      spec: {jobTemplate: {spec: {template: {spec: {containers: [
        {name: restic, env: [{name: OWN_PASSWORD_REPOSITORIES, value: "ns-app-*/*"}]}]}}}}}
  # The apps door: HTTPS for <name>.apps.${dns_suffix}, and apps-granted for a custom hostname
  # the env grants (outside dns_suffix, so no core name falls to it), from app namespaces only.
  # Its own listeners, so moving it to its own address later is a listener move, not a reroute.
  - target:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: jarvis
      namespace: platform-gateway
    patch: |-
      - op: add
        path: /spec/listeners/-
        value:
          name: apps
          protocol: HTTPS
          port: 8443
          hostname: "*.apps.${dns_suffix}"
          tls:
            mode: Terminate
            certificateRefs:
              - name: wildcard-apps-tls
          allowedRoutes:
            kinds:
              - kind: HTTPRoute
            namespaces:
              from: Selector
              selector:
                matchExpressions:
                  - key: hosting.jarvis.io/app
                    operator: Exists
      - op: add
        path: /spec/listeners/-
        value:
          name: apps-granted
          protocol: HTTPS
          port: 8443
          tls:
            mode: Terminate
            certificateRefs:
              - name: wildcard-apps-tls
          allowedRoutes:
            kinds:
              - kind: HTTPRoute
            namespaces:
              from: Selector
              selector:
                matchExpressions:
                  - key: hosting.jarvis.io/app
                    operator: Exists
