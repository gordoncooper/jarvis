# Chart 4.0.1 (app 1.9.2). image.tag is that appVersion pinned by digest.
# k8s_gateway answers each HTTPRoute hostname with its Gateway's status.addresses, which
# Traefik copies from its LoadBalancer Service, where k3s ServiceLB writes the edge node
# addresses. Preference ip selects an address over a hostname.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: flux-system
  # Prune stays off so a path move cannot uninstall the resolver.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  releaseName: k8s-gateway
  serviceAccountName: flux-platform
  targetNamespace: platform-app-dns
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: codeberg.org/k8s-gateway/k8s_gateway
      tag: "1.10.0@sha256:007636228aa5659e224f79b81e0ce6ddc64eab03c082adbb74e95361288fb7d3"
    serviceType: LoadBalancer
    service:
      clusterIP: ${app_dns_cluster_ip}
    # Chart default. A hostname in a load balancer status is resolved from
    # this pod, and cluster DNS forwards the zone here.
    deployment:
      dnsPolicy: Default
    # The chart default sets a CPU limit. null drops that key.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: null
        memory: 256Mi
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    servers:
      - port: 53
        zones:
          - zone: ${dns_suffix}
            use_tcp: true
        plugins:
          - name: errors
          - name: health
          - name: ready
          - name: k8s_gateway
            parameters: ${dns_suffix}
            configBlock: |-
              resources HTTPRoute
              loadBalancerAddressPreference ip
              ttl 30
          - name: cache
            parameters: "30"
          - name: loadbalance
