# rest-server 0.14.0, the same pin as rest-server.yaml. Renovate updates both (renovate.json).
# Serves hosted apps' repositories only. --private-repos confines user ns-app-<name> to
# ns-app-<name>/..., so an app login cannot open a core repository or another app's.
# Its users are only the app credentials the env registers (core/platform/backups/CONTRACT.md,
# App credentials); core's backups-restic is never mounted here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic-apps
  namespace: platform-backups
  labels:
    app.kubernetes.io/name: restic-apps
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: restic-apps
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restic-apps
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.jarvis.io/backup
                    operator: In
                    values: ["true"]
      tolerations:
        - key: node-role.jarvis.io/dedicated
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: rest-server
          # renovate: datasource=docker depName=restic/rest-server
          image: restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
          imagePullPolicy: IfNotPresent
          # Each registered app mounts its htpasswd line at /credentials/<namespace>/htpasswd.
          # The user name is built from that folder name, never read from the line, so a
          # credential can only ever be ns-<its own namespace>. A registration change edits
          # this pod template, so the Deployment restarts with the new list.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077
              list=/run/auth/htpasswd
              : > "$list.new"
              for file in /credentials/app-*/htpasswd; do
                [ -f "$file" ] || continue
                app=$(basename "$(dirname "$file")")
                case "$app" in
                  *[!a-z0-9-]*) echo "skipped a credential folder that is not a namespace name"; continue ;;
                esac
                hash=$(head -n 1 "$file" | cut -d: -f2-)
                printf 'ns-%s:%s\n' "$app" "$hash" >> "$list.new"
              done
              mv "$list.new" "$list"
              echo "app users: $(wc -l < "$list")"
              exec rest-server --path /data --htpasswd-file "$list" --private-repos --listen :8000
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          # hostPath ignores fsGroup. Non-root waits until the disk honors it.
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: auth
              mountPath: /run/auth
      volumes:
        - name: data
          hostPath:
            path: "${backup_path}/restic"
            type: DirectoryOrCreate
        - name: auth
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: restic-apps
  namespace: platform-backups
  labels:
    app.kubernetes.io/name: restic-apps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: restic-apps
  ports:
    - name: http
      port: 8000
      targetPort: http
