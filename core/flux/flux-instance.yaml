# Ansible (flux-operator role) applies this file once on a new cluster; Flux reconciles it from Git after that.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  # The root Kustomization owns this object; a bad commit that drops it must not remove Flux.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    # renovate: datasource=github-releases depName=fluxcd/flux2 versioning=semver
    version: "2.10.0"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: medium
    multitenant: true
    networkPolicy: true
    domain: cluster.local
  # No sync: sync.yaml declares the sources and the root Kustomization.
  kustomize:
    patches:
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=StrictPostBuildSubstitutions=true
        target:
          kind: Deployment
          name: kustomize-controller
