# Fixed body for GET /. platform-configs postBuild fills ${dns_suffix} on the route's hostname.
apiVersion: v1
kind: ConfigMap
metadata:
  name: testapp
  namespace: platform-testapp
data:
  index.html: |
    testapp
---
# nginxinc/nginx-unprivileged 1.31.7 alpine-slim. uid 101, listen 8080.
# Official library/nginx runs as root; this image is the non-root build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testapp
  namespace: platform-testapp
  labels:
    app.kubernetes.io/name: testapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testapp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: testapp
          image: nginxinc/nginx-unprivileged:1.31.7-alpine-slim@sha256:a8cb0f33d51fa107c96fd2bd3a71aaf564ec131e9d2bdf8700944f0ed8b170d7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            # nginx.conf puts the pid and the *_temp dirs under /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: html
          configMap:
            name: testapp
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: testapp
  namespace: platform-testapp
  labels:
    app.kubernetes.io/name: testapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: testapp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The core door's first user. The listener terminates TLS with the wildcard; nothing here
# holds a certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: testapp
  namespace: platform-testapp
  labels:
    app.kubernetes.io/name: testapp
spec:
  parentRefs:
    - name: jarvis
      namespace: platform-gateway
      sectionName: core
  hostnames:
    - testapp.${dns_suffix}
  rules:
    - backendRefs:
        - name: testapp
          port: 8080
