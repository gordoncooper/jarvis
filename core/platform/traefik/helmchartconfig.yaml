# k3s ships the Traefik HelmChart. This is the only Git object in kube-system.
# Chart v40 reads the Service type from service.spec.type.
# Routes are Gateway API only: k3s's traefik-crd chart installs the Gateway API CRDs, this
# chart makes GatewayClass traefik, and core's Gateway (gateway/) holds the listeners. Without
# the Ingress and CRD providers, an Ingress or a Traefik IngressRoute routes nothing.
# The chart copies its LoadBalancer Service's address to each Gateway's status.addresses,
# which App DNS answers with.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
  # Prune stays off. Deleting this object returns Traefik to the k3s chart defaults.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  valuesContent: |-
    ingressClass:
      enabled: false
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: false
      kubernetesGateway:
        enabled: true
    gatewayClass:
      enabled: true
    gateway:
      enabled: false
    service:
      spec:
        type: LoadBalancer
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
