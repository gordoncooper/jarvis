# The core door: HTTPS for *.${dns_suffix}, from core's own namespaces: those labelled with a
# core layer. Only core's wiring creates namespaces and sets that label, so a tenant cannot
# attach here, and a namespace without it (a feature's left after it is switched off, or one
# made by hand) gets nothing. A feature adds its own door beside it from its own Component. Both doors share Traefik's websecure
# entrypoint (container port 8443, published on 443): shared-address mode.
# platform-configs postBuild fills ${dns_suffix}.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: jarvis
  namespace: platform-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: core
      protocol: HTTPS
      port: 8443
      hostname: "*.${dns_suffix}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: jarvis.io/layer
                operator: In
                values: [platform, feature]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: platform-gateway
spec:
  secretName: wildcard-tls
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  dnsNames:
    - "*.${dns_suffix}"
