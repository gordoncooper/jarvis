# Core's rules (rules.yaml) installed for admission, on platform-configs once Kyverno's CRDs are
# up. A feature that needs an exception adds it from its own Component. jarvis validate reads the
# rules as the env's build makes them, without the namespace scope, so it checks every object an
# env deploys. At admission:
# - they hold only in namespaces labelled with a core layer. Hosted apps have their own admission
#   (core/feature/app-hosting), and k3s's and Flux's namespaces carry no layer;
# - a workload rule skips an object with an owner: a controller made it from a template that was
#   admitted (a Deployment's ReplicaSet and pods, a CronJob's Jobs) or that a trusted controller
#   writes (VolSync's movers);
# - probes skips a pod that does not restart, which runs to completion as a Job's does (the
#   drill's pods).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rules.yaml
patches:
  - target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
    patch: |-
      - op: add
        path: /spec/matchConstraints/namespaceSelector
        value:
          matchExpressions:
            - key: jarvis.io/layer
              operator: In
              values: [platform, feature]
  - target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: images-pinned|resources
    patch: |-
      - op: add
        path: /spec/matchConditions
        value:
          - name: not-made-by-a-controller
            expression: size(object.metadata.?ownerReferences.orValue([])) == 0
  - target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: probes
    patch: |-
      - op: add
        path: /spec/matchConditions/-
        value:
          name: not-made-by-a-controller
          expression: size(object.metadata.?ownerReferences.orValue([])) == 0
      - op: add
        path: /spec/matchConditions/-
        value:
          name: long-running
          expression: object.kind != 'Pod' || object.spec.?restartPolicy.orValue('Always') == 'Always'
