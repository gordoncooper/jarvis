apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kyverno
  namespace: flux-system
  # The HelmRelease stays. This is the chart source it reconciles.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  # The chart layer: an artifact may carry other layers (provenance, signatures) before it.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/kyverno/charts/kyverno
  ref:
    tag: "3.9.2"
