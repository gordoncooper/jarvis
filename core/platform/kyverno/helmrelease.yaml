# Kyverno 1.19.2, chart 3.9.2. CEL policies (policies.kyverno.io) only; no ClusterPolicy.
# Reports and cleanup controllers are off. Admission and background stay on.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
  # The crds subchart templates the policy CRDs. Uninstall deletes them and every policy.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  releaseName: kyverno
  serviceAccountName: flux-platform
  targetNamespace: kyverno
  chartRef:
    kind: OCIRepository
    name: kyverno
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    features:
      admissionReports:
        enabled: false
      aggregateReports:
        enabled: false
      policyReports:
        enabled: false
      validatingAdmissionPolicyReports:
        enabled: false
      reporting:
        validate: false
        mutate: false
        mutateExisting: false
        imageVerify: false
        generate: false
    admissionController:
      container:
        image:
          registry: ghcr.io
          repository: kyverno/kyverno
          # renovate: datasource=docker depName=ghcr.io/kyverno/kyverno
          tag: "v1.19.2@sha256:c8c4dd09e720d2cd7fd24ca73ac28e46651001372f988e0cba3f2f612f04b955"
        # Chart default for the admission container.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 384Mi
      initContainer:
        image:
          registry: ghcr.io
          repository: kyverno/kyvernopre
          # renovate: datasource=docker depName=ghcr.io/kyverno/kyvernopre
          tag: "v1.19.2@sha256:27f3cc52e628559b56d08363b85316819802086c9808606914f7805a244148f4"
    # The post-upgrade hook that migrates stored policy versions.
    crds:
      migration:
        image:
          registry: ghcr.io
          repository: kyverno/kyverno-cli
          # renovate: datasource=docker depName=ghcr.io/kyverno/kyverno-cli
          tag: "v1.19.2@sha256:322ec5044d600930cb3af0e56dc33154a2d1d1fba58f4cadad3f47be7e78b11c"
    # The pre-delete hooks that remove the webhooks and scale the controllers to zero.
    webhooksCleanup:
      image:
        registry: ghcr.io
        repository: kyverno/readiness-checker
        # renovate: datasource=docker depName=ghcr.io/kyverno/readiness-checker
        tag: "v1.19.2@sha256:02600428e7c956e222f4376413525866ed9fec28e6bcb1222774ce6bf5fc904a"
    backgroundController:
      image:
        registry: ghcr.io
        repository: kyverno/background-controller
        # renovate: datasource=docker depName=ghcr.io/kyverno/background-controller
        tag: "v1.19.2@sha256:c46e124f21ef8a6bb4b48de57106808b1007edcd5ddd4ff7df5d23b9efa60ce2"
      # Chart default for the background controller.
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
