# Kyverno 1.19.2, chart 3.9.2. CEL policies (policies.kyverno.io) only; no ClusterPolicy.
# Reports and cleanup controllers are off. Admission and background stay on.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
  # The crds subchart templates the policy CRDs. Uninstall deletes them and every policy.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  releaseName: kyverno
  serviceAccountName: flux-platform
  targetNamespace: kyverno
  chartRef:
    kind: OCIRepository
    name: kyverno
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    features:
      admissionReports:
        enabled: false
      aggregateReports:
        enabled: false
      policyReports:
        enabled: false
      validatingAdmissionPolicyReports:
        enabled: false
      reporting:
        validate: false
        mutate: false
        mutateExisting: false
        imageVerify: false
        generate: false
    admissionController:
      container:
        image:
          registry: ghcr.io
          repository: kyverno/kyverno
          tag: "v1.20.0@sha256:9de49c5416ea536f00a205527197ac048abdf32c5a75d633cd9afff8928f359d"
        # Chart default for the admission container.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 384Mi
      initContainer:
        image:
          registry: ghcr.io
          repository: kyverno/kyvernopre
          tag: "v1.20.0@sha256:339067e083430e0c97007541bef9cfdbac89bee13f7228772c77ae8aead14b8b"
    # The post-upgrade hook that migrates stored policy versions.
    crds:
      migration:
        image:
          registry: ghcr.io
          repository: kyverno/kyverno-cli
          tag: "v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4"
    # The pre-delete hooks that remove the webhooks and scale the controllers to zero.
    webhooksCleanup:
      image:
        registry: ghcr.io
        repository: kyverno/readiness-checker
        tag: "v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c"
    backgroundController:
      image:
        registry: ghcr.io
        repository: kyverno/background-controller
        tag: "v1.20.0@sha256:c72df38320a48fc9de10f9d23d087a117853bb08207b7f60f6d1e8457fb3ddb7"
      # Chart default for the background controller.
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
