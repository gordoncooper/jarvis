# Chart roles aggregate these. Prune stays off so a path move cannot drop the backup permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:backup-generate
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # pvc-backup lists kube-system and platform-backups ConfigMaps for backup-rebuild-hold and
  # backup-overrides. A list cannot be narrowed by resourceNames.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["volsync.backube"]
    resources: ["replicationsources"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
