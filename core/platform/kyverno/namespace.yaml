# Prune stays off. Deleting this namespace removes the ServiceAccount the
# kyverno-scale-to-zero uninstall hook needs, and the HelmRelease stays stuck.
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    jarvis.io/layer: platform
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
