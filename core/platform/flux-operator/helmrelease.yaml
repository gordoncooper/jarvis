apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
  # Prune stays off so a path move cannot uninstall the operator.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 30m
  releaseName: flux-operator
  serviceAccountName: flux-platform
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The chart default sets a CPU limit. null drops that key.
  # Requests and the memory limit are the chart's.
  values:
    image:
      # The chart's appVersion, which moves with the chart pin in oci-repository.yaml.
      # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/flux-operator
      tag: "v0.62.1@sha256:1d09a3f96524d0895fb11e8072d84a3dd029cecdec0f869efa371be6b001469c"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: null
        memory: 1Gi
