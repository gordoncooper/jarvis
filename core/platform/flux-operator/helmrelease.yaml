apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
  # Prune stays off so a path move cannot uninstall the operator.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 30m
  releaseName: flux-operator
  serviceAccountName: flux-platform
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The chart default sets a CPU limit. null drops that key.
  # Requests and the memory limit are the chart's.
  values:
    image:
      repository: ghcr.io/controlplaneio-fluxcd/flux-operator
      # The chart's appVersion, which moves with the chart pin in oci-repository.yaml.
      tag: "v0.64.0@sha256:7f60122c5f07c51972ba86635783c5bcc6d450dea5d6f8291362efb1d81463e8"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: null
        memory: 1Gi
