apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: flux-system
  # The HelmRelease stays. This is the chart source it reconciles.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  # The chart layer: an artifact may carry other layers (provenance, signatures) before it.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager versioning=semver
    tag: "v1.21.3"
