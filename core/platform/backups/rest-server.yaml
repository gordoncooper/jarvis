# rest-server, pinned by version and digest; Renovate updates both (renovate.json).
# No --append-only: the mover forgets and prunes with these credentials.
# No --private-repos: one user, and repos are ns-<namespace>/pvc-<pvc>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic
  namespace: platform-backups
  labels:
    app.kubernetes.io/name: restic
  # Flux deletes inventory objects one by one, so a kept namespace does not keep this Deployment.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: restic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restic
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.jarvis.io/backup
                    operator: In
                    values: ["true"]
      tolerations:
        - key: node-role.jarvis.io/dedicated
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: rest-server
          image: restic/rest-server:0.15.0@sha256:5922067eb6f1ed8a632bc56101677ab4968a3b88a28806423e95ebb5eeecdebb
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIRECTORY
              value: /data
            - name: PASSWORD_FILE
              value: /auth/htpasswd
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          # hostPath ignores fsGroup. Non-root waits until the disk honors it.
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: "${backup_path}/restic"
            type: DirectoryOrCreate
        - name: auth
          secret:
            secretName: backups-restic
            items:
              - key: htpasswd
                path: htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: restic
  namespace: platform-backups
  labels:
    app.kubernetes.io/name: restic
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: restic
  ports:
    - name: http
      port: 8000
      targetPort: http
