# Backup enrollment: one restic Secret and one ReplicationSource per bound PVC, generated by
# Kyverno with core's credential (platform-backups/backups-restic). Git never carries a
# ReplicationSource. A PVC opts out with annotation backup: none. Prune stays off. Deleting a
# policy deletes the objects it generated (synchronize).
#
# Only core's own namespaces, those labelled with a core layer, are enrolled. A namespace without
# the label (a feature's that keeps its own credentials, or one made by hand) never gets core's
# credential; jarvis verify fails its volumes unless they are marked backup: none.
#
# Schedule and retention are the env's cluster-wide values. The rebuild hold
# (kube-system/backup-rebuild-hold) and annotation backup: paused pause the source.
#
# Movers run as root, so a namespace that holds enrolled PVCs carries annotation
# volsync.backube/privileged-movers: "true" in its own manifest.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: pvc-backup
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [persistentvolumeclaims]
    namespaceSelector:
      matchExpressions:
        - key: jarvis.io/layer
          operator: In
          values: [platform, feature]
  matchConditions:
    # volumeName is empty until the claim binds; that UPDATE triggers generation.
    - name: bound
      expression: object.spec.?volumeName.orValue("") != ""
    - name: enrolled
      expression: object.metadata.?annotations["backup"].orValue("") != "none"
    - name: not-a-mover
      expression: object.metadata.?labels["app.kubernetes.io/created-by"].orValue("") != "volsync"
  variables:
    - name: credential
      expression: resource.get("v1", "secrets", "platform-backups", "backups-restic").data
    # A missing ConfigMap is no hold.
    - name: hold
      expression: >-
        dyn(resource.list("v1", "configmaps", "kube-system").items)
        .exists(c, c.metadata.name == "backup-rebuild-hold")
    - name: secret
      expression: >-
        {
          "apiVersion": dyn("v1"),
          "kind": dyn("Secret"),
          "metadata": dyn({"name": "restic-" + object.metadata.name, "namespace": object.metadata.namespace}),
          "type": dyn("Opaque"),
          "data": dyn({
            "RESTIC_PASSWORD": variables.credential.RESTIC_PASSWORD,
            "RESTIC_REST_USERNAME": variables.credential.RESTIC_REST_USERNAME,
            "RESTIC_REST_PASSWORD": variables.credential.RESTIC_REST_PASSWORD,
            "RESTIC_REPOSITORY": base64.encode(bytes(
              string(base64.decode(variables.credential.RESTIC_REPOSITORY))
              + "ns-" + object.metadata.namespace + "/pvc-" + object.metadata.name))
          })
        }
    - name: source
      expression: >-
        {
          "apiVersion": dyn("volsync.backube/v1alpha1"),
          "kind": dyn("ReplicationSource"),
          "metadata": dyn({"name": object.metadata.name, "namespace": object.metadata.namespace}),
          "spec": dyn({
            "paused": variables.hold || object.metadata.?annotations["backup"].orValue("") == "paused",
            "sourcePVC": object.metadata.name,
            "trigger": {"schedule": "${backup_schedule}"},
            "restic": {
              "repository": "restic-" + object.metadata.name,
              "copyMethod": "Direct",
              "cacheCapacity": "1Gi",
              "pruneIntervalDays": 7,
              "retain": {
                "daily": int("${backup_retention_daily}"),
                "weekly": int("${backup_retention_weekly}"),
                "monthly": int("${backup_retention_monthly}"),
                "within": "7d"
              }
            }
          })
        }
  generate:
    - expression: generator.apply(object.metadata.namespace, [variables.secret, variables.source])
