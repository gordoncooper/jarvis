# restic 0.19.1. Version and digest pin; Renovate updates both (renovate.json).
# Reads the k3s snapshot directory. The k3s config is unchanged.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshots
  namespace: platform-backups
  labels:
    app.kubernetes.io/name: etcd-snapshots
spec:
  # Hourly, on its own clock: it copies whatever k3s has written since the last run, so it
  # needs no knowledge of k3s's snapshot schedule. An hour with no new k3s snapshot makes no
  # restic snapshot (--skip-if-unchanged), and forget --prune prunes only when forget removed one.
  schedule: "15 * * * *"
  timeZone: ${time_zone}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-snapshots
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.jarvis.io/control_plane
                        operator: In
                        values: ["true"]
          tolerations:
            - key: node-role.jarvis.io/dedicated
              operator: Equal
              value: "true"
              effect: NoSchedule
          restartPolicy: OnFailure
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              # Snapshot files are mode 0600, owned by root.
              securityContext:
                runAsUser: 0
              env:
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backups-restic
                      key: RESTIC_PASSWORD
                - name: RESTIC_REST_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: backups-restic
                      key: RESTIC_REST_USERNAME
                - name: RESTIC_REST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backups-restic
                      key: RESTIC_REST_PASSWORD
                - name: RESTIC_REPOSITORY_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: backups-restic
                      key: RESTIC_REPOSITORY
                - name: RESTIC_REPOSITORY
                  value: "$(RESTIC_REPOSITORY_PREFIX)host-etcd-snapshots"
                # forget groups by host. The pod name changes every run.
                - name: RESTIC_HOST
                  value: etcd-snapshots
              # cat config exit 10 means the repository is missing.
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  status=0
                  restic cat config >/dev/null || status=$?
                  if [ "$status" -eq 10 ]; then
                    restic init
                  elif [ "$status" -ne 0 ]; then
                    exit "$status"
                  fi
                  restic backup --skip-if-unchanged /snapshots
                  restic forget --prune \
                    --keep-daily=${backup_retention_daily} \
                    --keep-weekly=${backup_retention_weekly} \
                    --keep-monthly=${backup_retention_monthly}
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                  readOnly: true
          volumes:
            - name: snapshots
              hostPath:
                path: ${backup_path}/etcd-snapshots
                type: Directory
