name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one check a merge waits on. Keep it one job until its run time asks for more.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads every commit, so a secret committed and later deleted is still found.
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        # The container runs as root on a checkout the runner's user owns. Without this, git refuses
        # the repository and gitleaks scans no commits, yet still reports no leaks and passes.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --no-banner .

      # Install your stack's tools here, each pinned: a version plus a lockfile or a checksum.

      - name: Checks
        run: bash ci/check
