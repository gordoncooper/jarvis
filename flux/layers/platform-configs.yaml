apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # The root Kustomization in the env's sync.yaml sets ${jarvis_env}.
  path: ./envs/${jarvis_env}/flux/platform-configs
  prune: true
  serviceAccountName: flux-platform
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-controllers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
