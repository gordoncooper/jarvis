---
# The e2e job's Flux bootstrap: the real flux-operator role, on the runner, against the k3d
# cluster at k3s_kubeconfig_path. The job passes the env's cluster-vars as extra vars.
- name: Install Flux Operator on the e2e cluster
  hosts: localhost
  gather_facts: false
  become: false
  roles:
    - role: flux-operator
