apiVersion: hosting.jarvis.io/v1alpha1
kind: App
metadata:
  name: hello-web
spec:
  network:
    web:
      port: 8080
    egress:
      # Granted pair: hello-web calls notes (notes lists hello-web under callers).
      apps: [notes]
      # Any port to a public address, never the LAN or the cluster.
      internet: true
  # No volumes, no risky item, 500m CPU and 512Mi memory for the whole app (the default).
  volumes: []
