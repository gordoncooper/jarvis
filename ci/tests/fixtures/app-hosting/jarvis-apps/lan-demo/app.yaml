apiVersion: hosting.jarvis.io/v1alpha1
kind: App
metadata:
  name: lan-demo
spec:
  # No web address: reached only on its home-network port.
  webPort: none
  volumes: []
  # The risky item: TCP 8080 open to the home network. The cluster refuses the
  # LoadBalancer Service for it unless the env holds the line
  #   - lan-demo: lan-port 8080/TCP
  ports:
    - port: 8080
      protocol: TCP
      lan: true
