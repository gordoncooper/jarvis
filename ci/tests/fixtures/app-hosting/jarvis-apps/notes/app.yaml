apiVersion: hosting.jarvis.io/v1alpha1
kind: App
metadata:
  name: notes
spec:
  network:
    # https://notes.apps.<dns suffix>: core routes it to Service notes, port 80.
    web:
      - service: notes
        port: 80
    # hello-web may call notes (hello-web lists notes under egress.apps).
    callers: [hello-web]
  # One volume, backed up with the app's own credential while the env keeps its backups on
  # (the default; the env's backups: false turns them off).
  volumes:
    - name: data
      backup: true
