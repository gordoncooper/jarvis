apiVersion: hosting.jarvis.io/v1alpha1
kind: App
metadata:
  name: notes
spec:
  network:
    web:
      - service: notes
        port: 80
    egress:
      internet: true
      apps: [photos]
  volumes:
    - name: data
      backup: true
    - name: cache
      backup: false
  resources:
    cpu: "1"
    memory: 1Gi
