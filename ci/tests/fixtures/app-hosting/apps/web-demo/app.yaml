apiVersion: hosting.jarvis.io/v1alpha1
kind: App
metadata:
  name: web-demo
spec:
  network:
    # Routed by its own HTTPRoute (deploy/web.yaml), as an app whose routing one service and
    # port cannot express does; core makes no route for it.
    web:
      - service: web
        port: 80
        ownRoute: true
  volumes: []
