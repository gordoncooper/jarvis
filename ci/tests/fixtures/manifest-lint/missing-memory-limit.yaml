apiVersion: apps/v1
kind: Deployment
metadata:
  name: seeded
  namespace: demo
spec:
  template:
    spec:
      containers:
        - name: app
          image: example@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits: {}
