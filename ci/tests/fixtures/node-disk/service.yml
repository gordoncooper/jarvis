---
- name: Drop-in unit follows the host group
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - ansible.builtin.include_role:
        name: node-disk
        tasks_from: k3s-service.yml
    - ansible.builtin.assert:
        that: node_disk_k3s_service == 'k3s'
      when: "'control_plane' in group_names"
    - ansible.builtin.assert:
        that: node_disk_k3s_service == 'k3s-agent'
      when: "'control_plane' not in group_names"
