# The jarvis package: the jarvis CLI and the Python behind it, its checks, schema and verify. It
# is not published; `make deps` installs it editable into the repo's .venv with uv (uv.lock pins
# every package with hashes; Renovate updates pyproject.toml and uv.lock together). A core release
# is its git tag (CHANGELOG.md), so the version here never moves.
[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "jarvis"
version = "0"
requires-python = ">=3.12"
# What the operator tools and the app-check Action import.
dependencies = [
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "bcrypt==5.0.0",
]

[project.scripts]
jarvis = "jarvis.cli.main:main"

[dependency-groups]
# Ansible, for jarvis site and the role tests.
ops = [
  "ansible==14.6.0",
  "ansible-core==2.21.6",
]
# Everything `make deps` installs: the tools, Ansible and the test and lint tooling.
dev = [
  {include-group = "ops"},
  "pytest==9.2.0",
  "pytest-xdist==3.8.0",
  "pyright==1.1.414",
  "ruff==0.17.4",
]

[tool.uv.build-backend]
module-name = "jarvis"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 120
# The extensionless commands, which ruff would not find by suffix.
extend-include = ["ci/e2e/make-env", "ci/release-notes", "ci/select-tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long lines are mostly prose in messages and test docstrings; no formatter rewrites them.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["jarvis", "support"]

[tool.pyright]
include = ["jarvis"]
pythonVersion = "3.12"
