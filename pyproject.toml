# The jarvis package: the Python behind core's tools, checks, schema and verify. It is not
# published; make deps installs it editable into the repo's venv, and a core release is its git
# tag (CHANGELOG.md), so the version here never moves. Pins live in requirements-dev.txt.
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0"
requires-python = ">=3.12"
dependencies = ["PyYAML", "jsonschema"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
target-version = "py312"
line-length = 120
# The extensionless commands, which ruff would not find by suffix.
extend-include = [
  "ci/e2e/make-env",
  "ci/release-notes",
  "ci/select-tests",
  "tools/age-key-check",
  "tools/app-check",
  "tools/bootstrap-secrets",
  "tools/drill",
  "tools/install-deps",
  "tools/pin-check",
  "tools/prep-node",
  "tools/restore",
  "tools/encrypt",
  "tools/seal",
  "tools/verify/run",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long lines are mostly prose in messages and test docstrings; no formatter rewrites them.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["jarvis", "support"]

[tool.pyright]
include = ["jarvis"]
pythonVersion = "3.12"
