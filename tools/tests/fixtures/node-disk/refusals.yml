---
- name: Disk refusal checks
  hosts: wk-2
  gather_facts: false
  become: false
  vars:
    disk_id: &id /dev/disk/by-id/example-wk-2
    confirmed: &confirmed
      id: *id
      wipe_confirmed: true
    unconfirmed: &unconfirmed
      id: *id
      wipe_confirmed: false
    confirm: &confirm wk-2:/dev/disk/by-id/example-wk-2
    cases:
      - {name: nvme root, path: /dev/nvme0n1, root: /dev/nvme0n1p3, labeled: [], data_disk: *confirmed, confirm: *confirm, expect: is the root disk}
      - {name: sd root, path: /dev/sda, root: /dev/sda2, labeled: [], data_disk: *confirmed, confirm: *confirm, expect: is the root disk}
      - {name: longer nvme name, path: /dev/nvme1n1, root: /dev/nvme1n10p1, labeled: [], data_disk: *confirmed, expect: "model=fixture-model size=1.00 TB partitions=nvme1n1p1"}
      - {name: missing confirm, path: /dev/nvme1n1, root: /dev/nvme0n1p3, labeled: [], data_disk: *confirmed, expect: "model=fixture-model size=1.00 TB partitions=nvme1n1p1"}
      - {name: wipe flag false, path: /dev/nvme1n1, root: /dev/nvme0n1p3, labeled: [], data_disk: *unconfirmed, confirm: *confirm, expect: "model=fixture-model size=1.00 TB partitions=nvme1n1p1"}
      - {name: adopt label, path: /dev/nvme1n1, root: /dev/nvme0n1p3, labeled: [/dev/nvme1n1p1], data_disk: *unconfirmed}
      - {name: label on another disk, path: /dev/nvme1n1, root: /dev/nvme0n1p3, labeled: [/dev/nvme0n1p1], data_disk: *unconfirmed, expect: "model=fixture-model size=1.00 TB partitions=nvme1n1p1"}
  tasks:
    - ansible.builtin.include_tasks: case.yml
      loop: "{{ cases }}"
      loop_control:
        loop_var: case
