---
- name: Disk refusal checks
  hosts: wk-2
  gather_facts: false
  become: false
  vars:
    disk_id: &disk_id /dev/disk/by-id/example-wk-2
    stat_disk: &stat_disk
      exists: true
      islnk: true
      lnk_source: /dev/nvme1n1
    mount_empty: &mount_empty
      exists: false
      isdir: false
    tree_ok: &tree_ok
      blockdevices:
        - name: nvme0n1
          kname: nvme0n1
          path: /dev/nvme0n1
          type: disk
          size: 1T
          mountpoints: []
          children:
            - name: nvme0n1p3
              kname: nvme0n1p3
              path: /dev/nvme0n1p3
              type: part
              partn: 3
              mountpoints: []
              children:
                - name: dm-0
                  kname: dm-0
                  path: /dev/dm-0
                  type: lvm
                  mountpoints: ["/"]
        - name: nvme1n1
          kname: nvme1n1
          path: /dev/nvme1n1
          type: disk
          size: 931.51 GB
          model: Corsair MP600
          mountpoints: []
          children:
            - name: nvme1n1p1
              kname: nvme1n1p1
              path: /dev/nvme1n1p1
              type: part
              partn: 1
              mountpoints: []
    cases:
      - name: no id
        data_disk:
          wipe_confirmed: false
        expect_all:
          - has no id
      - name: wipe_confirmed is not a boolean
        data_disk:
          id: *disk_id
          wipe_confirmed: "true"
        expect_all:
          - must be a boolean
      - name: local path outside the mount
        data_disk:
          id: *disk_id
          wipe_confirmed: false
        local_path_data: /var/lib/k3s
        expect_all:
          - must both be on
          - /var/lib/k3s
      - name: backup path outside the mount
        data_disk:
          id: *disk_id
          wipe_confirmed: false
        backup_path: /var/backups
        expect_all:
          - must both be on
          - /var/backups
      - name: missing disk
        data_disk:
          id: *disk_id
          wipe_confirmed: false
        stat:
          exists: false
        expect_all:
          - does not exist
      - name: partition
        data_disk:
          id: *disk_id
          wipe_confirmed: false
        stat:
          exists: true
          islnk: true
          lnk_source: /dev/nvme1n1p1
        expect_all:
          - not a whole disk
      - name: root mount unknown
        data_disk:
          id: *disk_id
          wipe_confirmed: false
        tree:
          blockdevices:
            - name: nvme1n1
              kname: nvme1n1
              path: /dev/nvme1n1
              type: disk
              size: 931.51 GB
              children:
                - name: nvme1n1p1
                  kname: nvme1n1p1
                  path: /dev/nvme1n1p1
                  type: part
                  partn: 1
        expect_all:
          - cannot see the / mount
      - name: root disk
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        stat:
          exists: true
          islnk: true
          lnk_source: /dev/nvme0n1
        expect_all:
          - is the root disk
          - /dev/dm-0
      - name: mounted elsewhere
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        tree:
          blockdevices:
            - name: nvme0n1
              kname: nvme0n1
              path: /dev/nvme0n1
              type: disk
              mountpoints: []
              children:
                - name: nvme0n1p3
                  kname: nvme0n1p3
                  path: /dev/nvme0n1p3
                  type: part
                  partn: 3
                  mountpoints: ["/"]
            - name: nvme1n1
              kname: nvme1n1
              path: /dev/nvme1n1
              type: disk
              size: 931.51 GB
              model: Corsair MP600
              mountpoints: []
              children:
                - name: nvme1n1p1
                  kname: nvme1n1p1
                  path: /dev/nvme1n1p1
                  type: part
                  partn: 1
                  mountpoints: []
                  children:
                    - name: dm-1
                      kname: dm-1
                      path: /dev/dm-1
                      type: lvm
                      mountpoints: ["/mnt/other"]
        expect_all:
          - mounted at /mnt/other
      - name: second label
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        tree:
          blockdevices:
            - name: nvme0n1
              kname: nvme0n1
              path: /dev/nvme0n1
              type: disk
              mountpoints: []
              children:
                - name: nvme0n1p3
                  kname: nvme0n1p3
                  path: /dev/nvme0n1p3
                  type: part
                  partn: 3
                  label: jarvis-data
                  mountpoints: ["/"]
            - name: nvme1n1
              kname: nvme1n1
              path: /dev/nvme1n1
              type: disk
              size: 931.51 GB
              model: Corsair MP600
              mountpoints: []
              children:
                - name: nvme1n1p1
                  kname: nvme1n1p1
                  path: /dev/nvme1n1p1
                  type: part
                  partn: 1
                  mountpoints: []
        expect_all:
          - another disk already has the label
      - name: non-empty mount point
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        mount_stat:
          exists: true
          isdir: true
        entries: 2
        expect_all:
          - it is not empty
      - name: foreign mount
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        tree:
          blockdevices:
            - name: nvme0n1
              kname: nvme0n1
              path: /dev/nvme0n1
              type: disk
              mountpoints: []
              children:
                - name: nvme0n1p3
                  kname: nvme0n1p3
                  path: /dev/nvme0n1p3
                  type: part
                  partn: 3
                  mountpoints: ["/var/lib/jarvis"]
            - name: nvme1n1
              kname: nvme1n1
              path: /dev/nvme1n1
              type: disk
              mountpoints: []
              children:
                - name: nvme1n1p1
                  kname: nvme1n1p1
                  path: /dev/nvme1n1p1
                  type: part
                  partn: 1
                  mountpoints: []
        expect_all:
          - it is already a mount
      - name: mounted without the label
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        tree:
          blockdevices:
            - name: nvme0n1
              kname: nvme0n1
              path: /dev/nvme0n1
              type: disk
              mountpoints: []
              children:
                - name: nvme0n1p3
                  kname: nvme0n1p3
                  path: /dev/nvme0n1p3
                  type: part
                  partn: 3
                  mountpoints: ["/"]
            - name: nvme1n1
              kname: nvme1n1
              path: /dev/nvme1n1
              type: disk
              mountpoints: []
              children:
                - name: nvme1n1p1
                  kname: nvme1n1p1
                  path: /dev/nvme1n1p1
                  type: part
                  partn: 1
                  mountpoints: ["/var/lib/jarvis"]
        expect_all:
          - without the jarvis-data label
      - name: unconfirmed wipe
        data_disk:
          id: *disk_id
          wipe_confirmed: false
        expect_all:
          - refusing to wipe
          - Corsair MP600
          - 931.51 GB
          - nvme1n1p1
      - name: wrong node
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        confirm: wk-1:/dev/disk/by-id/example-wk-2
        expect_all:
          - refusing to wipe
          - wk-1:/dev/disk/by-id/example-wk-2
          - wk-2:/dev/disk/by-id/example-wk-2
      - name: wrong id
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        confirm: wk-2:/dev/disk/by-id/other
        expect_all:
          - refusing to wipe
          - wk-2:/dev/disk/by-id/other
          - wk-2:/dev/disk/by-id/example-wk-2
      - name: label adoption
        ok: true
        data_disk:
          id: *disk_id
          wipe_confirmed: false
        tree:
          blockdevices:
            - name: nvme0n1
              kname: nvme0n1
              path: /dev/nvme0n1
              type: disk
              mountpoints: []
              children:
                - name: nvme0n1p3
                  kname: nvme0n1p3
                  path: /dev/nvme0n1p3
                  type: part
                  partn: 3
                  mountpoints: ["/"]
            - name: nvme1n1
              kname: nvme1n1
              path: /dev/nvme1n1
              type: disk
              mountpoints: []
              children:
                - name: nvme1n1p1
                  kname: nvme1n1p1
                  path: /dev/nvme1n1p1
                  type: part
                  partn: 1
                  label: jarvis-data
                  mountpoints: []
      - name: label adoption ignores confirmations
        ok: true
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        confirm: wk-2:/dev/disk/by-id/example-wk-2
        tree:
          blockdevices:
            - name: nvme0n1
              kname: nvme0n1
              path: /dev/nvme0n1
              type: disk
              mountpoints: []
              children:
                - name: nvme0n1p3
                  kname: nvme0n1p3
                  path: /dev/nvme0n1p3
                  type: part
                  partn: 3
                  mountpoints: ["/"]
            - name: nvme1n1
              kname: nvme1n1
              path: /dev/nvme1n1
              type: disk
              mountpoints: []
              children:
                - name: nvme1n1p1
                  kname: nvme1n1p1
                  path: /dev/nvme1n1p1
                  type: part
                  partn: 1
                  label: jarvis-data
                  mountpoints: []
      - name: both confirmations
        ok: true
        data_disk:
          id: *disk_id
          wipe_confirmed: true
        confirm: wk-2:/dev/disk/by-id/example-wk-2
  tasks:
    - name: Check one refusal case
      ansible.builtin.include_tasks: case.yml
      loop: "{{ cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"
