---
- name: Reset case result
  ansible.builtin.set_fact:
    got_failure: false
    got_message: ""

- name: Run disk checks
  vars:
    data_disk: "{{ case.data_disk }}"
    local_path_data: "{{ case.local_path_data | default('/var/lib/jarvis/local-path') }}"
    backup_path: "{{ case.backup_path | default('/var/lib/jarvis/backup') }}"
    jarvis_wipe_confirm: "{{ case.confirm | default('') }}"
  block:
    - name: Check the declaration
      ansible.builtin.include_role:
        name: node-disk
        tasks_from: prechecks.yml
    - name: Derive disk facts
      ansible.builtin.include_role:
        name: node-disk
        tasks_from: derive.yml
      vars:
        node_disk_tree: "{{ case.tree | default(tree_ok) }}"
        node_disk_stat: "{{ case.stat | default(stat_disk) }}"
        node_disk_mount_stat: "{{ case.mount_stat | default(mount_empty) }}"
        node_disk_mount_entries: "{{ case.entries | default(0) }}"
    - name: Check the disk
      ansible.builtin.include_role:
        name: node-disk
        tasks_from: checks.yml
  rescue:
    - name: Record the refusal
      ansible.builtin.set_fact:
        got_failure: true
        got_message: "{{ ansible_failed_result.msg | default('') }}"

- name: "{{ case.name }} is refused"
  when: not (case.ok | default(false) | bool)
  ansible.builtin.assert:
    that:
      - got_failure | bool
      - case.expect_all | reject("in", got_message) | list | length == 0
    fail_msg: "case {{ case.name }}: {{ got_message }}"

- name: "{{ case.name }} is allowed"
  when: case.ok | default(false) | bool
  ansible.builtin.assert:
    that:
      - not (got_failure | bool)
    fail_msg: "case {{ case.name }} refused: {{ got_message }}"
